<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cultivo Oficina - Panel Seguro</title>
    <style>
        :root { 
            --bg-color: #121212; 
            --card-bg: #1e1e1e; 
            --text-color: #ffffff; 
            --accent: #4caf50; 
            --alert: #ff5252; 
            --notes-color: #ffb74d; 
        }
        body { 
            font-family: sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            padding: 10px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            margin: 0; 
        }
        
        .header-container { text-align: center; margin-bottom: 15px; margin-top: 10px; }
        .logo-cultivo { font-size: 2.5rem; margin: 0; padding: 0; line-height: 1; }
        h1 { font-size: 1.3rem; color: var(--accent); margin: 5px 0 0 0; font-weight: bold; }
        .badge-version {
            display: inline-block;
            background: rgba(76, 175, 80, 0.15);
            color: var(--accent);
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 12px;
            border: 1px solid var(--accent);
            margin-top: 4px;
        }
        
        .top-controls {
            width: 100%;
            max-width: 600px;
            margin-bottom: 12px;
        }

        .user-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            background: #1b1b1b;
            border: 1px solid #333;
            border-radius: 14px;
            padding: 10px 12px;
            margin-bottom: 12px;
            box-sizing: border-box;
            flex-wrap: wrap;
        }

        .user-bar span {
            color: #aaa;
            font-size: 0.9rem;
        }

        .quick-access {
            width: 100%;
            max-width: 600px;
            margin: 0 auto 15px auto;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 16px;
            padding: 12px;
            box-sizing: border-box;
            box-shadow: 0 4px 8px rgba(0,0,0,0.22);
        }

        .quick-access-title {
            text-align: center;
            color: #cfcfcf;
            font-weight: bold;
            font-size: 0.95rem;
            margin-bottom: 10px;
        }

        .quick-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        .quick-btn {
            border: none;
            border-radius: 14px;
            padding: 14px 10px;
            cursor: pointer;
            width: 100%;
            color: #fff;
            font-weight: bold;
            font-size: 0.9rem;
            min-height: 64px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.25);
            transition: transform 0.15s ease, opacity 0.2s ease;
        }

        .quick-btn:hover { transform: translateY(-1px); opacity: 0.95; }
        .quick-btn .sub { font-size: 0.72rem; opacity: 0.85; font-weight: 500; }
        .quick-btn.sales { background: linear-gradient(135deg, #6a4c93, #8e5bbd); }
        .quick-btn.notes { background: linear-gradient(135deg, #1565c0, #1e88e5); }
        .quick-btn.vegeta { background: linear-gradient(135deg, #2e7d32, #43a047); }
        .quick-btn.report { background: linear-gradient(135deg, #00796b, #009688); }

        .panel-open {
            width: 100%;
            max-width: 600px;
            margin: 0 auto 15px auto;
            display: none;
        }
        .panel-open.visible { display: block; }
        
        /* --- TABLA DE SALES / CALCULADORA --- */
        .sales-panel {
            width: 100%;
            max-width: 600px;
            margin: 0 auto 15px auto;
            background: #1b1b1b;
            border: 1px solid #444;
            border-radius: 12px;
            padding: 10px;
            box-sizing: border-box;
            box-shadow: 0 4px 8px rgba(0,0,0,0.25);
        }

        .sales-title {
            text-align: center;
            color: #ffb74d;
            font-weight: bold;
            font-size: 1.05rem;
            margin: 0 0 8px 0;
        }

        .sales-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }

        .sales-litros {
            width: 90px !important;
            margin: 0 !important;
            padding: 7px 8px !important;
            text-align: center;
            font-weight: bold;
            background: #292929 !important;
        }

        .sales-scroll {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            border-radius: 8px;
        }

        .sales-table {
            width: 100%;
            min-width: 470px;
            border-collapse: collapse;
            font-size: 0.78rem;
            background: #242424;
        }

        .sales-table th,
        .sales-table td {
            border: 1px solid #555;
            padding: 6px 5px;
            text-align: center;
            white-space: nowrap;
        }

        .sales-table th { background: #303030; color: #fff; }
        .sales-table td:first-child { color: #ffcc80; font-weight: bold; }
        .sales-table tr.seleccionada { background: rgba(76, 175, 80, 0.22); outline: 2px solid var(--accent); }

        .bottom-controls {
            width: 100%;
            max-width: 600px;
            margin-top: 18px; 
            margin-bottom: 25px;
            text-align: center;
        }

        .report-btn-main {
            background-color: #009688;
            color: white;
            border: none;
            border-radius: 20px;
            padding: 12px 20px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            width: 100%;
        }

        .panel-container { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); 
            gap: 12px; 
            width: 100%; 
            max-width: 600px; 
        }
        .columna-lado { display: flex; flex-direction: column; gap: 12px; width: 100%; }

        .mesa-card { 
            background-color: var(--card-bg); 
            border-radius: 12px; 
            padding: 12px; 
            text-align: center; 
            border: 2px solid transparent; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.2); 
            position: relative;
        }
        .mesa-card.alerta { border-color: var(--alert); animation: parpadeo 2s infinite; }
        @keyframes parpadeo { 0% { opacity: 1; } 50% { opacity: 0.75; } 100% { opacity: 1; } }

        .semana-info { font-size: 1.1rem; font-weight: bold; margin-top: 5px; }
        
        .notes-display { 
            font-size: 0.8rem; 
            background: rgba(255, 183, 77, 0.15); 
            border: 1px dashed var(--notes-color); 
            color: var(--notes-color); 
            padding: 6px; 
            border-radius: 6px; 
            margin-top: 8px; 
            text-align: left;
            white-space: pre-wrap;
        }

        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 10px; }
        
        button { 
            background-color: var(--accent); 
            color: white; 
            border: none; 
            border-radius: 6px; 
            padding: 8px 4px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 0.8rem;
        }

        .modal { 
            display: none; 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background: rgba(0,0,0,0.85); 
            justify-content: center; 
            align-items: center; 
            z-index: 1000; 
            padding: 10px; 
        }
        .modal-content { 
            background: #222; 
            padding: 20px; 
            border-radius: 12px; 
            width: 100%; 
            max-width: 340px; 
            text-align: center; 
        }
        input, textarea { 
            width: 100%; 
            padding: 10px; 
            margin: 5px 0 15px 0; 
            background: #333; 
            border: 1px solid #555; 
            color: white; 
            border-radius: 6px; 
        }

        .user-list-container {
            max-height: 180px;
            overflow-y: auto;
            border: 1px solid #444;
            background: #181818;
            margin: 10px 0;
            padding: 4px;
        }
        .user-list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px;
            border-bottom: 1px solid #292929;
            font-size: 0.85rem;
        }
        .user-tag { background: #333; color: #ffb74d; padding: 2px 6px; border-radius: 4px; }
    </style>
</head>
<body>

    <div class="header-container">
        <div class="logo-cultivo">🌱</div>
        <h1>Ciclo Cultivo Oficina</h1>
        <div class="badge-version">Sistema Seguro v3.5</div>
    </div>

    <div class="top-controls">
        <div class="user-bar" id="user-bar" style="display:none;"></div>
    </div>
    
    <div class="quick-access">
        <div class="quick-access-title">Panel de Control</div>
        <div class="quick-grid">
            <button class="quick-btn sales" onclick="togglePanel('sales-panel')">🧪 Sales<span class="sub">Tabla EC</span></button>
            <button class="quick-btn notes" onclick="togglePanel('notes-panel')">📝 Notas<span class="sub">Grales</span></button>
            <button class="quick-btn vegeta" onclick="togglePanel('vegeta-panel')">🥦 Vegeta<span class="sub">Mesa Especial</span></button>
            <button class="quick-btn report" onclick="abrirModalReporte()">📋 Reporte<span class="sub">WhatsApp</span></button>
        </div>
    </div>

    <div class="panel-open" id="sales-panel">
        <div class="sales-panel">
            <div class="sales-title">🧪 CALCULADORA DE NUTRIENTES</div>
            <div class="sales-controls">
                <label>Litros:</label>
                <input id="sales-litros" class="sales-litros" type="number" value="10" oninput="actualizarTablaSales()">
            </div>
            <div class="sales-scroll">
                <table class="sales-table">
                    <thead><tr><th>EC</th><th>GROW/BLOOM</th><th>CORE</th></tr></thead>
                    <tbody id="sales-table-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="panel-container" id="mesas-grid-container">
        <div class="columna-lado" id="col-lado-a"></div>
        <div class="columna-lado" id="col-lado-b"></div>
    </div>

    <div class="panel-open" id="vegeta-panel">
        <div class="columna-lado" id="col-vegeta"></div>
    </div>

    <div class="panel-open" id="notes-panel">
        <div class="mesa-card" style="border:1px dashed #4dd0e1;">
            <strong>Notas Generales</strong>
            <textarea id="nota-general-input" placeholder="Anotaciones globales..."></textarea>
            <button onclick="guardarNotaGeneral()">Guardar Cambios</button>
        </div>
    </div>

    <div class="bottom-controls">
        <button class="report-btn-main" onclick="abrirModalReporte()">📋 Generar Reporte Completo</button>
    </div>

    <!-- MODALES -->
    <div class="modal" id="modal-login">
      <div class="modal-content">
        <h3 style="color:var(--accent);">Acceso Cultivo</h3>
        <input id="login-user" placeholder="Usuario" />
        <input id="login-pass" type="password" placeholder="Contraseña" />
        <button id="btn-submit-login" onclick="doLogin()" style="width:100%; padding:12px;">Entrar</button>
        <div id="login-error" style="color:var(--alert); margin-top:10px; display:none;"></div>
      </div>
    </div>

    <!-- GESTIÓN USUARIOS (Solo Admin) -->
    <div class="modal" id="modal-users">
      <div class="modal-content">
        <h3 style="color:#ff9800;">👥 Gestión de Usuarios</h3>
        <div class="user-list-container" id="users-list-box"></div>
        <div style="background:#111; padding:10px; border-radius:8px;">
            <input id="new-user-name" placeholder="Nuevo Usuario" />
            <input id="new-user-pass" type="password" placeholder="Nueva Contraseña" />
            <button style="background:#ff9800; width:100%;" onclick="guardarUsuarioEnFirebase()">Crear Usuario</button>
        </div>
        <button style="background:#555; margin-top:10px;" onclick="cerrarModalUsuarios()">Cerrar</button>
      </div>
    </div>

    <!-- CONFIG MESA -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <h3 id="modal-title">Configurar Mesa</h3>
            <label>Fecha de inicio:</label>
            <input type="date" id="fecha-input">
            <label>Meta (Semanas):</label>
            <input type="number" id="objetivo-input" value="8">
            <button onclick="guardarFecha()">Guardar</button>
            <button style="background:#555;" onclick="cerrarModal()">Cancelar</button>
        </div>
    </div>

    <script>
        const FIREBASE_CONFIG = {
            apiKey: "AIzaSyDfn3GMrVVNeHl0VT_H03pOXApmV4Q2Yyg",
            authDomain: "cultivo-oficina.firebaseapp.com",
            databaseURL: "https://cultivo-oficina-default-rtdb.firebaseio.com",
            projectId: "cultivo-oficina",
            storageBucket: "cultivo-oficina.firebasestorage.app",
            messagingSenderId: "226128922982",
            appId: "1:226128922982:web:81cb9814c5d107e4f260a7"
        };

        const STORAGE_KEY = 'datosCultivoV3_FirebaseApp';
        const AUTH_STORAGE_KEY = 'cultivo_user_v1';
        let datos = {};
        let usuariosFirebase = {};
        let firebaseDb, firebaseRef, firebaseGet, firebaseSet, firebaseRemove;

        async function iniciarFirebase() {
            try {
                const appModule = await import("https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js");
                const dbModule = await import("https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js");
                const app = appModule.initializeApp(FIREBASE_CONFIG);
                firebaseDb = dbModule.getDatabase(app);
                firebaseRef = dbModule.ref;
                firebaseGet = dbModule.get;
                firebaseSet = dbModule.set;
                firebaseRemove = dbModule.remove;
                return true;
            } catch (e) { return false; }
        }

        async function sha256(message) { 
            const msgBuffer = new TextEncoder().encode(message); 
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer); 
            return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join(''); 
        }

        function getSessionUser() { 
            const s = JSON.parse(localStorage.getItem(AUTH_STORAGE_KEY) || 'null'); 
            return s ? s.user : null; 
        }

        async function doLogin() {
            const user = document.getElementById('login-user').value.trim().toLowerCase();
            const pass = document.getElementById('login-pass').value;
            if (!user || !pass) return;

            await iniciarFirebase();
            const snapshot = await firebaseGet(firebaseRef(firebaseDb, "cultivoOficina/usuarios"));
            const users = snapshot.val() || {};
            
            const passHash = await sha256(pass);
            if (users[user] === passHash) {
                localStorage.setItem(AUTH_STORAGE_KEY, JSON.stringify({ user, ts: Date.now() }));
                location.reload();
            } else {
                document.getElementById('login-error').innerText = "Credenciales incorrectas";
                document.getElementById('login-error').style.display = "block";
            }
        }

        async function afterLogin() {
            const currentUser = getSessionUser();
            if (!currentUser) {
                document.getElementById('modal-login').style.display = 'flex';
                return;
            }

            const isAdmin = (currentUser === 'benja'); // CAMBIA ESTO PARA OTROS ADMINS
            const userBar = document.getElementById('user-bar');
            userBar.style.display = 'flex';
            userBar.innerHTML = `
                <div style="width:100%; display:flex; justify-content:space-between; align-items:center;">
                    <span>👤 <strong>${currentUser}</strong></span>
                    <div style="display:flex; gap:5px;">
                        ${isAdmin ? `<button onclick="abrirModalUsuarios()" style="background:#ff9800; color:#000;">👥 Usuarios</button>` : ''}
                        <button onclick="logout()" style="background:#e65100;">Salir</button>
                    </div>
                </div>
            `;

            await iniciarFirebase();
            const snap = await firebaseGet(firebaseRef(firebaseDb, "cultivoOficina/datos"));
            datos = snap.val() || {};
            inicializarApp();
        }

        function logout() { localStorage.removeItem(AUTH_STORAGE_KEY); location.reload(); }

        // --- LÓGICA DE MESAS ---
        function calcularTiempoExacto(fecha) {
            if (!fecha) return { semanas: 0, diasRestantes: 0 };
            const hoy = new Date();
            const inicio = new Date(fecha);
            inicio.setHours(0,0,0,0); hoy.setHours(0,0,0,0);
            const diff = hoy.getTime() - inicio.getTime();
            const diasTotales = Math.max(0, Math.floor(diff / (1000 * 60 * 60 * 24)));
            return { semanas: Math.floor(diasTotales / 7), diasRestantes: diasTotales % 7 };
        }

        function inicializarApp() {
            const containers = { 
                'A': document.getElementById('col-lado-a'), 
                'B': document.getElementById('col-lado-b'), 
                'VEGETA': document.getElementById('col-vegeta') 
            };
            Object.values(containers).forEach(c => c.innerHTML = '');

            const mesas = [];
            for(let i=1; i<=6; i++) { mesas.push({id:'A'+i, lado:'A'}); mesas.push({id:'B'+i, lado:'B'}); }
            mesas.push({id:'VEGETA', lado:'VEGETA'});

            mesas.forEach(m => {
                const d = datos[m.id] || {};
                const card = document.createElement('div');
                card.className = 'mesa-card';
                const t = calcularTiempoExacto(d.fecha);
                
                let color = '#1b1b1b';
                if (d.fecha) {
                    if (t.semanas >= (d.objetivo || 8)) card.classList.add('alerta');
                    color = t.semanas <= 3 ? '#2e7d32' : (t.semanas <= 6 ? '#fbc02d' : '#d32f2f');
                }

                card.style.backgroundColor = color;
                card.innerHTML = `
                    <strong>${m.id === 'VEGETA' ? 'VEGETA' : 'Mesa ' + m.id}</strong>
                    ${d.fecha ? `<div class="semana-info">${t.semanas}s y ${t.diasRestantes}d</div>` : '<p>Sin iniciar</p>'}
                    ${d.notas ? `<div class="notes-display">${d.notas}</div>` : ''}
                    <div class="btn-group">
                        <button onclick="abrirModal('${m.id}')">⚙️</button>
                        <button style="background:#2196f3;" onclick="abrirModalNotas('${m.id}')">📝</button>
                    </div>
                `;
                containers[m.lado].appendChild(card);
            });
        }

        // --- GESTION USUARIOS ---
        async function abrirModalUsuarios() {
            document.getElementById('modal-users').style.display = 'flex';
            const snap = await firebaseGet(firebaseRef(firebaseDb, "cultivoOficina/usuarios"));
            const users = snap.val() || {};
            const box = document.getElementById('users-list-box');
            box.innerHTML = Object.keys(users).map(u => `
                <div class="user-list-item">
                    <span class="user-tag">${u}</span>
                    <button style="background:red; padding:2px 5px;" onclick="eliminarUsuario('${u}')">X</button>
                </div>
            `).join('');
        }

        async function guardarUsuarioEnFirebase() {
            const u = document.getElementById('new-user-name').value.trim().toLowerCase();
            const p = document.getElementById('new-user-pass').value;
            if (!u || !p) return;
            const hash = await sha256(p);
            await firebaseSet(firebaseRef(firebaseDb, `cultivoOficina/usuarios/${u}`), hash);
            abrirModalUsuarios();
        }

        async function eliminarUsuario(u) {
            if (u === 'benja') return alert("No puedes eliminar al admin principal");
            await firebaseRemove(firebaseRef(firebaseDb, `cultivoOficina/usuarios/${u}`));
            abrirModalUsuarios();
        }

        function cerrarModalUsuarios() { document.getElementById('modal-users').style.display = 'none'; }

        // --- SALES ---
        const SALES_BASE = [
            { ec: 0.5, grow: 2.8, core: 1.7 }, { ec: 1.0, grow: 6.1, core: 3.6 },
            { ec: 1.5, grow: 9.4, core: 5.7 }, { ec: 2.0, grow: 12.9, core: 7.7 },
            { ec: 2.5, grow: 16.5, core: 9.9, especial: true }
        ];

        function actualizarTablaSales() {
            const litros = parseFloat(document.getElementById('sales-litros').value) || 10;
            const body = document.getElementById('sales-table-body');
            body.innerHTML = SALES_BASE.map(s => `
                <tr class="${s.especial ? 'seleccionada' : ''}">
                    <td>${s.ec}</td>
                    <td>${(s.grow * litros / 10).toFixed(1)}g</td>
                    <td>${(s.core * litros / 10).toFixed(1)}g</td>
                </tr>
            `).join('');
        }

        function togglePanel(id) {
            const p = document.getElementById(id);
            const isV = p.style.display === 'block';
            document.querySelectorAll('.panel-open').forEach(x => x.style.display = 'none');
            p.style.display = isV ? 'none' : 'block';
            if (id === 'sales-panel') actualizarTablaSales();
        }

        // --- INICIO ---
        window.onload = afterLogin;

        // Funciones de cierre de modales genéricas
        function cerrarModal() { document.getElementById('modal').style.display='none'; }
        let idActual = "";
        function abrirModal(id) { 
            idActual = id; 
            document.getElementById('modal').style.display='flex';
            document.getElementById('fecha-input').value = datos[id]?.fecha || '';
        }
        async function guardarFecha() {
            const f = document.getElementById('fecha-input').value;
            const o = document.getElementById('objetivo-input').value;
            if (!datos[idActual]) datos[idActual] = {};
            datos[idActual].fecha = f;
            datos[idActual].objetivo = parseInt(o);
            await firebaseSet(firebaseRef(firebaseDb, "cultivoOficina/datos"), datos);
            cerrarModal();
            inicializarApp();
        }
    </script>
</body>
</html>
