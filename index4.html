<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ciclo Cultivo Oficina v2.8 - Notas sin fecha</title>
    <style>
        :root { 
            --bg-color: #121212; 
            --card-bg: #1e1e1e; 
            --text-color: #ffffff; 
            --accent: #4caf50; 
            --alert: #ff5252; 
            --notes-color: #ffb74d; 
        }
        body { 
            font-family: sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            padding: 10px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            margin: 0; 
        }
        
        .header-container { text-align: center; margin-bottom: 15px; margin-top: 10px; }
        .logo-cultivo { font-size: 2.5rem; margin: 0; padding: 0; line-height: 1; }
        h1 { font-size: 1.3rem; color: var(--accent); margin: 5px 0 0 0; font-weight: bold; }
        

        /* --- TABLA DE SALES / CALCULADORA --- */
        .sales-panel {
            width: 100%;
            max-width: 600px;
            margin: 0 auto 15px auto;
            background: #1b1b1b;
            border: 1px solid #444;
            border-radius: 12px;
            padding: 10px;
            box-sizing: border-box;
            box-shadow: 0 4px 8px rgba(0,0,0,0.25);
        }

        .sales-title {
            text-align: center;
            color: #ffb74d;
            font-weight: bold;
            font-size: 1.05rem;
            margin: 0 0 8px 0;
        }

        .sales-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }

        .sales-controls label {
            display: inline;
            margin: 0;
            color: #ddd;
            font-weight: bold;
        }

        .sales-litros {
            width: 90px !important;
            margin: 0 !important;
            padding: 7px 8px !important;
            text-align: center;
            font-weight: bold;
            background: #292929 !important;
        }

        .sales-scroll {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            border-radius: 8px;
        }

        .sales-table {
            width: 100%;
            min-width: 470px;
            border-collapse: collapse;
            font-size: 0.78rem;
            background: #242424;
        }

        .sales-table th,
        .sales-table td {
            border: 1px solid #555;
            padding: 6px 5px;
            text-align: center;
            white-space: nowrap;
        }

        .sales-table th {
            background: #303030;
            color: #fff;
            font-weight: bold;
        }

        .sales-table td:first-child {
            color: #ffcc80;
            font-weight: bold;
        }

        .sales-table .gramos {
            color: #fff;
            font-weight: bold;
        }

        .sales-table .por-litro {
            color: #4dd0e1;
            font-size: 0.72rem;
        }

        .sales-table tr.seleccionada {
            background: rgba(76, 175, 80, 0.22);
            outline: 2px solid var(--accent);
            outline-offset: -2px;
        }

        .sales-note {
            text-align: center;
            color: #999;
            font-size: 0.68rem;
            margin-top: 6px;
        }

        @media (max-width: 480px) {
            .sales-panel { padding: 7px; }
            .sales-table { font-size: 0.72rem; min-width: 440px; }
            .sales-table th, .sales-table td { padding: 5px 4px; }
        }

        .top-controls {
            width: 100%;
            max-width: 600px;
            margin-bottom: 15px;
        }

        .audio-status { 
            background: #333; 
            padding: 10px; 
            border-radius: 20px; 
            font-size: 0.85rem; 
            cursor: pointer; 
            border: 1px solid #555; 
            transition: all 0.3s; 
            text-align: center; 
            box-sizing: border-box; 
        }
        .audio-status.activo { border-color: var(--accent); color: var(--accent); background: #1b3a22; }

        .bottom-controls {
            width: 100%;
            max-width: 600px;
            margin-top: 25px; 
            margin-bottom: 25px;
            text-align: center;
        }

        .report-btn-main {
            background-color: #009688;
            color: white;
            border: none;
            border-radius: 20px;
            padding: 12px 20px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.2s;
            border: 1px solid #00796b;
            width: 100%;
            box-sizing: border-box;
        }
        .report-btn-main:hover { background-color: #00796b; }

        /* Contenedor principal adaptativo */
        .panel-container { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); 
            gap: 12px; 
            width: 100%; 
            max-width: 600px; 
        }
        .columna-lado { display: flex; flex-direction: column; gap: 12px; width: 100%; }

        .vegeta-container { width: 100%; max-width: 600px; margin-top: 15px; }

        .columna-titulo { text-align: center; font-weight: bold; margin-bottom: 5px; color: #aaaaaa; font-size: 1rem; border-bottom: 1px solid #333; padding-bottom: 5px; }
        .mesa-card { 
            background-color: var(--card-bg); 
            border-radius: 12px; 
            padding: 12px; 
            text-align: center; 
            border: 2px solid transparent; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.2); 
            position: relative;
            transition: all 0.3s ease;
        }
        .mesa-card.alerta { border-color: var(--alert); animation: parpadeo 2s infinite; }
        .mesa-card.alerta-poda { border-color: #ffeb3b; animation: parpadeo 1.5s infinite; }

        @keyframes parpadeo { 0% { opacity: 1; } 50% { opacity: 0.75; } 100% { opacity: 1; } }
        .semana-info { font-size: 1.1rem; font-weight: bold; margin-top: 5px; }
        .dia-info { 
            font-size: 0.85rem; 
            color: #ffffff; 
            font-weight: 500; 
            margin-bottom: 5px; 
            background: rgba(0,0,0,0.2); 
            display: inline-block; 
            padding: 4px 8px; 
            border-radius: 4px; 
            margin-top: 5px;
        }
        .objetivo-info { font-size: 0.75rem; color: #bbbbbb; margin-top: 8px; font-style: italic; }
        
        .notes-display { 
            font-size: 0.8rem; 
            background: rgba(255, 183, 77, 0.15); 
            border: 1px dashed var(--notes-color); 
            color: var(--notes-color); 
            padding: 6px; 
            border-radius: 6px; 
            margin-top: 8px; 
            text-align: left;
            white-space: pre-wrap;
        }
        .atencion-display { 
            font-size: 0.8rem; 
            background: rgba(255, 82, 82, 0.2); 
            border: 1px solid var(--alert); 
            color: #ff8a80; 
            padding: 6px; 
            border-radius: 6px; 
            margin-top: 8px; 
            text-align: center;
        }
        .nota-general-display {
            font-size: 0.8rem;
            background: rgba(77, 208, 225, 0.14);
            border: 1px dashed #4dd0e1;
            color: #4dd0e1;
            padding: 6px;
            border-radius: 6px;
            margin-top: 8px;
            text-align: left;
            white-space: pre-wrap;
        }

        .poda-tag { background: #ffeb3b; color: #000; font-weight: bold; font-size: 0.8rem; padding: 4px 8px; border-radius: 4px; margin-top: 8px; display: inline-block; }

        .btn-group { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 6px; 
            margin-top: 10px; 
        }
        
        button { 
            background-color: var(--accent); 
            color: white; 
            border: none; 
            border-radius: 6px; 
            padding: 8px 4px; 
            cursor: pointer; 
            width: 100%; 
            font-weight: bold; 
            font-size: 0.8rem; 
            box-sizing: border-box; 
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 34px;
            transition: background 0.2s;
        }
        button:hover {
            opacity: 0.9;
        }
        button.notes-btn { background-color: #2196f3; } 
        button.atencion-btn { background-color: #e65100; color: white; }
        button.atencion-btn.con-enfermedad { background-color: var(--alert); }
        
        button.reset-btn { 
            background-color: #cf6679; 
            grid-column: span 1; 
        }
        
        button.whatsapp-btn { background-color: #25D366; color: black; font-size: 0.9rem; margin-bottom: 6px; border: 1px solid #1ebd59; }
        button.whatsapp-btn:hover { background-color: #1ebd59; }

        .modal { 
            display: none; 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0,0,0,0.8); 
            justify-content: center; 
            align-items: center; 
            z-index: 1000; 
            padding: 10px;
            box-sizing: border-box;
        }
        .modal-content { 
            background: #222; 
            padding: 20px; 
            border-radius: 12px; 
            width: 100%; 
            max-width: 320px; 
            text-align: center; 
            box-sizing: border-box; 
        }
        input, textarea { 
            width: 100%; 
            padding: 10px; 
            margin: 5px 0 15px 0; 
            background: #333; 
            border: 1px solid #555; 
            color: white; 
            box-sizing: border-box; 
            border-radius: 6px; 
            font-family: sans-serif;
        }
        textarea { resize: vertical; min-height: 80px; }
        label { display: block; text-align: left; font-size: 0.9rem; color: #aaa; margin-top: 10px; }
        
        .report-textarea { font-family: monospace; font-size: 0.85rem; height: 180px; background: #111; color: #4caf50; border: 1px solid #333; }

        @media (max-width: 480px) {
            .panel-container {
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }
            .logo-cultivo { font-size: 2rem; }
            h1 { font-size: 1.1rem; }
            .mesa-card { padding: 8px 6px; }
            .semana-info { font-size: 0.95rem; }
            .dia-info { font-size: 0.75rem; padding: 2px 4px; }
            button { font-size: 0.75rem; padding: 6px 2px; min-height: 30px; }
        }
    </style>
</head>
<body>

    <div class="header-container">
        <div class="logo-cultivo">🌱</div>
        <h1>Ciclo Cultivo Oficina</h1>
    </div>

    <div class="top-controls">
    </div>
    

    <!-- TABLA DE SALES -->
    <div class="sales-panel" id="sales-panel">
        <div class="sales-title">🧪 SALES = GRAMOS × 10L</div>

        <div class="sales-controls">
            <label for="sales-litros">Litros:</label>
            <input id="sales-litros" class="sales-litros" type="number"
                   min="0.1" step="0.1" value="10" inputmode="decimal"
                   oninput="actualizarTablaSales()" aria-label="Cantidad de litros">
        </div>

        <div class="sales-scroll">
            <table class="sales-table" aria-label="Tabla de sales">
                <thead>
                    <tr>
                        <th>EC</th>
                        <th>GROW / BLOOM</th>
                        <th>CORE</th>
                    </tr>
                </thead>
                <tbody id="sales-table-body"></tbody>
            </table>
        </div>

        <div class="sales-note">
            Modificá los litros y los gramos se recalculan automáticamente.
        </div>
    </div>

    <div class="panel-container">
        <div class="columna-lado" id="col-lado-a"></div>
        <div class="columna-lado" id="col-lado-b"></div>
    </div>

    <div class="vegeta-container" id="col-vegeta"></div>

    <div class="bottom-controls">
        <button class="report-btn-main" onclick="abrirModalReporte()" aria-label="Generar reporte de tiempos">📋 Generar Reporte de Tiempos</button>
    </div>

    <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-content">
            <h3 id="modal-title" style="margin-top:0; color:var(--accent);">Configurar Mesa</h3>
            <label for="fecha-input">Fecha de inicio:</label>
            <input type="date" id="fecha-input">
            <label for="objetivo-input">¿En qué semana avisar?:</label>
            <input type="number" id="objetivo-input" value="8" min="1">
            <button onclick="guardarFecha()" aria-label="Guardar configuración">Guardar</button>
            <button style="background:#555; margin-top: 4px;" onclick="cerrarModal()" aria-label="Cancelar">Cancelar</button>
        </div>
    </div>

    <div class="modal" id="modal-notes" role="dialog" aria-modal="true" aria-labelledby="modal-notas-title">
        <div class="modal-content">
            <h3 id="modal-notas-title" style="margin-top:0; color:#2196f3;">Notas de la Mesa</h3>
            <label for="notas-input">Escribí tus anotaciones:</label>
            <textarea id="notas-input" placeholder="Ej: Agregar nutrientes&#10;Revisar pH los martes..."></textarea>
            <button style="background:#2196f3;" onclick="guardarNota()" aria-label="Guardar nota">Guardar Nota</button>
            <button style="background:#555; margin-top: 4px;" onclick="cerrarModalNotas()" aria-label="Cancelar">Cancelar</button>
        </div>
    </div>

    <div class="modal" id="modal-report">
        <div class="modal-content" style="width: 100%; max-width: 340px;">
            <h3 style="margin-top:0; color:#009688;">Reporte de Producción</h3>
            <textarea id="report-text-output" class="report-textarea" readonly></textarea>
            <button class="whatsapp-btn" onclick="compartirWhatsApp()" aria-label="Enviar por WhatsApp">💬 Enviar por WhatsApp</button>
            <button style="background:#555;" onclick="cerrarModalReporte()" aria-label="Cerrar reporte">Cerrar</button>
        </div>
    </div>

    <!-- LOGIN MODAL -->
    <div class="modal" id="modal-login" role="dialog" aria-modal="true" aria-labelledby="login-title">
      <div class="modal-content">
        <h3 id="login-title" style="margin-top:0; color:var(--accent);">Acceso - Cultivo Oficina</h3>
        <label for="login-user">Usuario:</label>
        <input id="login-user" autocomplete="username" />
        <label for="login-pass">Contraseña:</label>
        <input id="login-pass" type="password" autocomplete="current-password" />
        <div style="display:flex; gap:8px; justify-content:center;">
          <button onclick="doLogin()" aria-label="Ingresar">Ingresar</button>
          <button style="background:#555;" onclick="cerrarLogin()" aria-label="Cancelar">Cancelar</button>
        </div>
        <div id="login-error" style="color:#ff8a80; margin-top:8px; display:none;"></div>
      </div>
    </div>

    <script>
        const STORAGE_KEY = 'datosCultivoV3_Final';
        const GENERAL_NOTES_KEY = 'notasGeneralesCultivoV1';
        const FIREBASE_CONFIG = {
            apiKey: "AIzaSyDfn3GMrVVNeHl0VT_H03pOXApmV4Q2Yyg",
            authDomain: "cultivo-oficina.firebaseapp.com",
            databaseURL: "https://cultivo-oficina-default-rtdb.firebaseio.com",
            projectId: "cultivo-oficina",
            storageBucket: "cultivo-oficina.firebasestorage.app",
            messagingSenderId: "226128922982",
            appId: "1:226128922982:web:81cb9814c5d107e4f260a7",
            measurementId: "G-JTGH6W87MY"
        };


        // --- TABLA DE SALES ---
        const SALES_BASE = [
            { ec: 0.5, grow: 2.8, core: 1.7 },
            { ec: 1.0, grow: 6.1, core: 3.6 },
            { ec: 1.5, grow: 9.4, core: 5.7 },
            { ec: 1.8, grow: 11.1, core: 6.8 },
            { ec: 2.0, grow: 12.9, core: 7.7 },
            { ec: 2.5, grow: 16.5, core: 9.9, especial: true },
            { ec: 3.0, grow: 20.3, core: 12.2 }
        ];

        function formatearNumeroSales(valor) {
            return Number(valor).toLocaleString('es-AR', {
                minimumFractionDigits: 1,
                maximumFractionDigits: 2
            });
        }

        function actualizarTablaSales() {
            const litrosInput = document.getElementById('sales-litros');
            const tbody = document.getElementById('sales-table-body');
            if (!litrosInput || !tbody) return;

            let litros = parseFloat(String(litrosInput.value).replace(',', '.'));
            if (!Number.isFinite(litros) || litros <= 0) litros = 10;

            const filas = SALES_BASE.map(item => {
                const grow = item.grow * litros / 10;
                const core = item.core * litros / 10;
                const clase = item.especial ? ' class="seleccionada"' : '';
                const marca = item.especial ? ' *' : '';

                return `
                    <tr${clase}>
                        <td>${formatearNumeroSales(item.ec)}${marca}</td>
                        <td>
                            <span class="gramos">${formatearNumeroSales(grow)} g</span>
                            <span class="por-litro"> / ${formatearNumeroSales(item.grow / 10)} g/L</span>
                        </td>
                        <td>
                            <span class="gramos">${formatearNumeroSales(core)} g</span>
                            <span class="por-litro"> / ${formatearNumeroSales(item.core / 10)} g/L</span>
                        </td>
                    </tr>
                `;
            }).join('');

            tbody.innerHTML = filas;
        }

        let datos = {};
        let firebaseApp = null;
        let firebaseDb = null;
        let firebaseGet = null;
        let firebaseSet = null;
        let firebaseRemove = null;
        let firebaseRef = null;
        let firebaseDisponible = false;
        let cargandoDatosFirebase = false;

        function getCachedData() {
            try {
                const datosLocales = localStorage.getItem(STORAGE_KEY);
                return datosLocales ? JSON.parse(datosLocales) : {};
            } catch (e) {
                console.error("Error al leer la copia local.", e);
                return {};
            }
        }

        function getCachedGeneralNotes() {
            try {
                return localStorage.getItem(GENERAL_NOTES_KEY) || '';
            } catch (e) {
                return '';
            }
        }

        function guardarCopiaLocal() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(datos));
            } catch (e) {
                console.error('No se pudo guardar la copia local', e);
            }
        }

        function guardarCopiaLocalNotasGenerales(valor) {
            try {
                localStorage.setItem(GENERAL_NOTES_KEY, valor || '');
            } catch (e) {
                console.error('No se pudo guardar la nota general local', e);
            }
        }

        async function iniciarFirebase() {
            if (firebaseDisponible) return true;

            try {
                const appModule = await import("https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js");
                const dbModule = await import("https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js");

                firebaseApp = appModule.initializeApp(FIREBASE_CONFIG);
                firebaseDb = dbModule.getDatabase(firebaseApp);
                firebaseGet = dbModule.get;
                firebaseSet = dbModule.set;
                firebaseRemove = dbModule.remove;
                firebaseRef = dbModule.ref;
                firebaseDisponible = true;

                console.log("Firebase conectado correctamente.");
                return true;
            } catch (e) {
                firebaseDisponible = false;
                console.error("No se pudo inicializar Firebase:", e);
                return false;
            }
        }

        function getRutaDatosUsuario() {
            if (!getSessionUser()) throw new Error("No hay un usuario autenticado.");
            return "cultivoOficina/datos";
        }

        async function cargarDatosFirebase() {
            cargandoDatosFirebase = true;

            const conectado = await iniciarFirebase();
            if (!conectado) {
                datos = getCachedData();
                cargandoDatosFirebase = false;
                return false;
            }

            try {
                const snapshot = await firebaseGet(
                    dbModuleRef(getRutaDatosUsuario())
                );
                datos = snapshot.exists() ? (snapshot.val() || {}) : {};
                guardarCopiaLocal();
                cargandoDatosFirebase = false;
                return true;
            } catch (e) {
                console.error("No se pudieron cargar los datos desde Firebase:", e);
                datos = getCachedData();
                cargandoDatosFirebase = false;
                return false;
            }
        }

        function dbModuleRef(path) {
            return firebaseRef(firebaseDb, path);
        }

        async function guardarDatosFirebase() {
            guardarCopiaLocal();

            if (!firebaseDisponible) {
                const conectado = await iniciarFirebase();
                if (!conectado) return false;
            }

            try {
                const ruta = getRutaDatosUsuario();
                if (Object.keys(datos).length === 0) {
                    await firebaseRemove(dbModuleRef(ruta));
                } else {
                    await firebaseSet(dbModuleRef(ruta), datos);
                }
                return true;
            } catch (e) {
                console.error("No se pudo guardar en Firebase:", e);
                return false;
            }
        }

        async function guardarNotaGeneral() {
            const valor = document.getElementById('nota-general-input')?.value || '';
            guardarCopiaLocalNotasGenerales(valor);
        }

        async function sha256(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        const AUTH_STORAGE_KEY = 'cultivo_user_v1';
        const ALLOWED_USERS = {
            'benja': '920fc495b85fbf9f71cfe710f490b96f3d30b11641d4dfe879fb13e150e4d314',
            'pablito': '920fc495b85fbf9f71cfe710f490b96f3d30b11641d4dfe879fb13e150e4d314',
            'elo': '920fc495b85fbf9f71cfe710f490b96f3d30b11641d4dfe879fb13e150e4d314',
            'cami': '920fc495b85fbf9f71cfe710f490b96f3d30b11641d4dfe879fb13e150e4d314',
        };

        function abrirLogin() {
          document.getElementById('modal-login').style.display = 'flex';
          document.getElementById('login-user').value = '';
          document.getElementById('login-pass').value = '';
          document.getElementById('login-error').style.display = 'none';
        }
        function cerrarLogin() {
          document.getElementById('modal-login').style.display = 'none';
        }

        function getSessionUser() {
          try {
            const s = JSON.parse(localStorage.getItem(AUTH_STORAGE_KEY) || 'null');
            return s && s.user ? s.user : null;
          } catch (e) { return null; }
        }

        async function doLogin() {
          const user = document.getElementById('login-user').value.trim().toLowerCase();
          const pass = document.getElementById('login-pass').value || '';
          const errEl = document.getElementById('login-error');
          errEl.style.display = 'none';
          
          if (!user || !pass) {
            errEl.innerText = 'Completar usuario y contraseña';
            errEl.style.display = 'block';
            return;
          }

          if (!ALLOWED_USERS[user]) {
            errEl.innerText = 'Usuario no autorizado';
            errEl.style.display = 'block';
            return;
          }

          const passHash = await sha256(pass);
          if (passHash === ALLOWED_USERS[user]) {
            localStorage.setItem(AUTH_STORAGE_KEY, JSON.stringify({ user, ts: Date.now() }));
            cerrarLogin();
            afterLogin();
          } else {
            errEl.innerText = 'Usuario o contraseña incorrectos';
            errEl.style.display = 'block';
          }
        }

        function logout() {
          localStorage.removeItem(AUTH_STORAGE_KEY);
          location.reload();
        }

        async function afterLogin() {
          const top = document.querySelector('.top-controls');

            btn.style.display = 'flex';
            btn.style.justifyContent = 'space-between';
            btn.style.alignItems = 'center';

        function escaparHTML(texto) {
            if (texto === undefined || texto === null) return '';
            return String(texto)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/\"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function obtenerEstructuraMesas() {
            let listaMesas = [];
            for (let i = 1; i <= 6; i++) {
                listaMesas.push({ id: 'A' + i, lado: 'A', etiqueta: `Mesa A${i}`, contenedor: 'col-lado-a' });
                listaMesas.push({ id: 'B' + i, lado: 'B', etiqueta: `Mesa B${i}`, contenedor: 'col-lado-b' });
            }
            listaMesas.push({ id: 'VEGETA', lado: 'VEGETA', etiqueta: 'Mesa VEGETA 🥦', contenedor: 'col-vegeta' });
            return listaMesas;
        }

        function inicializarApp() {
            const contB = document.getElementById('col-lado-b');

            if (contB) contB.innerHTML = '<div class="columna-titulo">Lado B</div>';

            let listaMesas = obtenerEstructuraMesas();

            listaMesas.forEach(m => {
                const id = m.id;
                const data = datos[id];

                let notasEscapadas = data?.notas ? escaparHTML(data.notas).replace(/\n/g, '<br>') : '';
                let notesHTML = notasEscapadas ? `<div class="notes-display"><strong>Notas:</strong><br>${notasEscapadas}</div>` : '';
                let atencionHTML = data?.atencion ? `<div class="atencion-display">⚠️ ATENCIÓN: ${escaparHTML(data.atencion)}</div>` : '';
                let claseBtnAtencion = data?.atencion ? 'atencion-btn con-enfermedad' : 'atencion-btn';

                if (data && data.fecha) {
                    const infoTiempo = calcularTiempoExacto(data.fecha);
                    const requierePoda = infoTiempo.semanas === 3;
                    const esAlertaMeta = data.objetivo !== undefined && infoTiempo.semanas >= data.objetivo;

                    let podaTagHTML = '';

                    if (requierePoda) {
                        card.classList.add('alerta-poda');
                        card.style.backgroundColor = '#4e342e'; 
                        podaTagHTML = '<br><div class="poda-tag">⚠️ ¡PODAR!</div>';
                    } else if (esAlertaMeta) { 
                        card.classList.add('alerta'); 
                        card.style.backgroundColor = '#b71c1c'; 
                    } else { 
                        card.style.backgroundColor = obtenerColorPorSemana(infoTiempo.semanas); 
                    }

                    let textoTiempo = `${infoTiempo.semanas} ${infoTiempo.semanas === 1 ? 'sem' : 'sems'}`;
                    if (infoTiempo.diasRestantes > 0) {
                        textoTiempo += ` y ${infoTiempo.diasRestantes}d`;

                    const partesFecha = (data.fecha || '').split("-");

                    card.innerHTML = `
                        <strong style="color: #ffffff; font-size:0.9rem;">${m.etiqueta}</strong>
                        <div style="font-size: 0.7rem; color: #aaaaaa; margin-top: 2px;">Inicio: ${fechaFormateada}</div>
                        <div class="semana-info">${textoTiempo}</div>

                    card.style.backgroundColor = 'var(--card-bg)';

                            <button class="reset-btn" onclick="resetearMesa('${id}', event)" aria-label="Vaciar ${m.etiqueta}">Vaciar</button>

                } else {
                    card.style.backgroundColor = 'var(--card-bg)';

                    card.innerHTML = `

                            <button class="${claseBtnAtencion}" onclick="gestionarAtencion('${id}', event)" aria-label="Alerta ${m.etiqueta}">Alerta</button>
                            <div style="visibility: hidden;"></div> 
                        </div>
                    `;
                }

                const contenedorDestino = document.getElementById(m.contenedor);
                if (contenedorDestino) {
                    contenedorDestino.appendChild(card);
                }
            });

            const contVFinal = document.getElementById('col-vegeta');
            if (contVFinal && !document.getElementById('nota-general-vegeta-card')) {
                const generalCard = document.createElement('div');
                generalCard.className = 'mesa-card';
                generalCard.id = 'nota-general-vegeta-card';
                generalCard.style.border = '1px dashed #4dd0e1';
                generalCard.style.backgroundColor = 'var(--card-bg)';
                const notaGeneral = getCachedGeneralNotes();
                generalCard.innerHTML = `
                    <strong style="color:#ffffff; display:block; margin-bottom:5px; font-size:0.9rem;">Notas generales</strong>
                    <textarea id="nota-general-input" placeholder="Escribí acá notas generales del cultivo..." style="min-height:120px; margin-bottom:8px;">${escaparHTML(notaGeneral)}</textarea>
                    <button style="background:#009688;" onclick="guardarNotaGeneral();" aria-label="Guardar notas generales">Guardar notas generales</button>
                `;
                contVFinal.appendChild(generalCard);

        }

        async function gestionarAtencion(id, event) {
            event.stopPropagation();
            let nombreTitulo = id === 'VEGETA' ? 'Mesa VEGETA' : `Mesa ${id.charAt(0)}-${id.slice(1)}`;
            
            let seleccion = prompt(
                `Seleccioná una enfermedad para ${nombreTitulo}:\n\n` +
                `1 - Oidio\n` +
                `2 - Araña\n` +
                `3 - Otro (Escribir personalizado)\n` +
                `4 - Ninguna (Limpiar atención)`
            );

            if (seleccion === null) return;

            let enfermedad = "";
            if (seleccion.trim() === "1") {
                enfermedad = "Oidio";
            } else if (seleccion.trim() === "2") {
                enfermedad = "Araña";
            } else if (seleccion.trim() === "3") {
                let otraEnfermedad = prompt("Ingresá el nombre de la enfermedad o problema:");
                if (otraEnfermedad && otraEnfermedad.trim() !== "") {
                    enfermedad = otraEnfermedad.trim();
                } else {
                    return; 
                }
            } else if (seleccion.trim() === "4") {
                enfermedad = "";
            } else {
                alert("Opción no válida.");
                return;
            }

            if (!datos[id]) {
                if (enfermedad !== "") {
                    datos[id] = { fecha: "", objetivo: 8, notas: "", atencion: enfermedad };
                }
            } else {
                datos[id].atencion = enfermedad;
                if (!datos[id].fecha && !datos[id].notas && !datos[id].atencion) {
                    delete datos[id];
                }
            }

            await guardarDatosFirebase();
            inicializarApp();
        }

        function calcularTiempoExacto(fecha) {
            if (!fecha) return { semanas: 0, diasRestantes: 0, diasTotales: 0 };
            const hoy = new Date();
            const partes = (fecha || '').split("-");
            let inicio;
            if (partes.length === 3) {
                inicio = new Date(Number(partes[0]), Number(partes[1]) - 1, Number(partes[2]));
            } else {
                inicio = new Date(fecha);
            }

            if (isNaN(inicio.getTime())) return { semanas: 0, diasRestantes: 0, diasTotales: 0 };

            inicio.setHours(0,0,0,0); 
            hoy.setHours(0,0,0,0);
            
            const diff = hoy.getTime() - inicio.getTime();
            let diasTotales = Math.floor(diff / (1000 * 60 * 60 * 24));
            if (diasTotales < 0) diasTotales = 0;

            const semanas = Math.floor(diasTotales / 7);
            const diasRestantes = diasTotales % 7; 

            return { semanas, diasRestantes, diasTotales };
        }

        function obtenerColorPorSemana(s) {
            if (s <= 2) return '#1b4d3e'; 
            if (s <= 4) return '#2e6f40';
            if (s <= 6) return '#5d6d2f'; 
            if (s <= 8) return '#7a681a';
            return '#8c4f1d';
        }
