<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cultivo Oficina - Interno</title>
    <style>
        :root { 
            --bg-color: #121212; 
            --card-bg: #1e1e1e; 
            --text-color: #ffffff; 
            --accent: #4caf50; 
            --alert: #ff5252; 
            --notes-color: #ffb74d; 
        }
        body { 
            font-family: sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            padding: 10px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            margin: 0; 
        }
        
        .header-container { text-align: center; margin-bottom: 15px; margin-top: 10px; }
        .logo-cultivo { font-size: 2.5rem; margin: 0; padding: 0; line-height: 1; }
        h1 { font-size: 1.3rem; color: var(--accent); margin: 5px 0 0 0; font-weight: bold; }
        
        .top-controls { width: 100%; max-width: 600px; margin-bottom: 12px; }

        .user-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            background: #1b1b1b;
            border: 1px solid #333;
            border-radius: 14px;
            padding: 10px 12px;
            margin-bottom: 12px;
            box-sizing: border-box;
        }

        .quick-access {
            width: 100%; max-width: 600px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 16px;
            padding: 12px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        .quick-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

        .quick-btn {
            border: none; border-radius: 14px; padding: 14px 10px; cursor: pointer;
            color: #fff; font-weight: bold; font-size: 0.9rem; min-height: 64px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .quick-btn.sales { background: linear-gradient(135deg, #6a4c93, #8e5bbd); }
        .quick-btn.notes { background: linear-gradient(135deg, #1565c0, #1e88e5); }
        .quick-btn.vegeta { background: linear-gradient(135deg, #2e7d32, #43a047); }
        .quick-btn.report { background: linear-gradient(135deg, #00796b, #009688); }

        .panel-open { width: 100%; max-width: 600px; display: none; margin-bottom: 15px; }

        .sales-panel { background: #1b1b1b; border: 1px solid #444; border-radius: 12px; padding: 10px; }
        .sales-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; background: #242424; }
        .sales-table th, .sales-table td { border: 1px solid #555; padding: 8px; text-align: center; }
        .sales-table tr.seleccionada { background: rgba(76, 175, 80, 0.2); outline: 1px solid var(--accent); }

        .panel-container { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; max-width: 600px; }
        .columna-lado { display: flex; flex-direction: column; gap: 12px; }

        .mesa-card { background: var(--card-bg); border-radius: 12px; padding: 12px; text-align: center; border: 2px solid transparent; }
        .mesa-card.alerta { border-color: var(--alert); }
        
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 10px; }
        button { background: var(--accent); color: white; border: none; border-radius: 6px; padding: 8px 4px; cursor: pointer; font-weight: bold; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #222; padding: 20px; border-radius: 12px; width: 90%; max-width: 340px; text-align: center; }
        input, textarea { width: 100%; padding: 10px; margin: 5px 0 15px 0; background: #333; border: 1px solid #555; color: white; border-radius: 6px; box-sizing: border-box; }

        .user-list-container { max-height: 150px; overflow-y: auto; background: #111; margin: 10px 0; border-radius: 6px; }
        .user-list-item { display: flex; justify-content: space-between; padding: 8px; border-bottom: 1px solid #222; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="header-container">
        <div class="logo-cultivo">🌱</div>
        <h1>Cultivo Oficina</h1>
    </div>

    <div class="top-controls">
        <div class="user-bar" id="user-bar" style="display:none;"></div>
    </div>
    
    <div class="quick-access">
        <div class="quick-grid">
            <button class="quick-btn sales" onclick="togglePanel('sales-panel')">🧪 Sales</button>
            <button class="quick-btn notes" onclick="togglePanel('notes-panel')">📝 Notas</button>
            <button class="quick-btn vegeta" onclick="togglePanel('vegeta-panel')">🥦 Vegeta</button>
            <button class="quick-btn report" onclick="abrirModalReporte()">📋 Reporte</button>
        </div>
    </div>

    <!-- PANEL SALES -->
    <div class="panel-open" id="sales-panel">
        <div class="sales-panel">
            <h3 style="color:#ffb74d; margin-top:0;">Calculadora Sales (10L)</h3>
            <input id="sales-litros" type="number" value="10" oninput="actualizarTablaSales()" style="width:80px; text-align:center;"> Litros
            <table class="sales-table">
                <thead><tr><th>EC</th><th>GROW</th><th>CORE</th></tr></thead>
                <tbody id="sales-table-body"></tbody>
            </table>
        </div>
    </div>

    <!-- GRILLA MESAS -->
    <div class="panel-container">
        <div class="columna-lado" id="col-lado-a"></div>
        <div class="columna-lado" id="col-lado-b"></div>
    </div>

    <!-- PANEL VEGETA -->
    <div class="panel-open" id="vegeta-panel">
        <div id="col-vegeta" style="max-width:300px; margin:auto;"></div>
    </div>

    <!-- PANEL NOTAS -->
    <div class="panel-open" id="notes-panel">
        <div class="mesa-card" style="border:1px dashed #4dd0e1;">
            <strong>Notas Generales</strong>
            <textarea id="nota-general-input" placeholder="Escribir notas..."></textarea>
            <button onclick="guardarNotaGeneral()">Guardar</button>
        </div>
    </div>

    <!-- MODAL LOGIN -->
    <div class="modal" id="modal-login">
      <div class="modal-content">
        <h3 style="color:var(--accent);">Acceso Requerido</h3>
        <input id="login-user" placeholder="Usuario" />
        <input id="login-pass" type="password" placeholder="Contraseña" />
        <button onclick="doLogin()" style="width:100%; padding:12px;">Entrar al Sistema</button>
        <div id="login-error" style="color:var(--alert); margin-top:10px; display:none;"></div>
      </div>
    </div>

    <!-- MODAL GESTION USUARIOS (Solo dentro) -->
    <div class="modal" id="modal-users">
      <div class="modal-content">
        <h3 style="color:#ff9800;">👥 Gestión de Usuarios</h3>
        <div class="user-list-container" id="users-list-box"></div>
        <div style="background:#1a1a1a; padding:10px; border-radius:8px; margin-top:10px;">
            <input id="new-user-name" placeholder="Nombre de usuario" />
            <input id="new-user-pass" type="password" placeholder="Contraseña" />
            <button style="background:#ff9800; width:100%; color:black;" onclick="guardarUsuarioEnFirebase()">+ Crear Usuario</button>
        </div>
        <button style="background:#555; margin-top:10px;" onclick="cerrarModalUsuarios()">Cerrar</button>
      </div>
    </div>

    <!-- MODAL CONFIG MESA -->
    <div class="modal" id="modal-config">
        <div class="modal-content">
            <h3 id="modal-title">Configurar</h3>
            <input type="date" id="fecha-input">
            <input type="number" id="objetivo-input" value="8" placeholder="Meta semanas">
            <button onclick="guardarConfigMesa()">Guardar</button>
            <button style="background:#555;" onclick="cerrarModal()">Cancelar</button>
        </div>
    </div>

    <script>
        const FIREBASE_CONFIG = {
            apiKey: "AIzaSyDfn3GMrVVNeHl0VT_H03pOXApmV4Q2Yyg",
            authDomain: "cultivo-oficina.firebaseapp.com",
            databaseURL: "https://cultivo-oficina-default-rtdb.firebaseio.com",
            projectId: "cultivo-oficina",
            storageBucket: "cultivo-oficina.firebasestorage.app",
            messagingSenderId: "226128922982",
            appId: "1:226128922982:web:81cb9814c5d107e4f260a7"
        };

        const AUTH_KEY = 'cultivo_session';
        let datos = {};
        let firebaseDb, firebaseRef, firebaseGet, firebaseSet, firebaseRemove;

        async function initFirebase() {
            const appMod = await import("https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js");
            const dbMod = await import("https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js");
            const app = appMod.initializeApp(FIREBASE_CONFIG);
            firebaseDb = dbMod.getDatabase(app);
            firebaseRef = dbMod.ref; firebaseGet = dbMod.get; firebaseSet = dbMod.set; firebaseRemove = dbMod.remove;
        }

        async function sha256(msg) {
            const buf = new TextEncoder().encode(msg);
            const hash = await crypto.subtle.digest('SHA-256', buf);
            return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function doLogin() {
            const u = document.getElementById('login-user').value.toLowerCase().trim();
            const p = document.getElementById('login-pass').value;
            await initFirebase();
            const snap = await firebaseGet(firebaseRef(firebaseDb, "cultivoOficina/usuarios"));
            const users = snap.val() || {};
            const hash = await sha256(p);
            if (users[u] === hash) {
                localStorage.setItem(AUTH_KEY, JSON.stringify({user: u}));
                location.reload();
            } else {
                const err = document.getElementById('login-error');
                err.innerText = "Usuario o clave incorrectos"; err.style.display = 'block';
            }
        }

        function logout() { localStorage.removeItem(AUTH_KEY); location.reload(); }

        async function checkAuth() {
            const session = JSON.parse(localStorage.getItem(AUTH_KEY));
            if (!session) {
                document.getElementById('modal-login').style.display = 'flex';
                return;
            }
            await initFirebase();
            
            // Mostrar barra de usuario con botón de gestión para TODOS
            const userBar = document.getElementById('user-bar');
            userBar.style.display = 'flex';
            userBar.innerHTML = `
                <span style="color:#aaa; font-size:0.8rem;">👤 <strong>${session.user}</strong></span>
                <div style="display:flex; gap:5px;">
                    <button onclick="abrirModalUsuarios()" style="background:#ff9800; color:black; font-size:0.7rem; padding:5px 10px;">👥 Usuarios</button>
                    <button onclick="logout()" style="background:#444; font-size:0.7rem; padding:5px 10px;">Salir</button>
                </div>
            `;

            const snap = await firebaseGet(firebaseRef(firebaseDb, "cultivoOficina/datos"));
            datos = snap.val() || {};
            const notesSnap = await firebaseGet(firebaseRef(firebaseDb, "cultivoOficina/notasGenerales"));
            document.getElementById('nota-general-input').value = notesSnap.val() || "";
            renderMesas();
        }

        function renderMesas() {
            const containers = { A: document.getElementById('col-lado-a'), B: document.getElementById('col-lado-b'), V: document.getElementById('col-vegeta') };
            Object.values(containers).forEach(c => c.innerHTML = "");
            
            const lista = [];
            for(let i=1; i<=6; i++){ lista.push({id:'A'+i, lado:'A'}); lista.push({id:'B'+i, lado:'B'}); }
            lista.push({id:'VEGETA', lado:'V'});

            lista.forEach(m => {
                const d = datos[m.id] || {};
                const card = document.createElement('div');
                card.className = 'mesa-card';
                let info = "Sin fecha";
                if(d.fecha){
                    const hoy = new Date(); const inicio = new Date(d.fecha);
                    const diff = Math.max(0, Math.floor((hoy - inicio)/(1000*60*60*24)));
                    const s = Math.floor(diff/7); const r = diff%7;
                    info = `${s} sem y ${r}d`;
                    if(s >= (d.objetivo||8)) card.classList.add('alerta');
                    card.style.background = s <= 3 ? '#1b3a20' : (s <= 6 ? '#3a3a1b' : '#3a1b1b');
                }
                card.innerHTML = `
                    <div style="font-weight:bold; font-size:0.9rem; margin-bottom:5px;">${m.id}</div>
                    <div style="font-size:1.1rem; font-weight:bold;">${info}</div>
                    <div class="btn-group">
                        <button onclick="abrirConfig('${m.id}')">⚙️</button>
                        <button style="background:#2196f3;" onclick="abrirConfig('${m.id}')">📝</button>
                    </div>
                `;
                containers[m.lado].appendChild(card);
            });
        }

        let idActual = "";
        function abrirConfig(id) { idActual = id; document.getElementById('modal-config').style.display='flex'; }
        function cerrarModal() { document.getElementById('modal-config').style.display='none'; }

        async function guardarConfigMesa() {
            if(!datos[idActual]) datos[idActual] = {};
            datos[idActual].fecha = document.getElementById('fecha-input').value;
            datos[idActual].objetivo = document.getElementById('objetivo-input').value;
            await firebaseSet(firebaseRef(firebaseDb, "cultivoOficina/datos"), datos);
            cerrarModal(); renderMesas();
        }

        async function guardarNotaGeneral() {
            const val = document.getElementById('nota-general-input').value;
            await firebaseSet(firebaseRef(firebaseDb, "cultivoOficina/notasGenerales"), val);
            alert("Notas guardadas");
        }

        // GESTIÓN USUARIOS
        async function abrirModalUsuarios() {
            document.getElementById('modal-users').style.display = 'flex';
            const snap = await firebaseGet(firebaseRef(firebaseDb, "cultivoOficina/usuarios"));
            const users = snap.val() || {};
            const box = document.getElementById('users-list-box');
            box.innerHTML = Object.keys(users).map(u => `
                <div class="user-list-item">
                    <span>${u}</span>
                    <button style="background:red; padding:2px 8px;" onclick="eliminarUsuario('${u}')">Borrar</button>
                </div>
            `).join('');
        }

        async function guardarUsuarioEnFirebase() {
            const u = document.getElementById('new-user-name').value.toLowerCase().trim();
            const p = document.getElementById('new-user-pass').value;
            if(!u || !p) return;
            const hash = await sha256(p);
            await firebaseSet(firebaseRef(firebaseDb, `cultivoOficina/usuarios/${u}`), hash);
            abrirModalUsuarios();
        }

        async function eliminarUsuario(u) {
            if(confirm(`¿Eliminar a ${u}?`)) {
                await firebaseRemove(firebaseRef(firebaseDb, `cultivoOficina/usuarios/${u}`));
                abrirModalUsuarios();
            }
        }
        function cerrarModalUsuarios() { document.getElementById('modal-users').style.display = 'none'; }

        function togglePanel(id) {
            const p = document.getElementById(id);
            const isV = p.style.display === 'block';
            document.querySelectorAll('.panel-open').forEach(x => x.style.display='none');
            p.style.display = isV ? 'none' : 'block';
            if(id === 'sales-panel') actualizarTablaSales();
        }

        function actualizarTablaSales() {
            const litros = document.getElementById('sales-litros').value || 10;
            const base = [{ec:0.5,g:2.8,c:1.7},{ec:1.0,g:6.1,c:3.6},{ec:1.5,g:9.4,c:5.7},{ec:2.0,g:12.9,c:7.7},{ec:2.5,g:16.5,c:9.9, esp:true}];
            document.getElementById('sales-table-body').innerHTML = base.map(s => `
                <tr class="${s.esp?'seleccionada':''}">
                    <td>${s.ec}</td>
                    <td>${(s.g*litros/10).toFixed(1)}g</td>
                    <td>${(s.c*litros/10).toFixed(1)}g</td>
                </tr>
            `).join('');
        }

        function abrirModalReporte() {
            let txt = "REPORTE CULTIVO\n";
            Object.keys(datos).forEach(k => {
                const d = datos[k]; if(!d.fecha) return;
                const diff = Math.floor((new Date() - new Date(d.fecha))/(1000*60*60*24));
                txt += `${k}: Sem ${Math.floor(diff/7)} (${diff%7}d)\n`;
            });
            window.open(`https://wa.me/?text=${encodeURIComponent(txt)}`);
        }

        window.onload = checkAuth;
    </script>
</body>
</html>
