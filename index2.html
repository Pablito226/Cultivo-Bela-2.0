<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ciclo Cultivo Oficina v2.8 - Notas sin fecha</title>
    <style>
        :root { 
            --bg-color: #121212; 
            --card-bg: #1e1e1e; 
            --text-color: #ffffff; 
            --accent: #4caf50; 
            --alert: #ff5252; 
            --notes-color: #ffb74d; 
        }
        body { 
            font-family: sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            padding: 10px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            margin: 0; 
        }
        
        .header-container { text-align: center; margin-bottom: 15px; margin-top: 10px; }
        .logo-cultivo { font-size: 2.5rem; margin: 0; padding: 0; line-height: 1; }
        h1 { font-size: 1.3rem; color: var(--accent); margin: 5px 0 0 0; font-weight: bold; }
        
        .top-controls {
            width: 100%;
            max-width: 600px;
            margin-bottom: 12px;
        }

        .user-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            background: #1b1b1b;
            border: 1px solid #333;
            border-radius: 14px;
            padding: 10px 12px;
            margin-bottom: 12px;
            box-sizing: border-box;
        }

        .user-bar span {
            color: #aaa;
            font-size: 0.9rem;
        }

        .quick-access {
            width: 100%;
            max-width: 600px;
            margin: 0 auto 15px auto;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 16px;
            padding: 12px;
            box-sizing: border-box;
            box-shadow: 0 4px 8px rgba(0,0,0,0.22);
        }

        .quick-access-title {
            text-align: center;
            color: #cfcfcf;
            font-weight: bold;
            font-size: 0.95rem;
            margin-bottom: 10px;
        }

        .quick-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        .quick-btn {
            border: none;
            border-radius: 14px;
            padding: 14px 10px;
            cursor: pointer;
            width: 100%;
            color: #fff;
            font-weight: bold;
            font-size: 0.9rem;
            min-height: 64px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.25);
            transition: transform 0.15s ease, opacity 0.2s ease;
        }

        .quick-btn:hover { transform: translateY(-1px); opacity: 0.95; }
        .quick-btn .sub { font-size: 0.72rem; opacity: 0.85; font-weight: 500; }
        .quick-btn.sales { background: linear-gradient(135deg, #6a4c93, #8e5bbd); }
        .quick-btn.notes { background: linear-gradient(135deg, #1565c0, #1e88e5); }
        .quick-btn.vegeta { background: linear-gradient(135deg, #2e7d32, #43a047); }
        .quick-btn.report { background: linear-gradient(135deg, #00796b, #009688); }

        .panel-open {
            width: 100%;
            max-width: 600px;
            margin: 0 auto 15px auto;
            display: none;
        }
        .panel-open.visible { display: block; }
        
        /* --- TABLA DE SALES / CALCULADORA --- */
        .sales-panel {
            width: 100%;
            max-width: 600px;
            margin: 0 auto 15px auto;
            background: #1b1b1b;
            border: 1px solid #444;
            border-radius: 12px;
            padding: 10px;
            box-sizing: border-box;
            box-shadow: 0 4px 8px rgba(0,0,0,0.25);
        }

        .sales-title {
            text-align: center;
            color: #ffb74d;
            font-weight: bold;
            font-size: 1.05rem;
            margin: 0 0 8px 0;
        }

        .sales-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }

        .sales-controls label {
            display: inline;
            margin: 0;
            color: #ddd;
            font-weight: bold;
        }

        .sales-litros {
            width: 90px !important;
            margin: 0 !important;
            padding: 7px 8px !important;
            text-align: center;
            font-weight: bold;
            background: #292929 !important;
        }

        .sales-scroll {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            border-radius: 8px;
        }

        .sales-table {
            width: 100%;
            min-width: 470px;
            border-collapse: collapse;
            font-size: 0.78rem;
            background: #242424;
        }

        .sales-table th,
        .sales-table td {
            border: 1px solid #555;
            padding: 6px 5px;
            text-align: center;
            white-space: nowrap;
        }

        .sales-table th {
            background: #303030;
            color: #fff;
            font-weight: bold;
        }

        .sales-table td:first-child {
            color: #ffcc80;
            font-weight: bold;
        }

        .sales-table .gramos {
            color: #fff;
            font-weight: bold;
        }

        .sales-table .por-litro {
            color: #90caf9;
            font-weight: 500;
        }

        .container { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 8px; 
            width: 100%; 
            max-width: 600px; 
        }
        .nave { display: flex; flex-direction: column; gap: 8px; }
        .nave-title { 
            text-align: center; 
            font-weight: bold; 
            color: #888; 
            margin-bottom: 2px; 
            text-transform: uppercase; 
            font-size: 0.85rem; 
        }
        
        .card { 
            background-color: var(--card-bg); 
            border: 2px solid #333; 
            border-radius: 10px; 
            padding: 8px 6px; 
            text-align: center; 
            cursor: pointer; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            box-sizing: border-box; 
            position: relative;
            min-height: 82px;
        }
        .card.activa { border-color: var(--accent); background-color: #1a2e1a; }
        .card.alerta { border-color: var(--alert) !important; background-color: #3a1a1a !important; }
        
        .mesa-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            width: 100%; 
            margin-bottom: 4px;
        }
        .mesa-name { font-size: 1rem; font-weight: bold; }
        
        .mini-btn {
            background: #333;
            border: none;
            color: #ccc;
            border-radius: 4px;
            padding: 2px 6px;
            font-size: 0.75rem;
            cursor: pointer;
        }
        .mini-btn:hover { background: #555; color: #fff; }
        
        .card-notas-btn {
            background: #2d2d2d;
            border: 1px solid #444;
            color: #aaa;
            border-radius: 5px;
            padding: 3px 6px;
            font-size: 0.75rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            line-height: 1;
        }
        .card-notas-btn:hover { background: #3d3d3d; color: #fff; }
        .card-notas-btn.tiene-nota {
            background: #3e2723;
            border-color: #ff9800;
            color: #ffcc80;
            font-weight: bold;
        }

        .info-cultivo {
            font-size: 0.85rem;
            font-weight: bold;
            color: #4caf50;
            display: flex;
            justify-content: center;
            align-items: baseline;
            gap: 4px;
            margin-top: auto;
            margin-bottom: auto;
        }
        .info-cultivo .dias-extra {
            font-size: 0.72rem;
            color: #a5d6a7;
            font-weight: normal;
        }
        .info-cultivo .meta {
            font-size: 0.75rem;
            color: #aaa;
            font-weight: normal;
        }
        
        .estado-vacio {
            color: #777;
            font-size: 0.8rem;
            margin-top: auto;
            margin-bottom: auto;
        }
        
        .tag-atencion {
            background-color: var(--alert);
            color: white;
            font-size: 0.65rem;
            font-weight: bold;
            padding: 2px 4px;
            border-radius: 4px;
            margin-top: 4px;
            display: block;
            text-transform: uppercase;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* MODAL */
        .modal { 
            display: none; 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background: rgba(0,0,0,0.85); 
            justify-content: center; 
            align-items: center; 
            z-index: 100; 
        }
        .modal-content { 
            background: var(--card-bg); 
            padding: 18px; 
            border-radius: 12px; 
            width: 90%; 
            max-width: 360px; 
            border: 1px solid #444; 
            box-sizing: border-box;
        }
        
        label { display: block; margin: 10px 0 4px 0; font-size: 0.85rem; color: #ccc; text-align: left; }
        input, select, textarea { 
            width: 100%; 
            padding: 9px; 
            background: #2a2a2a; 
            border: 1px solid #444; 
            color: white; 
            border-radius: 6px; 
            box-sizing: border-box; 
            font-size: 0.95rem; 
        }
        textarea { resize: vertical; }
        
        .btn-group { display: flex; gap: 8px; margin-top: 15px; }
        button.action-btn { 
            flex: 1; 
            padding: 10px; 
            border: none; 
            border-radius: 6px; 
            font-weight: bold; 
            cursor: pointer; 
        }
        .btn-guardar { background: var(--accent); color: white; }
        .btn-cancelar { background: #444; color: white; }
        .btn-vaciar { background: #333; color: var(--alert); border: 1px solid var(--alert) !important; margin-top: 8px; width: 100%; padding: 8px; border-radius: 6px; font-weight: bold; cursor: pointer;}
        
        .notes-panel {
            width: 100%;
            max-width: 600px;
            margin: 0 auto 15px auto;
            background: #1b1b1b;
            border: 1px solid #444;
            border-radius: 12px;
            padding: 10px;
            box-sizing: border-box;
            box-shadow: 0 4px 8px rgba(0,0,0,0.25);
        }

        .notes-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .notes-title {
            color: var(--notes-color);
            font-weight: bold;
            font-size: 0.95rem;
            margin: 0;
        }

        .notes-textarea {
            width: 100%;
            min-height: 120px;
            background: #242424;
            border: 1px solid #444;
            border-radius: 8px;
            color: #fff;
            padding: 8px;
            box-sizing: border-box;
            font-size: 0.9rem;
            line-height: 1.35;
        }
        .report-textarea {
            width: 100%;
            min-height: 160px;
            background: #242424;
            border: 1px solid #444;
            border-radius: 8px;
            color: #fff;
            padding: 8px;
            box-sizing: border-box;
            font-size: 0.85rem;
            line-height: 1.35;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .btn-ws {
            background: #25d366;
            color: #fff;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            padding: 10px;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <div class="header-container">
        <div class="logo-cultivo">🪴</div>
        <h1>Ciclo Cultivo Oficina</h1>
    </div>

    <div class="top-controls">
        <div class="user-bar">
            <span>Usuario: <strong id="current-user-display" style="color:#4caf50;">-</strong></span>
            <div>
                <button id="btn-login" class="mini-btn" onclick="abrirLogin()">Ingresar</button>
                <button id="btn-logout" class="mini-btn" onclick="logout()" style="display:none;">Salir</button>
            </div>
        </div>

        <div class="quick-access">
            <div class="quick-access-title">Acceso Rápido</div>
            <div class="quick-grid">
                <button type="button" class="quick-btn sales" onclick="toggleSeccionRapida('sales')">
                    <span>🧪 Sales</span>
                    <span class="sub">Calculadora rápida</span>
                </button>
                <button type="button" class="quick-btn notes" onclick="toggleSeccionRapida('notes')">
                    <span>📋 Notas</span>
                    <span class="sub">Apuntes generales</span>
                </button>
                <button type="button" class="quick-btn vegeta" onclick="abrirModalVegetaRapido()">
                    <span>🌱 Vegeta</span>
                    <span class="sub">Mesa vegetativo</span>
                </button>
                <button type="button" class="quick-btn report" onclick="abrirModalReporte()">
                    <span>📊 Reporte</span>
                    <span class="sub">WhatsApp / Resumen</span>
                </button>
            </div>
        </div>
    </div>

    <div id="panel-sales" class="panel-open">
        <div class="sales-panel">
            <div class="sales-title">Tabla de Sales / Litro</div>
            <div class="sales-controls">
                <label for="sales-litros-input">Litros:</label>
                <input id="sales-litros-input" class="sales-litros" type="number" min="1" step="0.5" value="20" oninput="actualizarTablaSales()" />
            </div>
            <div class="sales-scroll">
                <table class="sales-table">
                    <thead>
                        <tr>
                            <th>Semana</th>
                            <th>BASE (g)</th>
                            <th>VEGE (g)</th>
                            <th>BLOOM (g)</th>
                            <th>EPSOM (g)</th>
                        </tr>
                    </thead>
                    <tbody id="sales-table-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="panel-notes" class="panel-open">
        <div class="notes-panel">
            <div class="notes-header">
                <div class="notes-title">Notas Generales</div>
                <button class="mini-btn" onclick="guardarNotaGeneral()">Guardar</button>
            </div>
            <textarea id="nota-general-input" class="notes-textarea" placeholder="Escribí acá notas generales del cultivo, recordatorios, tareas..." oninput="guardarNotaGeneral()"></textarea>
        </div>
    </div>

    <div class="container" id="grid-mesas">
        <!-- Generado dinámicamente -->
    </div>

    <!-- MODAL EDITAR MESA -->
    <div id="modal-mesa" class="modal">
        <div class="modal-content">
            <h3 id="modal-titulo" style="margin-top:0; color:var(--accent);">Mesa</h3>
            <label for="input-fecha">Fecha de pase a 12/12:</label>
            <input type="date" id="input-fecha">
            <label for="input-objetivo">Objetivo de semanas:</label>
            <input type="number" id="input-objetivo" min="1" max="20" value="8">
            <label for="input-atencion">Atención / Alerta:</label>
            <input type="text" id="input-atencion" placeholder="Ej: Plaga, exceso, lavar...">
            <div class="btn-group">
                <button class="action-btn btn-cancelar" onclick="cerrarModal()">Cancelar</button>
                <button class="action-btn btn-guardar" onclick="guardarDatosMesa()">Guardar</button>
            </div>
            <button class="btn-vaciar" onclick="vaciarMesaActual()">Vaciar / Reiniciar Mesa</button>
        </div>
    </div>

    <!-- MODAL NOTAS -->
    <div id="modal-notes" class="modal">
        <div class="modal-content">
            <h3 id="modal-notes-titulo" style="margin-top:0; color:var(--notes-color);">Notas de Mesa</h3>
            <label for="notas-input">Detalles / Variedades / Tareas:</label>
            <textarea id="notas-input" rows="5" placeholder="Escribe aquí notas sobre esta mesa..."></textarea>
            <div class="btn-group">
                <button class="action-btn btn-cancelar" onclick="cerrarModalNotas()">Cancelar</button>
                <button class="action-btn btn-guardar" onclick="guardarNota()">Guardar Nota</button>
            </div>
        </div>
    </div>

    <!-- MODAL LOGIN -->
    <div id="modal-login" class="modal">
        <div class="modal-content">
            <h3 style="margin-top:0; color:var(--accent);">Ingreso de Usuario</h3>
            <label for="login-user">Usuario:</label>
            <input type="text" id="login-user" placeholder="Nombre de usuario" autocomplete="username">
            <label for="login-pass">Contraseña:</label>
            <input type="password" id="login-pass" placeholder="Contraseña" autocomplete="current-password">
            <div id="login-error" style="color:var(--alert); font-size:0.8rem; margin-top:8px; display:none;"></div>
            <div class="btn-group">
                <button class="action-btn btn-cancelar" onclick="cerrarLogin()">Cancelar</button>
                <button class="action-btn btn-guardar" onclick="doLogin()">Ingresar</button>
            </div>
        </div>
    </div>

    <!-- MODAL REPORTE -->
    <div id="modal-report" class="modal">
        <div class="modal-content">
            <h3 style="margin-top:0; color:#009688;">Reporte de Estado</h3>
            <textarea id="report-text-output" class="report-textarea" readonly></textarea>
            <button class="btn-ws" onclick="compartirWhatsApp()">📲 Enviar por WhatsApp</button>
            <button class="btn-vaciar" onclick="cerrarModalReporte()" style="margin-top:8px; border-color:#555 !important; color:#ccc;">Cerrar</button>
        </div>
    </div>

    <script type="module">
        let firebaseApp, firebaseDb, firebaseRef, firebaseSet, firebaseGet;
        let firebaseDisponible = false;
        let cargandoDatosFirebase = false;

        async function iniciarFirebase() {
            if (firebaseDisponible) return true;
            try {
                const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js');
                const { getDatabase, ref, set, get } = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js');
                const firebaseConfig = {
                    databaseURL: "https://cultivo-oficina-default-rtdb.firebaseio.com"
                };
                firebaseApp = initializeApp(firebaseConfig);
                firebaseDb = getDatabase(firebaseApp);
                firebaseRef = ref;
                firebaseSet = set;
                firebaseGet = get;
                firebaseDisponible = true;
                return true;
            } catch (e) {
                console.warn("Firebase no está disponible:", e);
                firebaseDisponible = false;
                return false;
            }
        }

        const LOCAL_STORAGE_KEY = 'cultivo_oficina_datos_v2.8';
        const LOCAL_STORAGE_NOTES_KEY = 'cultivo_oficina_notas_generales_v2.8';
        function getRutaDatosUsuario() { return 'cultivoOficina/datos'; }
        function getCachedData() { try { return JSON.parse(localStorage.getItem(LOCAL_STORAGE_KEY) || '{}'); } catch(e) { return {}; } }
        function saveCachedData(data) { try { localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(data)); } catch(e) {} }
        function getCachedGeneralNotes() { try { return localStorage.getItem(LOCAL_STORAGE_NOTES_KEY) || ''; } catch(e) { return ''; } }
        function guardarCopiaLocalNotasGenerales(texto) { try { localStorage.setItem(LOCAL_STORAGE_NOTES_KEY, texto); } catch(e) {} }

        let datos = getCachedData();
        let idActual = null;

        async function cargarDatosFirebase() {
            cargandoDatosFirebase = true;
            const conectado = await iniciarFirebase();
            if (!conectado) { 
                datos = getCachedData(); 
                cargandoDatosFirebase = false; 
                return false; 
            }
            try {
                const snapshot = await firebaseGet(dbModuleRef(getRutaDatosUsuario()));
                datos = snapshot.exists() ? (snapshot.val() || {}) : {};
                saveCachedData(datos);

                // Cargar también nota general desde Firebase
                try {
                    const snapNota = await firebaseGet(dbModuleRef('cultivoOficina/notaGeneral'));
                    if (snapNota.exists()) {
                        const valNota = snapNota.val() || '';
                        guardarCopiaLocalNotasGenerales(valNota);
                        const notesInput = document.getElementById('nota-general-input');
                        if (notesInput) notesInput.value = valNota;
                    }
                } catch (e) {
                    console.warn("No se pudo cargar la nota general de Firebase:", e);
                }

                cargandoDatosFirebase = false;
                return true;
            } catch (e) { 
                console.error("No se pudieron cargar los datos desde Firebase:", e); 
                datos = getCachedData(); 
                cargandoDatosFirebase = false; 
                return false; 
            }
        }
        function dbModuleRef(path) { return firebaseRef(firebaseDb, path); }
        async function guardarDatosFirebase() {
            saveCachedData(datos);
            const conectado = await iniciarFirebase();
            if (!conectado) return false;
            try {
                await firebaseSet(dbModuleRef(getRutaDatosUsuario()), datos);
                return true;
            } catch (e) { console.error("No se pudo guardar en Firebase:", e); return false; }
        }
        async function guardarNotaGeneral() {
            const valor = document.getElementById('nota-general-input')?.value || '';
            guardarCopiaLocalNotasGenerales(valor);
            if (firebaseDisponible) {
                try {
                    await firebaseSet(dbModuleRef('cultivoOficina/notaGeneral'), valor);
                } catch (e) {
                    console.error('Error al guardar nota general en Firebase:', e);
                }
            }
        }
        async function sha256(message) { 
            const msgBuffer = new TextEncoder().encode(message); 
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer); 
            const hashArray = Array.from(new Uint8Array(hashBuffer)); 
            const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join(''); 
            return hashHex; 
        }
        const AUTH_STORAGE_KEY = 'cultivo_user_v1';
        
        function abrirLogin() { 
            document.getElementById('modal-login').style.display = 'flex'; 
            document.getElementById('login-user').value = ''; 
            document.getElementById('login-pass').value = ''; 
            const errEl = document.getElementById('login-error');
            errEl.style.display = 'none';
            errEl.innerText = '';
        }
        function cerrarLogin() { document.getElementById('modal-login').style.display = 'none'; }
        function getSessionUser() { try { const s = JSON.parse(localStorage.getItem(AUTH_STORAGE_KEY) || 'null'); return s && s.user ? s.user : null; } catch (e) { return null; } }
        
        async function doLogin() {
            const userInput = document.getElementById('login-user').value.trim();
            const userKey = userInput.toLowerCase();
            const pass = document.getElementById('login-pass').value || '';
            const errEl = document.getElementById('login-error');
            errEl.style.display = 'none';
            errEl.innerText = '';

            if (!userKey || !pass) { 
                errEl.innerText = 'Completar usuario y contraseña'; 
                errEl.style.display = 'block'; 
                return; 
            }

            errEl.style.color = '#ffb74d';
            errEl.innerText = 'Verificando con Firebase...';
            errEl.style.display = 'block';

            const conectado = await iniciarFirebase();
            if (!conectado) {
                errEl.style.color = '#ff8a80';
                errEl.innerText = 'No se pudo conectar a Firebase. Verificá tu conexión.';
                return;
            }

            try {
                // Consultar usuarios en cultivoOficina/usuarios
                const snap = await firebaseGet(dbModuleRef('cultivoOficina/usuarios'));
                if (!snap.exists()) {
                    errEl.style.color = '#ff8a80';
                    errEl.innerText = 'No se encontró el registro de usuarios en Firebase.';
                    return;
                }

                const usuariosFirebase = snap.val();
                let storedHash = null;
                let finalUserName = userInput;

                // Buscar usuario (soporta claves en minúsculas, mayúsculas o estructura anidada)
                if (typeof usuariosFirebase === 'object' && usuariosFirebase !== null) {
                    for (const [key, val] of Object.entries(usuariosFirebase)) {
                        if (key.trim().toLowerCase() === userKey) {
                            finalUserName = key;
                            if (typeof val === 'string') {
                                storedHash = val.trim();
                            } else if (val && typeof val === 'object') {
                                storedHash = (val.pass || val.password || val.hash || val.sha256 || '').trim();
                            }
                            break;
                        }
                    }
                }

                if (!storedHash) {
                    errEl.style.color = '#ff8a80';
                    errEl.innerText = 'Usuario no encontrado en la base de datos';
                    return;
                }

                const passHash = await sha256(pass);

                if (passHash.toLowerCase() === storedHash.toLowerCase()) {
                    localStorage.setItem(AUTH_STORAGE_KEY, JSON.stringify({ user: finalUserName, ts: Date.now() }));
                    cerrarLogin();
                    await afterLogin();
                } else {
                    errEl.style.color = '#ff8a80';
                    errEl.innerText = 'Contraseña incorrecta';
                }
            } catch (error) {
                console.error("Error al autenticar con Firebase:", error);
                errEl.style.color = '#ff8a80';
                errEl.innerText = 'Error al validar credenciales: ' + (error.message || 'Intente nuevamente');
            }
        }
        function logout() { localStorage.removeItem(AUTH_STORAGE_KEY); location.reload(); }
        async function afterLogin() {
            const user = getSessionUser();
            if (!user) return;
            document.getElementById('current-user-display').innerText = user;
            document.getElementById('btn-login').style.display = 'none';
            document.getElementById('btn-logout').style.display = 'inline-block';
            await cargarDatosFirebase();
            inicializarApp();
        }

        const tablaSalesConfig = [
            { semana: "Semana 1", base: 1.0, vege: 1.0, bloom: 0.0, epsom: 0.3 },
            { semana: "Semana 2", base: 1.1, vege: 0.9, bloom: 0.0, epsom: 0.3 },
            { semana: "Semana 3", base: 1.2, vege: 0.6, bloom: 0.2, epsom: 0.3 },
            { semana: "Semana 4", base: 1.2, vege: 0.3, bloom: 0.6, epsom: 0.3 },
            { semana: "Semana 5", base: 1.2, vege: 0.0, bloom: 1.0, epsom: 0.3 },
            { semana: "Semana 6", base: 1.2, vege: 0.0, bloom: 1.1, epsom: 0.3 },
            { semana: "Semana 7", base: 1.1, vege: 0.0, bloom: 1.0, epsom: 0.2 },
            { semana: "Semana 8", base: 0.8, vege: 0.0, bloom: 0.7, epsom: 0.2 },

        function actualizarTablaSales() {
            const input = document.getElementById('sales-litros-input');
            const tbody = document.getElementById('sales-table-body');
            if (!tbody || !input) return;
            let litros = parseFloat(input.value);
            if (isNaN(litros) || litros <= 0) litros = 1;
            tbody.innerHTML = '';
            tablaSalesConfig.forEach(item => {
                const tr = document.createElement('tr');
                const gBase = (item.base * litros).toFixed(1);
                const gVege = (item.vege * litros).toFixed(1);
                const gBloom = (item.bloom * litros).toFixed(1);
                const gEpsom = (item.epsom * litros).toFixed(1);
                tr.innerHTML = `
                    <td>${item.semana}</td>
                    <td><span class="gramos">${gBase}g</span> <span class="por-litro">(${item.base})</span></td>
                    <td><span class="gramos">${gVege}g</span> <span class="por-litro">(${item.vege})</span></td>
                    <td><span class="gramos">${gBloom}g</span> <span class="por-litro">(${item.bloom})</span></td>
                    <td><span class="gramos">${gEpsom}g</span> <span class="por-litro">(${item.epsom})</span></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function toggleSeccionRapida(tipo) {
            const panelSales = document.getElementById('panel-sales');
            const panelNotes = document.getElementById('panel-notes');
            if (tipo === 'sales') {
                const visible = panelSales.classList.contains('visible');
                panelSales.classList.toggle('visible', !visible);

                }
            } else if (tipo === 'notes') {
                const visible = panelNotes.classList.contains('visible');

                if (!visible) {
                    panelNotes.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

                }
            }

        function abrirModalVegetaRapido() {

        }

        function obtenerEstructuraMesas() {
            return [
                { id: 'A1', nave: 'Nave A', etiqueta: 'Mesa A1' },
                { id: 'A2', nave: 'Nave A', etiqueta: 'Mesa A2' },
                { id: 'A3', nave: 'Nave A', etiqueta: 'Mesa A3' },
                { id: 'A4', nave: 'Nave A', etiqueta: 'Mesa A4' },
                { id: 'A5', nave: 'Nave A', etiqueta: 'Mesa A5' },
                { id: 'A6', nave: 'Nave A', etiqueta: 'Mesa A6' },
                { id: 'B1', nave: 'Nave B', etiqueta: 'Mesa B1' },
                { id: 'B2', nave: 'Nave B', etiqueta: 'Mesa B2' },
                { id: 'B3', nave: 'Nave B', etiqueta: 'Mesa B3' },
                { id: 'B4', nave: 'Nave B', etiqueta: 'Mesa B4' },
                { id: 'B5', nave: 'Nave B', etiqueta: 'Mesa B5' },
                { id: 'B6', nave: 'Nave B', etiqueta: 'Mesa B6' },

        function calcularTiempoExacto(fechaInicioStr) {
            if (!fechaInicioStr) return null;
            const partes = fechaInicioStr.split('-');
            const inicio = new Date(partes[0], partes[1] - 1, partes[2]);
            const hoy = new Date();
            inicio.setHours(0,0,0,0);
            hoy.setHours(0,0,0,0);
            const diffTiempo = hoy - inicio;
            const diasTotales = Math.floor(diffTiempo / (1000 * 60 * 60 * 24));
            if (diasTotales < 0) return { semanas: 0, diasRestantes: 0, diasTotales: 0 };
            const semanas = Math.floor(diasTotales / 7) + 1;
            const diasRestantes = diasTotales % 7;
            return { semanas, diasRestantes, diasTotales };
        }

        function inicializarApp() {
            const grid = document.getElementById('grid-mesas');
            grid.innerHTML = '';
            
            const naveA = document.createElement('div');
            naveA.className = 'nave';
            naveA.innerHTML = '<div class="nave-title">Nave A</div>';
            
            const naveB = document.createElement('div');
            naveB.className = 'nave';
            naveB.innerHTML = '<div class="nave-title">Nave B</div>';
            
            for (let i = 1; i <= 6; i++) {
                naveA.appendChild(crearCardMesa(`A${i}`));
                naveB.appendChild(crearCardMesa(`B${i}`));
            }
            
            grid.appendChild(naveA);
            grid.appendChild(naveB);

            // MESA VEGETA EXTRA (abajo ocupando ancho o estilo destacado)
            const contenedorVegeta = document.createElement('div');
            contenedorVegeta.style.gridColumn = 'span 2';
            contenedorVegeta.style.marginTop = '6px';
            const cardVeg = crearCardMesa('VEGETA');
            cardVeg.style.borderColor = '#2e7d32';
            contenedorVegeta.appendChild(cardVeg);
            grid.appendChild(contenedorVegeta);
        }

        function crearCardMesa(id) {
            const card = document.createElement('div');
            card.className = 'card';
            card.id = `card-${id}`;
            card.onclick = () => abrirModal(id);
            
            const data = datos[id];
            const tieneData = data && (data.fecha || data.notas || data.atencion);
            const tieneNota = data && data.notas && data.notas.trim() !== '';
            const nombreMesa = id === 'VEGETA' ? '🌱 Mesa VEGETA' : `Mesa ${id}`;

            let headerHTML = `
                <div class="mesa-header">
                    <span class="mesa-name">${nombreMesa}</span>
                    <div style="display: flex; gap: 4px; align-items: center;">
                        <button class="card-notas-btn ${tieneNota ? 'tiene-nota' : ''}" onclick="abrirModalNotas('${id}', event)" title="Ver/Editar Notas">
                            📝 ${tieneNota ? 'Ver Nota' : 'Nota'}
                        </button>
                    </div>
                </div>
            `;
            
            let contenidoHTML = '';
            
            if (tieneData) {
                card.classList.add('activa');
                if (data.atencion) card.classList.add('alerta');
                
                if (data.fecha) {
                    const tiempo = calcularTiempoExacto(data.fecha);
                    const objetivo = data.objetivo || 8;
                    contenidoHTML = `
                        <div class="info-cultivo">
                            <span>Sem ${tiempo.semanas}</span>
                            <span class="dias-extra">(+${tiempo.diasRestantes}d)</span>
                            <span class="meta">/ ${objetivo} sem</span>
                        </div>
                    `;
                } else {
                    contenidoHTML = `<div class="estado-vacio" style="color:#ffb74d;">Activa (sin fecha)</div>`;
                }
                
                if (data.atencion) {
                    contenidoHTML += `<span class="tag-atencion">${data.atencion}</span>`;
                }
            } else {
                contenidoHTML = '<div class="estado-vacio">Vacía</div>';
            }
            
            card.innerHTML = headerHTML + contenidoHTML;
            return card;
        }

        function abrirModal(id) {
            idActual = id;
            const data = datos[id] || {};
            const titulo = id === 'VEGETA' ? '🌱 Mesa VEGETA' : `Mesa ${id}`;
            document.getElementById('modal-titulo').innerText = titulo;
            document.getElementById('input-fecha').value = data.fecha || '';
            document.getElementById('input-objetivo').value = data.objetivo || 8;
            document.getElementById('input-atencion').value = data.atencion || '';
            document.getElementById('modal-mesa').style.display = 'flex';
        }

        function cerrarModal() {
            document.getElementById('modal-mesa').style.display = 'none';
        }

        async function guardarDatosMesa() {
            const fecha = document.getElementById('input-fecha').value;
            const objetivo = parseInt(document.getElementById('input-objetivo').value) || 8;
            const atencion = document.getElementById('input-atencion').value.trim();
            
            if (!datos[idActual]) datos[idActual] = {};
            datos[idActual].fecha = fecha;
            datos[idActual].objetivo = objetivo;
            datos[idActual].atencion = atencion;
            
            if (!fecha && !atencion && !datos[idActual].notas) {
                delete datos[idActual];
            }
            
            await guardarDatosFirebase();
            inicializarApp();
            cerrarModal();
        }

        async function vaciarMesaActual() {
            if (!confirm(`¿Seguro que querés vaciar la mesa ${idActual}?`)) return;
            delete datos[idActual];
            await guardarDatosFirebase();
            inicializarApp();
            cerrarModal();
        }

        function abrirModalNotas(id, event) {
            if (event) event.stopPropagation();
            idActual = id;
            const data = datos[id] || {};
            const titulo = id === 'VEGETA' ? '🌱 Mesa VEGETA' : `Mesa ${id}`;
            document.getElementById('modal-notes-titulo').innerText = `Notas: ${titulo}`;
            document.getElementById('notas-input').value = data.notas || '';
            document.getElementById('modal-notes').style.display = 'flex';
        }

        function cerrarModalNotas() {
            document.getElementById('modal-notes').style.display = 'none';
        }

        async function guardarNota() {
            const texto = document.getElementById('notas-input').value;
            if (!datos[idActual]) {
                datos[idActual] = { fecha: '', objetivo: 8, atencion: '' };
            }
            datos[idActual].notas = texto;
            
            if (!datos[idActual].fecha && !datos[idActual].notas && !datos[idActual].atencion) {
                delete datos[idActual];
            }
            
            await guardarDatosFirebase();
            inicializarApp();
            cerrarModalNotas();
        }

        async function resetearMesa(id, event) {
            event.stopPropagation();
            if (!confirm(`¿Seguro que querés vaciar ${id === 'VEGETA' ? 'Mesa VEGETA' : 'Mesa ' + id} ?`)) return;
            delete datos[id];
            await guardarDatosFirebase();
            inicializarApp();
        }

        function generarTextoReporte() {
            let lineas = [];
            const hoy = new Date();
            const fechaStr = hoy.toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit', year: 'numeric' });
            lineas.push(`🌱 REPORTE CULTIVO OFICINA 🌱`);
            lineas.push(`📅 Fecha: ${fechaStr}`);
            lineas.push(`👤 Usuario: ${getSessionUser() || 'Anónimo'}`);
            lineas.push(`---------------------------------`);

            const listaMesas = obtenerEstructuraMesas();
            let totalActivas = 0;

            listaMesas.forEach(m => {
                const id = m.id;
                const data = datos[id];
                if (data && (data.fecha || data.notas || data.atencion)) {
                    totalActivas++;
                    let info = `📌 ${m.etiqueta}:`;
                    if (data.fecha) {
                        const tiempo = calcularTiempoExacto(data.fecha);
                        info += ` Sem ${tiempo.semanas} (+${tiempo.diasRestantes}d) / Meta: Sem ${data.objetivo || 8}`;
                    } else {
                        info += ` (Sin fecha)`;
                    }
                    if (data.atencion) info += `\n   ⚠️ ATENCIÓN: ${data.atencion}`;
                    if (data.notas) info += `\n   📝 Nota: ${data.notas}`;
                    lineas.push(info);
                }
            });

            if (totalActivas === 0) {
                lineas.push('No hay mesas activas con información actualmente.');
            }

            const notaGen = document.getElementById('nota-general-input')?.value || getCachedGeneralNotes();
            if (notaGen && notaGen.trim()) {
                lineas.push(`---------------------------------`);
                lineas.push(`📝 NOTAS GENERALES:\n${notaGen.trim()}`);
            }

            return lineas.join('\n');
        }

        function abrirModalReporte() { 
            const salida = document.getElementById('report-text-output'); 
            if (salida) salida.value = generarTextoReporte(); 
            document.getElementById('modal-report').style.display = 'flex'; 
        }

        function cerrarModalReporte() { 
            document.getElementById('modal-report').style.display = 'none'; 
        }

        function compartirWhatsApp() { 
            const texto = encodeURIComponent(document.getElementById('report-text-output')?.value || ''); 
            window.open(`https://wa.me/?text=${texto}`, '_blank'); 
        }

        window.abrirLogin = abrirLogin;
        window.cerrarLogin = cerrarLogin;
        window.doLogin = doLogin;
        window.logout = logout;
        window.toggleSeccionRapida = toggleSeccionRapida;
        window.abrirModalVegetaRapido = abrirModalVegetaRapido;
        window.actualizarTablaSales = actualizarTablaSales;
        window.guardarNotaGeneral = guardarNotaGeneral;
        window.abrirModal = abrirModal;
        window.cerrarModal = cerrarModal;
        window.guardarDatosMesa = guardarDatosMesa;
        window.vaciarMesaActual = vaciarMesaActual;
        window.abrirModalNotas = abrirModalNotas;
        window.cerrarModalNotas = cerrarModalNotas;
        window.guardarNota = guardarNota;
        window.resetearMesa = resetearMesa;
        window.abrirModalReporte = abrirModalReporte;
        window.cerrarModalReporte = cerrarModalReporte;
        window.compartirWhatsApp = compartirWhatsApp;

        window.addEventListener('DOMContentLoaded', async () => {
            actualizarTablaSales();
            if (!getSessionUser()) {
                abrirLogin();
            } else {
                afterLogin();
            }
            const notesInput = document.getElementById('nota-general-input');
            if (notesInput) notesInput.value = getCachedGeneralNotes();
        });
    </script>
