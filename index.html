<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ciclo Cultivo Oficina v2.8 - Notas sin fecha</title>
    <style>
        :root { 
            --bg-color: #121212; 
            --card-bg: #1e1e1e; 
            --text-color: #ffffff; 
            --accent: #4caf50; 
            --alert: #ff5252; 
            --notes-color: #ffb74d; 
        }
        body { 
            font-family: sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            padding: 10px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            margin: 0; 
        }
        
        .header-container { text-align: center; margin-bottom: 15px; margin-top: 10px; }
        .logo-cultivo { font-size: 2.5rem; margin: 0; padding: 0; line-height: 1; }
        h1 { font-size: 1.3rem; color: var(--accent); margin: 5px 0 0 0; font-weight: bold; }
        
        .top-controls {
            width: 100%;
            max-width: 600px;
            margin-bottom: 12px;
        }

        .user-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            background: #1b1b1b;
            border: 1px solid #333;
            border-radius: 14px;
            padding: 10px 12px;
            margin-bottom: 12px;
            box-sizing: border-box;
        }

        .user-bar span {
            color: #aaa;
            font-size: 0.9rem;
        }

        .quick-access {
            width: 100%;
            max-width: 600px;
            margin: 0 auto 15px auto;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 16px;
            padding: 12px;
            box-sizing: border-box;
            box-shadow: 0 4px 8px rgba(0,0,0,0.22);
        }

        .quick-access-title {
            text-align: center;
            color: #cfcfcf;
            font-weight: bold;
            font-size: 0.95rem;
            margin-bottom: 10px;
        }

        .quick-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        .quick-btn {
            border: none;
            border-radius: 14px;
            padding: 14px 10px;
            cursor: pointer;
            width: 100%;
            color: #fff;
            font-weight: bold;
            font-size: 0.9rem;
            min-height: 64px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.25);
            transition: transform 0.15s ease, opacity 0.2s ease;
        }

        .quick-btn:hover { transform: translateY(-1px); opacity: 0.95; }
        .quick-btn .sub { font-size: 0.72rem; opacity: 0.85; font-weight: 500; }
        .quick-btn.sales { background: linear-gradient(135deg, #6a4c93, #8e5bbd); }
        .quick-btn.notes { background: linear-gradient(135deg, #1565c0, #1e88e5); }
        .quick-btn.vegeta { background: linear-gradient(135deg, #2e7d32, #43a047); }
        .quick-btn.report { background: linear-gradient(135deg, #00796b, #009688); }
        .quick-btn.ia-cannabis { background: linear-gradient(135deg, #1e7d3d, #2e9e49); }

        .panel-open {
            width: 100%;
            max-width: 600px;
            margin: 0 auto 15px auto;
            display: none;
        }
        .panel-open.visible { display: block; }
        
        /* --- TABLA DE SALES / CALCULADORA --- */
        .sales-panel {
            width: 100%;
            max-width: 600px;
            margin: 0 auto 15px auto;
            background: #1b1b1b;
            border: 1px solid #444;
            border-radius: 12px;
            padding: 10px;
            box-sizing: border-box;
            box-shadow: 0 4px 8px rgba(0,0,0,0.25);
        }

        .sales-title {
            text-align: center;
            color: #ffb74d;
            font-weight: bold;
            font-size: 1.05rem;
            margin: 0 0 8px 0;
        }

        .sales-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }

        .sales-controls label {
            display: inline;
            margin: 0;
            color: #ddd;
            font-weight: bold;
        }

        .sales-litros {
            width: 90px !important;
            margin: 0 !important;
            padding: 7px 8px !important;
            text-align: center;
            font-weight: bold;
            background: #292929 !important;
        }

        .sales-scroll {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            border-radius: 8px;
        }

        .sales-table {
            width: 100%;
            min-width: 470px;
            border-collapse: collapse;
            font-size: 0.78rem;
            background: #242424;
        }

        .sales-table th,
        .sales-table td {
            border: 1px solid #555;
            padding: 6px 5px;
            text-align: center;
            white-space: nowrap;
        }

        .sales-table th {
            background: #303030;
            color: #fff;
            font-weight: bold;
        }

        .sales-table td:first-child {
            color: #ffcc80;
            font-weight: bold;
        }

        .sales-table .gramos {
            color: #fff;
            font-weight: bold;
        }

        .sales-table .por-litro {
            color: #4dd0e1;
            font-size: 0.72rem;
        }

        .sales-table tr.seleccionada {
            background: rgba(76, 175, 80, 0.22);
            outline: 2px solid var(--accent);
            outline-offset: -2px;
        }

        .sales-note {
            text-align: center;
            color: #999;
            font-size: 0.68rem;
            margin-top: 6px;
        }

        .ia-panel {
            width: 100%;
            max-width: 600px;
            margin: 0 auto 15px auto;
            background: #1b1b1b;
            border: 1px solid #2e9e49;
            border-radius: 16px;
            padding: 12px;
            box-sizing: border-box;
            box-shadow: 0 4px 10px rgba(46, 158, 73, 0.18);
        }

        .ia-title {
            text-align: center;
            color: #2e9e49;
            font-weight: bold;
            font-size: 1.05rem;
            margin-bottom: 12px;
        }

        .ia-empty {
            color: #c7d8cb;
            text-align: center;
            font-size: 0.9rem;
            padding: 8px 0;
        }

        .ia-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .ia-card {
            background: rgba(46, 158, 73, 0.08);
            border: 1px solid rgba(46, 158, 73, 0.28);
            border-radius: 14px;
            padding: 12px;
        }

        .ia-card.alerta-ph {
            border-color: #ff7043;
            box-shadow: inset 0 0 0 1px rgba(255, 112, 67, 0.3);
        }

        .ia-card.alerta-cosecha {
            border-color: #ffca28;
        }

        .ia-card-top,
        .ia-meta-row,
        .ia-status-row,
        .ia-cosecha-row,
        .ia-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            justify-content: space-between;
        }

        .ia-card-top { margin-bottom: 8px; }
        .ia-meta-row,
        .ia-status-row,
        .ia-cosecha-row { margin-top: 8px; }
        .ia-actions { margin-top: 10px; }

        .ia-mesa-title {
            color: #fff;
            font-weight: bold;
            font-size: 0.96rem;
        }

        .ia-phase,
        .ia-chip,
        .cultivo-chip {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            border-radius: 999px;
            padding: 4px 9px;
            font-size: 0.73rem;
            font-weight: 700;
        }

        .ia-phase {
            background: rgba(46, 158, 73, 0.18);
            color: #8de0a0;
        }

        .ia-chip,
        .cultivo-chip {
            background: rgba(255,255,255,0.08);
            color: #e6f4ea;
            white-space: normal;
            text-align: center;
        }

        .ia-chip.alert,
        .cultivo-chip.alert {
            background: rgba(255, 82, 82, 0.18);
            color: #ffab91;
        }

        .ia-chip.warn,
        .cultivo-chip.warn {
            background: rgba(255, 202, 40, 0.18);
            color: #ffe082;
        }

        .ia-chip.ok,
        .cultivo-chip.ok {
            background: rgba(76, 175, 80, 0.2);
            color: #a5d6a7;
        }

        .ia-chip.info,
        .cultivo-chip.info {
            background: rgba(77, 208, 225, 0.14);
            color: #80deea;
        }

        .ia-copy {
            color: #d7eadb;
            font-size: 0.82rem;
            line-height: 1.45;
            margin-top: 6px;
        }

        .ia-copy strong { color: #fff; }

        .ia-safe-range {
            margin-top: 8px;
            font-size: 0.78rem;
            color: #c8e6c9;
            background: rgba(255,255,255,0.04);
            border-radius: 10px;
            padding: 8px;
        }

        .ia-timeline {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(18px, 1fr));
            gap: 4px;
            margin-top: 10px;
        }

        .ia-week {
            height: 12px;
            border-radius: 999px;
            background: rgba(255,255,255,0.12);
            position: relative;
            overflow: hidden;
        }

        .ia-week.active { background: linear-gradient(135deg, #1e7d3d, #2e9e49); }
        .ia-week.current { box-shadow: 0 0 0 2px rgba(255,255,255,0.18); }
        .ia-week.overdue { background: linear-gradient(135deg, #ff7043, #ff8a65); }

        .ia-timeline-labels {
            display: flex;
            justify-content: space-between;
            margin-top: 5px;
            font-size: 0.68rem;
            color: #9ccc65;
        }

        .ia-history {
            margin-top: 10px;
            border-top: 1px solid rgba(255,255,255,0.08);
            padding-top: 8px;
        }

        .ia-history summary {
            cursor: pointer;
            color: #9be7a9;
            font-size: 0.78rem;
            font-weight: 700;
            list-style: none;
        }

        .ia-history summary::-webkit-details-marker { display: none; }

        .ia-history-list {
            margin: 8px 0 0 0;
            padding: 0;
            list-style: none;
            display: grid;
            gap: 6px;
        }

        .ia-history-item {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            background: rgba(0,0,0,0.16);
            border-radius: 8px;
            padding: 7px 8px;
            font-size: 0.75rem;
            color: #e0e0e0;
        }

        .cultivo-summary {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
            margin-top: 8px;
        }

        .cosecha-mini {
            margin-top: 8px;
            font-size: 0.76rem;
            color: #dcedc8;
        }

        .ia-actions button {
            flex: 1 1 150px;
            min-width: 0;
        }

        @media (max-width: 480px) {
            .sales-panel { padding: 7px; }
            .sales-table { font-size: 0.72rem; min-width: 440px; }
            .sales-table th, .sales-table td { padding: 5px 4px; }
            .quick-grid { grid-template-columns: 1fr 1fr; }
            .quick-btn { min-height: 60px; font-size: 0.84rem; }
            .ia-panel { padding: 10px; }
            .ia-card { padding: 10px; }
            .ia-card-top,
            .ia-meta-row,
            .ia-status-row,
            .ia-cosecha-row,
            .ia-actions { flex-direction: column; align-items: stretch; }
            .ia-history-item { flex-direction: column; }
        }

        .audio-status { 
            background: #333; 
            padding: 10px; 
            border-radius: 20px; 
            font-size: 0.85rem; 
            cursor: pointer; 
            border: 1px solid #555; 
            transition: all 0.3s; 
            text-align: center; 
            box-sizing: border-box; 
        }
        .audio-status.activo { border-color: var(--accent); color: var(--accent); background: #1b3a22; }

        .bottom-controls {
            width: 100%;
            max-width: 600px;
            margin-top: 18px; 
            margin-bottom: 25px;
            text-align: center;
        }

        .report-btn-main {
            background-color: #009688;
            color: white;
            border: none;
            border-radius: 20px;
            padding: 12px 20px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.2s;
            border: 1px solid #00796b;
            width: 100%;
            box-sizing: border-box;
        }
        .report-btn-main:hover { background-color: #00796b; }

        /* Contenedor principal adaptativo */
        .panel-container { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); 
            gap: 12px; 
            width: 100%; 
            max-width: 600px; 
        }
        .columna-lado { display: flex; flex-direction: column; gap: 12px; width: 100%; }

        .vegeta-container { width: 100%; max-width: 600px; margin-top: 15px; }

        .columna-titulo { text-align: center; font-weight: bold; margin-bottom: 5px; color: #aaaaaa; font-size: 1rem; border-bottom: 1px solid #333; padding-bottom: 5px; }
        .mesa-card { 
            background-color: var(--card-bg); 
            border-radius: 12px; 
            padding: 12px; 
            text-align: center; 
            border: 2px solid transparent; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.2); 
            position: relative;
            transition: all 0.3s ease;
        }
        .mesa-card.alerta { border-color: var(--alert); animation: parpadeo 2s infinite; }
        .mesa-card.alerta-poda { border-color: #ffeb3b; animation: parpadeo 1.5s infinite; }

        @keyframes parpadeo { 0% { opacity: 1; } 50% { opacity: 0.75; } 100% { opacity: 1; } }
        .semana-info { font-size: 1.1rem; font-weight: bold; margin-top: 5px; }
        .dia-info { 
            font-size: 0.85rem; 
            color: #ffffff; 
            font-weight: 500; 
            margin-bottom: 5px; 
            background: rgba(0,0,0,0.2); 
            display: inline-block; 
            padding: 4px 8px; 
            border-radius: 4px; 
            margin-top: 5px;
        }
        .objetivo-info { font-size: 0.75rem; color: #bbbbbb; margin-top: 8px; font-style: italic; }
        
        .notes-display { 
            font-size: 0.8rem; 
            background: rgba(255, 183, 77, 0.15); 
            border: 1px dashed var(--notes-color); 
            color: var(--notes-color); 
            padding: 6px; 
            border-radius: 6px; 
            margin-top: 8px; 
            text-align: left;
            white-space: pre-wrap;
        }
        .atencion-display { 
            font-size: 0.8rem; 
            background: rgba(255, 82, 82, 0.2); 
            border: 1px solid var(--alert); 
            color: #ff8a80; 
            padding: 6px; 
            border-radius: 6px; 
            margin-top: 8px; 
            text-align: center;
        }
        .nota-general-display {
            font-size: 0.8rem;
            background: rgba(77, 208, 225, 0.14);
            border: 1px dashed #4dd0e1;
            color: #4dd0e1;
            padding: 6px;
            border-radius: 6px;
            margin-top: 8px;
            text-align: left;
            white-space: pre-wrap;
        }

        .poda-tag { background: #ffeb3b; color: #000; font-weight: bold; font-size: 0.8rem; padding: 4px 8px; border-radius: 4px; margin-top: 8px; display: inline-block; }

        .btn-group { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 6px; 
            margin-top: 10px; 
        }
        
        button { 
            background-color: var(--accent); 
            color: white; 
            border: none; 
            border-radius: 6px; 
            padding: 8px 4px; 
            cursor: pointer; 
            width: 100%; 
            font-weight: bold; 
            font-size: 0.8rem; 
            box-sizing: border-box; 
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 34px;
            transition: background 0.2s;
        }
        button:hover {
            opacity: 0.9;
        }
        button.notes-btn { background-color: #2196f3; } 
        button.atencion-btn { background-color: #e65100; color: white; }
        button.atencion-btn.con-enfermedad { background-color: var(--alert); }
        
        button.reset-btn { 
            background-color: #cf6679; 
            grid-column: span 1; 
        }
        
        button.whatsapp-btn { background-color: #25D366; color: black; font-size: 0.9rem; margin-bottom: 6px; border: 1px solid #1ebd59; }
        button.whatsapp-btn:hover { background-color: #1ebd59; }

        .modal { 
            display: none; 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0,0,0,0.8); 
            justify-content: center; 
            align-items: center; 
            z-index: 1000; 
            padding: 10px;
            box-sizing: border-box;
        }
        .modal-content { 
            background: #222; 
            padding: 20px; 
            border-radius: 12px; 
            width: 100%; 
            max-width: 320px; 
            text-align: center; 
            box-sizing: border-box; 
        }
        input, textarea, select { 
            width: 100%; 
            padding: 10px; 
            margin: 5px 0 15px 0; 
            background: #333; 
            border: 1px solid #555; 
            color: white; 
            box-sizing: border-box; 
            border-radius: 6px; 
            font-family: sans-serif;
        }
        textarea { resize: vertical; min-height: 80px; }
        label { display: block; text-align: left; font-size: 0.9rem; color: #aaa; margin-top: 10px; }
        
        .report-textarea { font-family: monospace; font-size: 0.85rem; height: 180px; background: #111; color: #4caf50; border: 1px solid #333; }

        @media (max-width: 480px) {
            .panel-container {
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }
            .logo-cultivo { font-size: 2rem; }
            h1 { font-size: 1.1rem; }
            .mesa-card { padding: 8px 6px; }
            .semana-info { font-size: 0.95rem; }
            .dia-info { font-size: 0.75rem; padding: 2px 4px; }
            button { font-size: 0.75rem; padding: 6px 2px; min-height: 30px; }
        }
    </style>
</head>
<body>

    <div class="header-container">
        <div class="logo-cultivo">🌱</div>
        <h1>Ciclo Cultivo Oficina</h1>
    </div>

    <div class="top-controls">
        <div class="user-bar" id="user-bar" style="display:none;"></div>
    </div>
    
    <div class="quick-access">
        <div class="quick-access-title">Accesos rápidos</div>
        <div class="quick-grid">
            <button class="quick-btn sales" onclick="togglePanel('sales-panel')">🧪 Sales<span class="sub">Tabla EC / gramos</span></button>
            <button class="quick-btn notes" onclick="togglePanel('notes-panel')">📝 Notas<span class="sub">Notas generales</span></button>
            <button class="quick-btn ia-cannabis" onclick="togglePanel('cannabis-panel')">🤖 IA Cannabis<span class="sub">pH y cosecha</span></button>
            <button class="quick-btn vegeta" onclick="togglePanel('vegeta-panel')">🥦 Vegeta<span class="sub">Mesa especial</span></button>
            <button class="quick-btn report" onclick="abrirModalReporte()">📋 Reporte<span class="sub">Tiempos de cultivo</span></button>
        </div>
    </div>

    <div class="panel-open" id="sales-panel">
        <div class="sales-panel">
            <div class="sales-title">🧪 SALES = GRAMOS × 10L</div>
            <div class="sales-controls">
                <label for="sales-litros">Litros:</label>
                <input id="sales-litros" class="sales-litros" type="number" min="0.1" step="0.1" value="10" inputmode="decimal" oninput="actualizarTablaSales()" aria-label="Cantidad de litros">
            </div>
            <div class="sales-scroll">
                <table class="sales-table" aria-label="Tabla de sales">
                    <thead><tr><th>EC</th><th>GROW / BLOOM</th><th>CORE</th></tr></thead>
                    <tbody id="sales-table-body"></tbody>
                </table>
            </div>
            <div class="sales-note">Modificá los litros y los gramos se recalculan automáticamente.</div>
        </div>
    </div>

    <div class="panel-container">
        <div class="columna-lado" id="col-lado-a"></div>
        <div class="columna-lado" id="col-lado-b"></div>
    </div>

    <div class="panel-open" id="vegeta-panel">
        <div class="vegeta-container" id="col-vegeta"></div>
    </div>

    <div class="panel-open" id="notes-panel">
        <div class="mesa-card" id="notes-wrapper" style="border:1px dashed #4dd0e1; background:var(--card-bg);">
            <strong style="color:#ffffff; display:block; margin-bottom:5px; font-size:0.9rem;">Notas generales</strong>
            <textarea id="nota-general-input" placeholder="Escribí acá notas generales del cultivo..." style="min-height:120px; margin-bottom:8px;"></textarea>
            <button style="background:#009688;" onclick="guardarNotaGeneral();" aria-label="Guardar notas generales">Guardar notas generales</button>
        </div>
    </div>

    <div class="panel-open" id="cannabis-panel">
        <div class="ia-panel" id="cannabis-content"></div>
    </div>

    <div class="bottom-controls">
        <button class="report-btn-main" onclick="abrirModalReporte()" aria-label="Generar reporte de tiempos">📋 Generar Reporte de Tiempos</button>
    </div>

    <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-content">
            <h3 id="modal-title" style="margin-top:0; color:var(--accent);">Configurar Mesa</h3>
            <label for="fecha-input">Fecha de inicio:</label>
            <input type="date" id="fecha-input">
            <label for="objetivo-input">¿En qué semana avisar?:</label>
            <input type="number" id="objetivo-input" value="8" min="1">
            <label for="tipo-cultivo-input">Tipo de cultivo:</label>
            <select id="tipo-cultivo-input">
                <option value="tierra">Tierra</option>
                <option value="hidro">Hidro</option>
            </select>
            <label for="variedad-input">Variedad estimada:</label>
            <select id="variedad-input">
                <option value="8">Rápida · 8 semanas</option>
                <option value="9">Media · 9 semanas</option>
                <option value="10">Larga · 10 semanas</option>
            </select>
            <button onclick="guardarFecha()" aria-label="Guardar configuración">Guardar</button>
            <button style="background:#555; margin-top: 4px;" onclick="cerrarModal()" aria-label="Cancelar">Cancelar</button>
        </div>
    </div>

    <div class="modal" id="modal-notes" role="dialog" aria-modal="true" aria-labelledby="modal-notas-title">
        <div class="modal-content">

                const tiempo = calcularTiempoExacto(mesa.fecha);
                const analisisPH = obtenerAnalisisPH(mesa);
                const pronosticoCosecha = obtenerPronosticoCosecha(mesa);
                const clasePH = analisisPH.estado === 'ok' ? 'ok' : (analisisPH.estado === 'sin-datos' ? 'info' : 'alert');
                const claseCosecha = pronosticoCosecha?.alerta || pronosticoCosecha?.vencida ? 'warn' : 'info';
                const historia = mesa.phHistorial.length
                    ? mesa.phHistorial.map(item => {
                        const lecturaClase = item.valor < analisisPH.rango.min || item.valor > analisisPH.rango.max ? 'alert' : 'ok';
                        return `<li class="ia-history-item"><span>${formatearFecha(new Date(item.fecha), true)}</span><span class="ia-chip ${lecturaClase}">pH ${item.valor.toFixed(1)}</span></li>`;
                    }).join('')
                    : '<li class="ia-history-item"><span>Sin lecturas registradas</span><span class="ia-chip info">Esperando datos</span></li>';
                const textoCosecha = !pronosticoCosecha
                    ? 'Definí una fecha de inicio para calcular la cosecha estimada.'
                    : pronosticoCosecha.vencida
                        ? `Ventana de cosecha abierta desde hace ${Math.abs(pronosticoCosecha.diasFaltantes)} días.`
                        : `${pronosticoCosecha.diasFaltantes} días restantes · estimada ${formatearFecha(pronosticoCosecha.fecha)}.`;
                html += `
                    <div class="ia-card${analisisPH.estado !== 'ok' && analisisPH.estado !== 'sin-datos' ? ' alerta-ph' : ''}${pronosticoCosecha?.alerta || pronosticoCosecha?.vencida ? ' alerta-cosecha' : ''}">
                        <div class="ia-card-top">
                            <div class="ia-mesa-title">${mesaInfo.etiqueta}</div>
                            <span class="ia-phase">${analisisPH.fase.title}</span>
                        </div>
                        <div class="ia-meta-row">
                            <span class="ia-chip info">${mesa.tipoCultivo === 'hidro' ? '💧 Hidro' : '🪴 Tierra'}</span>
                            <span class="ia-chip info">🌾 ${mesa.variedadSemanas} semanas</span>
                            <span class="ia-chip ${claseNivelEstres(analisisPH.estres.nivel)}">🩺 ${analisisPH.estres.texto}</span>
                        </div>
                        <div class="ia-status-row">
                            <span class="ia-chip ${clasePH}">${analisisPH.ultimo ? `🧪 pH ${analisisPH.ultimo.valor.toFixed(1)}` : '🧪 Sin lectura'}</span>
                            <span class="ia-chip ${analisisPH.tendencia.clave === 'subiendo' || analisisPH.tendencia.clave === 'bajando' ? 'warn' : 'ok'}">📈 ${analisisPH.tendencia.texto}</span>
                        </div>
                        <div class="ia-safe-range"><strong>Óptimo ${mesa.tipoCultivo}:</strong> ${analisisPH.rango.min.toFixed(1)} - ${analisisPH.rango.max.toFixed(1)} (ideal ${analisisPH.rango.ideal.toFixed(1)}) · <strong>Seguro:</strong> ${analisisPH.rangoSeguro.min.toFixed(1)} - ${analisisPH.rangoSeguro.max.toFixed(1)}</div>
                        <div class="ia-copy"><strong>Recomendación:</strong> ${escaparHTML(analisisPH.recomendacion)}</div>
                        <div class="ia-cosecha-row">
                            <span class="ia-chip ${claseCosecha}">⏳ ${textoCosecha}</span>
                            ${pronosticoCosecha?.alerta ? '<span class="ia-chip warn">🔔 Menos de 7 días para cosechar</span>' : ''}
                            ${pronosticoCosecha?.vencida ? '<span class="ia-chip alert">🚨 Revisar tricomas ahora</span>' : ''}
                        </div>
                        ${pronosticoCosecha ? `<div class="ia-timeline">${generarTimelineCosecha(pronosticoCosecha, tiempo.semanas + (tiempo.diasRestantes / 7))}</div><div class="ia-timeline-labels"><span>Inicio</span><span>Semana ${mesa.variedadSemanas}</span></div>` : ''}
                        <div class="ia-actions">
                            <button style="background:#2e9e49;" onclick="abrirModalPH('${mesaInfo.id}')">🧪 Registrar pH</button>
                            <button style="background:#33691e;" onclick="abrirModal('${mesaInfo.id}')">⚙️ Ajustar mesa</button>
                        </div>
                        <details class="ia-history">
                            <summary>📚 Histórico de pH (${mesa.phHistorial.length})</summary>
                            <ul class="ia-history-list">${historia}</ul>
                        </details>
                    </div>`;
            });
            container.innerHTML = `${html}</div>`;
        }
        function inicializarApp() {
            const contB = document.getElementById('col-lado-b');
            const contA = document.getElementById('col-lado-a');
            const contV = document.getElementById('col-vegeta');
            if (contB) contB.innerHTML = '<div class="columna-titulo">Lado B</div>';
            if (contA) contA.innerHTML = '<div class="columna-titulo">Lado A</div>';
            if (contV) contV.innerHTML = '<div class="columna-titulo">Mesa Especial</div>';
            let listaMesas = obtenerEstructuraMesas();
            listaMesas.forEach(m => {
                const id = m.id;
                const data = datos[id];
                const mesaData = data ? normalizarMesaData(data) : null;
                const card = document.createElement('div');
                card.className = 'mesa-card';
                let notasEscapadas = mesaData?.notas ? escaparHTML(mesaData.notas).replace(/\n/g, '<br>') : '';
                let notesHTML = notasEscapadas ? `<div class="notes-display"><strong>Notas:</strong><br>${notasEscapadas}</div>` : '';
                let atencionHTML = mesaData?.atencion ? `<div class="atencion-display">⚠️ ATENCIÓN: ${escaparHTML(mesaData.atencion)}</div>` : '';
                let claseBtnAtencion = mesaData?.atencion ? 'atencion-btn con-enfermedad' : 'atencion-btn';
                if (mesaData && mesaData.fecha) {
                    const infoTiempo = calcularTiempoExacto(mesaData.fecha);
                    const requierePoda = infoTiempo.semanas === 3;
                    const esAlertaMeta = mesaData.objetivo !== undefined && infoTiempo.semanas >= mesaData.objetivo;
                    let podaTagHTML = '';
                    if (requierePoda) { card.classList.add('alerta-poda'); card.style.backgroundColor = '#4e342e'; podaTagHTML = '<br><div class="poda-tag">⚠️ ¡PODAR!</div>'; }
                    else if (esAlertaMeta) { card.classList.add('alerta'); card.style.backgroundColor = '#b71c1c'; }
                    else { card.style.backgroundColor = obtenerColorPorSemana(infoTiempo.semanas); }
                    let textoTiempo = `${infoTiempo.semanas} ${infoTiempo.semanas === 1 ? 'sem' : 'sems'}`;
                    if (infoTiempo.diasRestantes > 0) textoTiempo += ` y ${infoTiempo.diasRestantes}d`;
                    const partesFecha = (mesaData.fecha || '').split("-");
                    const fechaFormateada = (partesFecha.length === 3) ? `${partesFecha[2]}/${partesFecha[1]}/${partesFecha[0]}` : mesaData.fecha;
                    card.innerHTML = `<strong style="color: #ffffff; font-size:0.9rem;">${m.etiqueta}</strong><div style="font-size: 0.7rem; color: #aaaaaa; margin-top: 2px;">Inicio: ${fechaFormateada}</div><div class="semana-info">${textoTiempo}</div><div class="objetivo-info">Meta: semana ${mesaData.objetivo}</div>${obtenerResumenCultivoHTML(mesaData)}${notesHTML}${atencionHTML}${podaTagHTML}<div class="btn-group"><button onclick="abrirModal('${id}')" aria-label="Configurar ${m.etiqueta}">⚙️ Config</button><button class="notes-btn" onclick="abrirModalNotas('${id}')" aria-label="Agregar notas a ${m.etiqueta}">📝 Notas</button><button class="${claseBtnAtencion}" onclick="gestionarAtencion('${id}', event)" aria-label="Reportar enfermedad en ${m.etiqueta}">⚠️ Atención</button><button class="reset-btn" onclick="resetearMesa('${id}', event)" aria-label="Eliminar datos de ${m.etiqueta}">🗑️</button></div>`;
                } else if (mesaData && (mesaData.notas || mesaData.atencion || mesaData.phHistorial.length || mesaData.variedadSemanas !== 9 || mesaData.tipoCultivo !== 'tierra')) {
                    card.style.backgroundColor = 'var(--card-bg)'; card.style.border = '1px dashed #666';
                    card.innerHTML = `<strong style="color: #ffffff; display: block; margin-bottom: 5px; font-size:0.9rem;">${m.etiqueta}</strong><div style="font-style:italic; color:#aaa; margin: 10px 0;">Sin fecha de inicio</div>${obtenerResumenCultivoHTML(mesaData)}${notesHTML}${atencionHTML}<div class="btn-group"><button onclick="abrirModal('${id}')" aria-label="Configurar ${m.etiqueta}">⚙️ Config</button><button class="notes-btn" onclick="abrirModalNotas('${id}')" aria-label="Agregar notas a ${m.etiqueta}">📝 Notas</button><button class="${claseBtnAtencion}" onclick="gestionarAtencion('${id}', event)" aria-label="Reportar enfermedad en ${m.etiqueta}">⚠️ Atención</button><button class="reset-btn" onclick="resetearMesa('${id}', event)" aria-label="Eliminar datos de ${m.etiqueta}">🗑️</button></div>`;
                } else {
                    card.style.backgroundColor = 'var(--card-bg)'; card.style.border = '1px dashed #444';
                    card.innerHTML = `<strong style="color: #ffffff; display: block; margin-bottom: 5px; font-size:0.9rem;">${m.etiqueta}</strong><div style="font-style:italic; color:#888; margin: 10px 0;">Click acá para comenzar</div><div class="btn-group"><button onclick="abrirModal('${id}')" aria-label="Configurar ${m.etiqueta}">➕ Agregar</button></div>`;
                }
                const contenedorDestino = document.getElementById(m.contenedor);
                if (contenedorDestino) contenedorDestino.appendChild(card);
            });
            if (document.getElementById('cannabis-panel')?.classList.contains('visible')) generarPanelIACannabis();
        }
        let idActualPH = "";
        function abrirModalPH(id) {
            idActualPH = id;
            const mesaInfo = obtenerEstructuraMesas().find(item => item.id === id);
            document.getElementById('modal-ph-subtitle').innerText = mesaInfo ? mesaInfo.etiqueta : id;
            document.getElementById('ph-input').value = '';
            document.getElementById('ph-fecha-input').value = formatearFechaInput(new Date());
            document.getElementById('modal-ph').style.display = 'flex';
        }
        function cerrarModalPH() { document.getElementById('modal-ph').style.display = 'none'; }
        async function guardarLecturaPH() {
            const valor = Number.parseFloat(String(document.getElementById('ph-input').value || '').replace(',', '.'));
            const fechaValor = document.getElementById('ph-fecha-input').value;
            const fecha = fechaValor ? new Date(fechaValor) : new Date();
            if (!Number.isFinite(valor) || valor < 0 || valor > 14) { alert('Ingresá un valor de pH válido entre 0 y 14.'); return; }
            if (Number.isNaN(fecha.getTime())) { alert('Ingresá una fecha y hora válidas.'); return; }
            const mesa = normalizarMesaData(datos[idActualPH] || {});
            const actualizado = { ...mesa, phHistorial: normalizarHistorialPH([{ valor, fecha: fecha.toISOString() }, ...mesa.phHistorial]) };
            const analisis = obtenerAnalisisPH(actualizado);
            if (mesaNormalizadaTieneContenido(actualizado)) datos[idActualPH] = actualizado;
            else delete datos[idActualPH];
            await guardarDatosFirebase();
            if (analisis.estado === 'bajo' || analisis.estado === 'alto') {
                alert(`⚠️ pH fuera de rango para ${actualizado.tipoCultivo}. Óptimo actual: ${analisis.rango.min.toFixed(1)} - ${analisis.rango.max.toFixed(1)}.`);
            }
            cerrarModalPH();
            inicializarApp();
        }
        async function gestionarAtencion(id, event) {
            event.stopPropagation();
            let nombreTitulo = id === 'VEGETA' ? 'Mesa VEGETA' : `Mesa ${id.charAt(0)}-${id.slice(1)}`;
            let seleccion = prompt(`Seleccioná una enfermedad para ${nombreTitulo}:\n\n1 - Oidio\n2 - Araña\n3 - Otro (Escribir personalizado)\n4 - Ninguna (Limpiar atención)`);
            if (seleccion === null) return;
            let enfermedad = "";
            if (seleccion.trim() === "1") enfermedad = "Oidio";
            else if (seleccion.trim() === "2") enfermedad = "Araña";
            else if (seleccion.trim() === "3") { let otraEnfermedad = prompt("Ingresá el nombre de la enfermedad o problema:"); if (otraEnfermedad && otraEnfermedad.trim() !== "") enfermedad = otraEnfermedad; }
            else if (seleccion.trim() === "4") enfermedad = "";
            else { alert("Opción no válida."); return; }
            if (!datos[id]) {
                if (enfermedad !== "") {
                    const mesa = normalizarMesaData({});
                    mesa.atencion = enfermedad;
                    datos[id] = mesa;
                }
            } else {
                const mesa = normalizarMesaData(datos[id]);
                mesa.atencion = enfermedad;
                if (mesaNormalizadaTieneContenido(mesa)) datos[id] = mesa;
                else delete datos[id];
            }
            await guardarDatosFirebase();
            inicializarApp();
        }
        function calcularTiempoExacto(fecha) {
            if (!fecha) return { semanas: 0, diasRestantes: 0, diasTotales: 0 };
            const hoy = new Date();
            const partes = (fecha || '').split("-");
            let inicio;
            if (partes.length === 3) inicio = new Date(Number(partes[0]), Number(partes[1]) - 1, Number(partes[2])); else inicio = new Date(fecha);
            if (isNaN(inicio.getTime())) return { semanas: 0, diasRestantes: 0, diasTotales: 0 };
            inicio.setHours(0,0,0,0); hoy.setHours(0,0,0,0);
            const diff = hoy.getTime() - inicio.getTime();
            let diasTotales = Math.floor(diff / (1000 * 60 * 60 * 24));
            if (diasTotales < 0) diasTotales = 0;
            const semanas = Math.floor(diasTotales / 7);
            const diasRestantes = diasTotales % 7;
            return { semanas, diasRestantes, diasTotales };
        }
        function obtenerColorPorSemana(s) { if (s <= 2) return '#1b4d3e'; if (s <= 4) return '#2e6f40'; if (s <= 6) return '#5d6d2f'; if (s <= 8) return '#7a681a'; return '#8c4f1d'; }
        let idActual = "";
        function abrirModal(id) {
            idActual = id;
            const mesa = normalizarMesaData(datos[id] || {});
            document.getElementById('modal').style.display = 'flex';
            let nombreTitulo = id === 'VEGETA' ? 'Mesa VEGETA' : `Mesa ${id.charAt(0)}-${id.slice(1)}`;
            document.getElementById('modal-title').innerText = `Configurar ${nombreTitulo}`;
            document.getElementById('fecha-input').value = mesa.fecha || '';
            document.getElementById('objetivo-input').value = mesa.objetivo || 8;
            document.getElementById('tipo-cultivo-input').value = mesa.tipoCultivo || 'tierra';
            document.getElementById('variedad-input').value = String(mesa.variedadSemanas || 9);
        }
        function cerrarModal() { document.getElementById('modal').style.display = 'none'; }
        async function guardarFecha() {
            const f = document.getElementById('fecha-input').value;
            const o = parseInt(document.getElementById('objetivo-input').value, 10);
            const tipoCultivo = document.getElementById('tipo-cultivo-input').value === 'hidro' ? 'hidro' : 'tierra';
            const variedadSemanas = parseInt(document.getElementById('variedad-input').value, 10);
            if (isNaN(o) || o <= 0) { alert("Por favor, ingresá una meta de semanas mayor a 0."); return; }
            if (![8, 9, 10].includes(variedadSemanas)) { alert('Seleccioná una variedad válida.'); return; }
            const mesa = normalizarMesaData(datos[idActual] || {});
            mesa.fecha = f || '';
            mesa.objetivo = o;
            mesa.tipoCultivo = tipoCultivo;
            mesa.variedadSemanas = variedadSemanas;
            if (mesaNormalizadaTieneContenido(mesa)) datos[idActual] = mesa;
            else delete datos[idActual];
            await guardarDatosFirebase();
            inicializarApp(); 
            cerrarModal(); 
        }
        function abrirModalNotas(id) { idActual = id; document.getElementById('modal-notes').style.display = 'flex'; document.getElementById('notas-input').value = normalizarMesaData(datos[id] || {}).notas || ''; }
        function cerrarModalNotas() { document.getElementById('modal-notes').style.display = 'none'; }
        async function guardarNota() {
            const texto = document.getElementById('notas-input').value;
            const mesa = normalizarMesaData(datos[idActual] || {});
            mesa.notas = texto;
            if (mesaNormalizadaTieneContenido(mesa)) datos[idActual] = mesa;
            else delete datos[idActual];
            await guardarDatosFirebase();
            inicializarApp();
            cerrarModalNotas();
        }
        async function resetearMesa(id, event) { event.stopPropagation(); if (!confirm(`¿Seguro que querés vaciar ${id === 'VEGETA' ? 'Mesa VEGETA' : 'Mesa ' + id} ?`)) return; delete datos[id]; await guardarDatosFirebase(); inicializarApp(); }
        function abrirModalReporte() { const salida = document.getElementById('report-text-output'); if (salida) salida.value = 'Reporte pendiente de completar...'; document.getElementById('modal-report').style.display = 'flex'; }
        function cerrarModalReporte() { document.getElementById('modal-report').style.display = 'none'; }
        function compartirWhatsApp() { const texto = encodeURIComponent(document.getElementById('report-text-output')?.value || ''); window.open(`https://wa.me/?text=${texto}`, '_blank'); }
        window.addEventListener('DOMContentLoaded', async () => { actualizarTablaSales(); if (!getSessionUser()) abrirLogin(); else afterLogin(); const notesInput = document.getElementById('nota-general-input'); if (notesInput) notesInput.value = getCachedGeneralNotes(); });
    </script>
</body>
