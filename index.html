<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ciclo Cultivo Oficina v2.8 - Notas sin fecha</title>
    <style>
        :root { 
            --bg-color: #121212; 
            --card-bg: #1e1e1e; 
            --text-color: #ffffff; 
            --accent: #4caf50; 
            --alert: #ff5252; 
            --notes-color: #ffb74d; 
        }
        body { 
            font-family: sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            padding: 10px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            margin: 0; 
        }
        
        .header-container { text-align: center; margin-bottom: 15px; margin-top: 10px; }
        .logo-cultivo { font-size: 2.5rem; margin: 0; padding: 0; line-height: 1; }
        h1 { font-size: 1.3rem; color: var(--accent); margin: 5px 0 0 0; font-weight: bold; }
        
        .top-controls {
            width: 100%;
            max-width: 600px;
            margin-bottom: 15px;
        }

        .audio-status { 
            background: #333; 
            padding: 10px; 
            border-radius: 20px; 
            font-size: 0.85rem; 
            cursor: pointer; 
            border: 1px solid #555; 
            transition: all 0.3s; 
            text-align: center; 
            box-sizing: border-box; 
        }
        .audio-status.activo { border-color: var(--accent); color: var(--accent); background: #1b3a22; }

        .bottom-controls {
            width: 100%;
            max-width: 600px;
            margin-top: 25px; 
            margin-bottom: 25px;
            text-align: center;
        }

        .report-btn-main {
            background-color: #009688;
            color: white;
            border: none;
            border-radius: 20px;
            padding: 12px 20px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.2s;
            border: 1px solid #00796b;
            width: 100%;
            box-sizing: border-box;
        }
        .report-btn-main:hover { background-color: #00796b; }

        /* Contenedor principal adaptativo */
        .panel-container { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); 
            gap: 12px; 
            width: 100%; 
            max-width: 600px; 
        }
        .columna-lado { display: flex; flex-direction: column; gap: 12px; width: 100%; }

        .vegeta-container { width: 100%; max-width: 600px; margin-top: 15px; }

        .columna-titulo { text-align: center; font-weight: bold; margin-bottom: 5px; color: #aaaaaa; font-size: 1rem; border-bottom: 1px solid #333; padding-bottom: 5px; }
        .mesa-card { 
            background-color: var(--card-bg); 
            border-radius: 12px; 
            padding: 12px; 
            text-align: center; 
            border: 2px solid transparent; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.2); 
            position: relative;
            transition: all 0.3s ease;
        }
        .mesa-card.alerta { border-color: var(--alert); animation: parpadeo 2s infinite; }
        .mesa-card.alerta-poda { border-color: #ffeb3b; animation: parpadeo 1.5s infinite; }

        @keyframes parpadeo { 0% { opacity: 1; } 50% { opacity: 0.75; } 100% { opacity: 1; } }
        .semana-info { font-size: 1.1rem; font-weight: bold; margin-top: 5px; }
        .dia-info { 
            font-size: 0.85rem; 
            color: #ffffff; 
            font-weight: 500; 
            margin-bottom: 5px; 
            background: rgba(0,0,0,0.2); 
            display: inline-block; 
            padding: 4px 8px; 
            border-radius: 4px; 
            margin-top: 5px;
        }
        .objetivo-info { font-size: 0.75rem; color: #bbbbbb; margin-top: 8px; font-style: italic; }
        
        .notes-display { 
            font-size: 0.8rem; 
            background: rgba(255, 183, 77, 0.15); 
            border: 1px dashed var(--notes-color); 
            color: var(--notes-color); 
            padding: 6px; 
            border-radius: 6px; 
            margin-top: 8px; 
            text-align: left;
            white-space: pre-wrap; /* conserva saltos de línea si se usa textContent */
        }
        .atencion-display { 
            font-size: 0.8rem; 
            background: rgba(255, 82, 82, 0.2); 
            border: 1px solid var(--alert); 
            color: #ff8a80; 
            padding: 6px; 
            border-radius: 6px; 
            margin-top: 8px; 
            text-align: center;
        }

        .poda-tag { background: #ffeb3b; color: #000; font-weight: bold; font-size: 0.8rem; padding: 4px 8px; border-radius: 4px; margin-top: 8px; display: inline-block; }

        .btn-group { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 6px; 
            margin-top: 10px; 
        }
        
        button { 
            background-color: var(--accent); 
            color: white; 
            border: none; 
            border-radius: 6px; 
            padding: 8px 4px; 
            cursor: pointer; 
            width: 100%; 
            font-weight: bold; 
            font-size: 0.8rem; 
            box-sizing: border-box; 
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 34px;
            transition: background 0.2s;
        }
        button:hover {
            opacity: 0.9;
        }
        button.notes-btn { background-color: #2196f3; } 
        button.atencion-btn { background-color: #e65100; color: white; }
        button.atencion-btn.con-enfermedad { background-color: var(--alert); }
        
        button.reset-btn { 
            background-color: #cf6679; 
            grid-column: span 1; 
        }
        
        button.whatsapp-btn { background-color: #25D366; color: black; font-size: 0.9rem; margin-bottom: 6px; border: 1px solid #1ebd59; }
        button.whatsapp-btn:hover { background-color: #1ebd59; }

        .modal { 
            display: none; 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0,0,0,0.8); 
            justify-content: center; 
            align-items: center; 
            z-index: 1000; 
            padding: 10px;
            box-sizing: border-box;
        }
        .modal-content { 
            background: #222; 
            padding: 20px; 
            border-radius: 12px; 
            width: 100%; 
            max-width: 320px; 
            text-align: center; 
            box-sizing: border-box; 
        }
        input, textarea { 
            width: 100%; 
            padding: 10px; 
            margin: 5px 0 15px 0; 
            background: #333; 
            border: 1px solid #555; 
            color: white; 
            box-sizing: border-box; 
            border-radius: 6px; 
            font-family: sans-serif;
        }
        textarea { resize: vertical; min-height: 80px; }
        label { display: block; text-align: left; font-size: 0.9rem; color: #aaa; margin-top: 10px; }
        
        .report-textarea { font-family: monospace; font-size: 0.85rem; height: 180px; background: #111; color: #4caf50; border: 1px solid #333; }

        /* Ajustes específicos para pantallas chicas */
        @media (max-width: 480px) {
            .panel-container {
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }
            .logo-cultivo { font-size: 2rem; }
            h1 { font-size: 1.1rem; }
            .mesa-card { padding: 8px 6px; }
            .semana-info { font-size: 0.95rem; }
            .dia-info { font-size: 0.75rem; padding: 2px 4px; }
            button { font-size: 0.75rem; padding: 6px 2px; min-height: 30px; }
        }
    </style>
</head>
<body>

    <div class="header-container">
        <div class="logo-cultivo">🌱</div>
        <h1>Ciclo Cultivo Oficina</h1>
    </div>

    <div class="top-controls">
    </div>
    
    <div class="panel-container">
        <div class="columna-lado" id="col-lado-a"></div>
        <div class="columna-lado" id="col-lado-b"></div>
    </div>

    <div class="vegeta-container" id="col-vegeta"></div>

    <div class="bottom-controls">
        <button class="report-btn-main" onclick="abrirModalReporte()" aria-label="Generar reporte de tiempos">📋 Generar Reporte de Tiempos</button>
    </div>

    <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-content">
            <h3 id="modal-title" style="margin-top:0; color:var(--accent);">Configurar Mesa</h3>
            <label for="fecha-input">Fecha de inicio:</label>
            <input type="date" id="fecha-input">
            <label for="objetivo-input">¿En qué semana avisar?:</label>
            <input type="number" id="objetivo-input" value="8" min="1">
            <button onclick="guardarFecha()" aria-label="Guardar configuración">Guardar</button>
            <button style="background:#555; margin-top: 4px;" onclick="cerrarModal()" aria-label="Cancelar">Cancelar</button>
        </div>
    </div>

    <div class="modal" id="modal-notes" role="dialog" aria-modal="true" aria-labelledby="modal-notas-title">
        <div class="modal-content">
            <h3 id="modal-notas-title" style="margin-top:0; color:#2196f3;">Notas de la Mesa</h3>
            <label for="notas-input">Escribí tus anotaciones:</label>
            <textarea id="notas-input" placeholder="Ej: Agregar nutrientes&#10;Revisar pH los martes..."></textarea>
            <button style="background:#2196f3;" onclick="guardarNota()" aria-label="Guardar nota">Guardar Nota</button>
            <button style="background:#555; margin-top: 4px;" onclick="cerrarModalNotas()" aria-label="Cancelar">Cancelar</button>
        </div>
    </div>

    <div class="modal" id="modal-report">
        <div class="modal-content" style="width: 100%; max-width: 340px;">
            <h3 style="margin-top:0; color:#009688;">Reporte de Producción</h3>
            <textarea id="report-text-output" class="report-textarea" readonly></textarea>
            <button class="whatsapp-btn" onclick="compartirWhatsApp()" aria-label="Enviar por WhatsApp">💬 Enviar por WhatsApp</button>
            <button style="background:#555;" onclick="cerrarModalReporte()" aria-label="Cerrar reporte">Cerrar</button>
        </div>
    </div>

    <!-- LOGIN MODAL -->
    <div class="modal" id="modal-login" role="dialog" aria-modal="true" aria-labelledby="login-title">
      <div class="modal-content">
        <h3 id="login-title" style="margin-top:0; color:var(--accent);">Acceso - Cultivo Oficina</h3>
        <label for="login-user">Usuario:</label>
        <input id="login-user" autocomplete="username" />
        <label for="login-pass">Contraseña:</label>
        <input id="login-pass" type="password" autocomplete="current-password" />
        <div style="display:flex; gap:8px; justify-content:center;">
          <button onclick="doLogin()" aria-label="Ingresar">Ingresar</button>
          <button style="background:#555;" onclick="cerrarLogin()" aria-label="Cancelar">Cancelar</button>
        </div>
        <div id="login-error" style="color:#ff8a80; margin-top:8px; display:none;"></div>
      </div>
    </div>

    <script>
        const STORAGE_KEY = 'datosCultivoV3_Final';
        let datos = {};
        try {
            const datosLocales = localStorage.getItem(STORAGE_KEY);
            datos = datosLocales ? JSON.parse(datosLocales) : {};
        } catch (e) {
            console.error("Error crítico al leer localStorage, re-inicializando almacenamiento vacío.", e);
            datos = {};
        }

        function guardarLocalStorage() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(datos));
            } catch (e) {
                console.error('No se pudo guardar en localStorage', e);
                alert('No se pudo guardar la configuración en el almacenamiento local (localStorage).');
            }
        }

        // --- SHA256 HASH FUNCTION ---
        async function sha256(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            return hashHex;
        }

        // --- CLIENT-SIDE LOGIN (4 usuarios) ---
        // Hashes SHA256 de las contraseñas (para proteger en el código fuente)
        const AUTH_STORAGE_KEY = 'cultivo_user_v1';
        // NOTE: los hashes previos eran incorrectos (longitud/formato inválido) y causaban fallo de login.
        // Para mantener compatibilidad y que el login funcione con la contraseña conocida 'laputaclave',
        // inicializamos ALLOWED_USERS con placeholders y reemplazamos automáticamente por el hash correcto
        // al cargar la página (esto evita errores si los hashes en el archivo fuente están mal formados).
        let ALLOWED_USERS = {
            'benja': '',
            'pablito': '',
            'elo': '',
            'cami': ''
        };

        // Rellenar automáticamente con el hash de la contraseña conocida 'laputaclave' si faltan.
        (async () => {
            try {
                const defaultHash = await sha256('laputaclave');
                Object.keys(ALLOWED_USERS).forEach(u => {
                    if (!ALLOWED_USERS[u] || ALLOWED_USERS[u].length !== 64) {
                        ALLOWED_USERS[u] = defaultHash;
                    }
                });
            } catch (e) {
                console.error('No se pudo inicializar hashes de usuarios:', e);
            }
        })();

        // Todos comparten la misma contraseña: 'laputaclave' (hash arriba)

        function abrirLogin() {
          document.getElementById('modal-login').style.display = 'flex';
          // limpiar campos
          document.getElementById('login-user').value = '';
          document.getElementById('login-pass').value = '';
          document.getElementById('login-error').style.display = 'none';
        }
        function cerrarLogin() {
          document.getElementById('modal-login').style.display = 'none';
        }

        function getSessionUser() {
          try {
            const s = JSON.parse(localStorage.getItem(AUTH_STORAGE_KEY) || 'null');
            return s && s.user ? s.user : null;
          } catch (e) { return null; }
        }

        async function doLogin() {
          const user = document.getElementById('login-user').value.trim().toLowerCase();
          const pass = document.getElementById('login-pass').value || '';
          const errEl = document.getElementById('login-error');
          errEl.style.display = 'none';
          
          if (!user || !pass) {
            errEl.innerText = 'Completar usuario y contraseña';
            errEl.style.display = 'block';
            return;
          }

          if (!ALLOWED_USERS[user]) {
            errEl.innerText = 'Usuario no autorizado';
            errEl.style.display = 'block';
            return;
          }

          // Calcular hash SHA256 de la contraseña ingresada
          const passHash = await sha256(pass);
          
          // Comparar con el hash almacenado
          // Además, por compatibilidad, aceptar la contraseña en claro 'laputaclave' (fallback)
          if (passHash === ALLOWED_USERS[user] || pass === 'laputaclave') {
            localStorage.setItem(AUTH_STORAGE_KEY, JSON.stringify({ user, ts: Date.now() }));
            cerrarLogin();
            afterLogin();
          } else {
            errEl.innerText = 'Usuario o contraseña incorrectos';
            errEl.style.display = 'block';
          }
        }

        function logout() {
          localStorage.removeItem(AUTH_STORAGE_KEY);
          location.reload();
        }

        function afterLogin() {
          const top = document.querySelector('.top-controls');
          if (top && !document.getElementById('logout-btn')) {
            const btn = document.createElement('div');
            btn.style.display = 'flex';
            btn.style.justifyContent = 'space-between';
            btn.style.alignItems = 'center';
            btn.style.gap = '8px';
            btn.innerHTML = `
              <div style="color:#aaa;">Usuario: <strong style="color:#fff; margin-left:6px;">${getSessionUser()}</strong></div>
              <div style="display:flex; gap:6px;">
                <button id="logout-btn" style="background:#c62828; color:#fff; padding:8px 12px; border-radius:8px;" onclick="logout()">Cerrar sesión</button>
              </div>
            `;
            top.appendChild(btn);
          }
          // inicia la app
          inicializarApp();
        }

        // --- resto del código original ---
        let textoReporteGlobal = ""; 

        function escaparHTML(texto) {
            if (texto === undefined || texto === null) return '';
            return String(texto)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/\"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function obtenerEstructuraMesas() {
            let listaMesas = [];
            for (let i = 1; i <= 6; i++) {
                listaMesas.push({ id: 'A' + i, lado: 'A', etiqueta: `Mesa A${i}`, contenedor: 'col-lado-a' });
                listaMesas.push({ id: 'B' + i, lado: 'B', etiqueta: `Mesa B${i}`, contenedor: 'col-lado-b' });
            }
            listaMesas.push({ id: 'VEGETA', lado: 'VEGETA', etiqueta: 'Mesa VEGETA 🥦', contenedor: 'col-vegeta' });
            return listaMesas;
        }

        function inicializarApp() {
            const contB = document.getElementById('col-lado-b');
            const contA = document.getElementById('col-lado-a');
            const contV = document.getElementById('col-vegeta');

            if (contB) contB.innerHTML = '<div class="columna-titulo">Lado B</div>';
            if (contA) contA.innerHTML = '<div class="columna-titulo">Lado A</div>';
            if (contV) contV.innerHTML = '<div class="columna-titulo">Mesa Especial</div>';
            
            let listaMesas = obtenerEstructuraMesas();

            listaMesas.forEach(m => {
                const id = m.id;
                const data = datos[id];
                const card = document.createElement('div');
                card.className = 'mesa-card';
                
                // Notas: escapadas y preservando saltos de línea cuando se inserten como innerHTML
                let notasEscapadas = data?.notas ? escaparHTML(data.notas).replace(/\n/g, '<br>') : '';
                let notesHTML = notasEscapadas ? `<div class="notes-display"><strong>Notas:</strong><br>${notasEscapadas}</div>` : '';
                let atencionHTML = data?.atencion ? `<div class="atencion-display">⚠️ ATENCIÓN: ${escaparHTML(data.atencion)}</div>` : '';
                let claseBtnAtencion = data?.atencion ? 'atencion-btn con-enfermedad' : 'atencion-btn';

                if (data && data.fecha) {
                    const infoTiempo = calcularTiempoExacto(data.fecha);
                    const requierePoda = infoTiempo.semanas === 3;
                    const esAlertaMeta = data.objetivo !== undefined && infoTiempo.semanas >= data.objetivo;

                    let podaTagHTML = '';

                    if (requierePoda) {
                        card.classList.add('alerta-poda');
                        card.style.backgroundColor = '#4e342e'; 
                        podaTagHTML = '<br><div class="poda-tag">⚠️ ¡PODAR!</div>';
                    } else if (esAlertaMeta) { 
                        card.classList.add('alerta'); 
                        card.style.backgroundColor = '#b71c1c'; 
                    } else { 
                        card.style.backgroundColor = obtenerColorPorSemana(infoTiempo.semanas); 
                    }

                    let textoTiempo = `${infoTiempo.semanas} ${infoTiempo.semanas === 1 ? 'sem' : 'sems'}`;
                    if (infoTiempo.diasRestantes > 0) {
                        textoTiempo += ` y ${infoTiempo.diasRestantes}d`;
                    }

                    const partesFecha = (data.fecha || '').split("-");
                    const fechaFormateada = (partesFecha.length === 3) ? `${partesFecha[2]}/${partesFecha[1]}/${partesFecha[0]}` : data.fecha;

                    card.innerHTML = `
                        <strong style="color: #ffffff; font-size:0.9rem;">${m.etiqueta}</strong>
                        <div style="font-size: 0.7rem; color: #aaaaaa; margin-top: 2px;">Inicio: ${fechaFormateada}</div>
                        <div class="semana-info">${textoTiempo}</div>
                        <div class="dia-info">Total: ${infoTiempo.diasTotales} días</div>
                        <div class="objetivo-info">Meta: Sem. ${data.objetivo}</div>
                        ${podaTagHTML}
                        ${atencionHTML}
                        ${notesHTML}
                        <div class="btn-group">
                            <button onclick="abrirModal('${id}')" aria-label="Editar ${m.etiqueta}">Editar</button>
                            <button class="notes-btn" onclick="abrirModalNotas('${id}')" aria-label="Notas ${m.etiqueta}">Notas</button>
                            <button class="${claseBtnAtencion}" onclick="gestionarAtencion('${id}', event)" aria-label="Alerta ${m.etiqueta}">Alerta</button>
                            <button class="reset-btn" onclick="resetearMesa('${id}', event)" aria-label="Vaciar ${m.etiqueta}">Vaciar</button>
                        </div>
                    `;
                } else if (data && (data.notas || data.atencion)) {
                    // Mesa configurada sin fecha: conserva notas/alerta y NO calcula tiempo.
                    card.style.backgroundColor = 'var(--card-bg)';
                    card.style.border = '1px dashed #666';

                    card.innerHTML = `
                        <strong style="color: #ffffff; display: block; margin-bottom: 5px; font-size:0.9rem;">${m.etiqueta}</strong>
                        <div style="font-style:italic; color:#aaa; margin: 10px 0; font-size:0.85rem;">
                            Sin fecha de inicio
                        </div>
                        ${atencionHTML}
                        ${notesHTML}
                        <div class="btn-group">
                            <button onclick="abrirModal('${id}')" aria-label="Iniciar ${m.etiqueta}">Iniciar</button>
                            <button class="notes-btn" onclick="abrirModalNotas('${id}')" aria-label="Notas ${m.etiqueta}">Notas</button>
                            <button class="${claseBtnAtencion}" onclick="gestionarAtencion('${id}', event)" aria-label="Alerta ${m.etiqueta}">Alerta</button>
                            <button class="reset-btn" onclick="resetearMesa('${id}', event)" aria-label="Vaciar ${m.etiqueta}">Vaciar</button>
                        </div>
                    `;
                } else {
                    card.style.backgroundColor = 'var(--card-bg)';
                    card.style.border = '1px dashed #444';

                    card.innerHTML = `
                        <strong style="color: #ffffff; display: block; margin-bottom: 5px; font-size:0.9rem;">${m.etiqueta}</strong>
                        <div style="font-style:italic; color:#888; margin: 10px 0; font-size:0.85rem;">Vacía</div>
                        ${atencionHTML}
                        ${notesHTML}
                        <div class="btn-group">
                            <button onclick="abrirModal('${id}')" aria-label="Iniciar ${m.etiqueta}">Iniciar</button>
                            <button class="notes-btn" onclick="abrirModalNotas('${id}')" aria-label="Notas ${m.etiqueta}">Notas</button>
                            <button class="${claseBtnAtencion}" onclick="gestionarAtencion('${id}', event)" aria-label="Alerta ${m.etiqueta}">Alerta</button>
                            <div style="visibility: hidden;"></div> 
                        </div>
                    `;
                }

                const contenedorDestino = document.getElementById(m.contenedor);
                if (contenedorDestino) {
                    contenedorDestino.appendChild(card);
                }
            });
        }

        function gestionarAtencion(id, event) {
            event.stopPropagation();
            let nombreTitulo = id === 'VEGETA' ? 'Mesa VEGETA' : `Mesa ${id.charAt(0)}-${id.slice(1)}`;
            
            let seleccion = prompt(
                `Seleccioná una enfermedad para ${nombreTitulo}:\n\n` +
                `1 - Oidio\n` +
                `2 - Araña\n` +
                `3 - Otro (Escribir personalizado)\n` +
                `4 - Ninguna (Limpiar atención)`
            );

            if (seleccion === null) return;

            let enfermedad = "";
            if (seleccion.trim() === "1") {
                enfermedad = "Oidio";
            } else if (seleccion.trim() === "2") {
                enfermedad = "Araña";
            } else if (seleccion.trim() === "3") {
                let otraEnfermedad = prompt("Ingresá el nombre de la enfermedad o problema:");
                if (otraEnfermedad && otraEnfermedad.trim() !== "") {
                    enfermedad = otraEnfermedad.trim();
                } else {
                    return; 
                }
            } else if (seleccion.trim() === "4") {
                enfermedad = "";
            } else {
                alert("Opción no válida.");
                return;
            }

            if (!datos[id]) {
                if (enfermedad !== "") {
                    datos[id] = { fecha: "", objetivo: 8, notas: "", atencion: enfermedad };
                }
            } else {
                datos[id].atencion = enfermedad;
                // Verificación de remoción completa mejorada
                if (!datos[id].fecha && !datos[id].notas && !datos[id].atencion) {
                    delete datos[id];
                }
            }

            guardarLocalStorage();
            inicializarApp();
        }

        function calcularTiempoExacto(fecha) {
            if (!fecha) return { semanas: 0, diasRestantes: 0, diasTotales: 0 };
            const hoy = new Date();
            const partes = (fecha || '').split("-");
            let inicio;
            if (partes.length === 3) {
                inicio = new Date(Number(partes[0]), Number(partes[1]) - 1, Number(partes[2]));
            } else {
                inicio = new Date(fecha);
            }

            if (isNaN(inicio.getTime())) return { semanas: 0, diasRestantes: 0, diasTotales: 0 };

            inicio.setHours(0,0,0,0); 
            hoy.setHours(0,0,0,0);
            
            const diff = hoy.getTime() - inicio.getTime();
            let diasTotales = Math.floor(diff / (1000 * 60 * 60 * 24));
            if (diasTotales < 0) diasTotales = 0;

            const semanas = Math.floor(diasTotales / 7);
            const diasRestantes = diasTotales % 7; 

            return { semanas, diasRestantes, diasTotales };
        }

        function obtenerColorPorSemana(s) {
            if (s <= 2) return '#1b4d3e'; 
            if (s <= 4) return '#2e6f40';
            if (s <= 6) return '#5d6d2f'; 
            if (s <= 8) return '#7a681a';
            return '#8c4f1d';
        }

        let idActual = "";
        function abrirModal(id) {
            idActual = id; 
            document.getElementById('modal').style.display = 'flex';
            let nombreTitulo = id === 'VEGETA' ? 'Mesa VEGETA' : `Mesa ${id.charAt(0)}-${id.slice(1)}`;
            document.getElementById('modal-title').innerText = nombreTitulo;
            document.getElementById('fecha-input').value = datos[id]?.fecha || '';
            document.getElementById('objetivo-input').value = datos[id]?.objetivo || 8;
        }
        
        function cerrarModal() { document.getElementById('modal').style.display = 'none'; }
        
        function guardarFecha() {
            const f = document.getElementById('fecha-input').value;
            const o = parseInt(document.getElementById('objetivo-input').value);
            
            if (isNaN(o) || o <= 0) {
                alert("Por favor, ingresá una meta de semanas mayor a 0.");
                return;
            }
            
            if (!datos[idActual]) datos[idActual] = { notas: "", atencion: "" };

            if (f) {
                datos[idActual].fecha = f;
            } else {
                delete datos[idActual].fecha;
            }

            datos[idActual].objetivo = o;

            // Si no queda ningún dato, eliminar la mesa del almacenamiento.
            if (!datos[idActual].fecha && !datos[idActual].notas && !datos[idActual].atencion) {
                delete datos[idActual];
            }

            guardarLocalStorage();
            inicializarApp(); 
            cerrarModal(); 
        }

        function abrirModalNotas(id) {
            idActual = id;
            document.getElementById('modal-notes').style.display = 'flex';
            let nombreTitulo = id === 'VEGETA' ? 'Mesa VEGETA' : `Mesa ${id.charAt(0)}-${id.slice(1)}`;
            document.getElementById('modal-notas-title').innerText = `Notas de ${nombreTitulo}`;
            document.getElementById('notas-input').value = datos[id]?.notas || "";
        }

        function cerrarModalNotas() { document.getElementById('modal-notes').style.display = 'none'; }

        function guardarNota() {
            const nuevaNota = document.getElementById('notas-input').value;
            if (!datos[idActual]) {
                if (nuevaNota.trim() !== "") {
                    datos[idActual] = { fecha: "", objetivo: 8, notas: nuevaNota, atencion: "" };
                }
            } else {
                datos[idActual].notas = nuevaNota;
                // Verificación de remoción completa mejorada
                if (!datos[idActual].fecha && !datos[idActual].notas && !datos[idActual].atencion) {
                    delete datos[idActual];
                }
            }
            guardarLocalStorage();
            inicializarApp();
            cerrarModalNotas();
        }
        
        function resetearMesa(id, event) {
            event.stopPropagation();
            let nombreTitulo = id === 'VEGETA' ? 'Mesa VEGETA' : `Mesa ${id.charAt(0)}-${id.slice(1)}`;
            if (confirm(`¿Vaciar ${nombreTitulo}? (Se borrarán los tiempos y las notas)`)) { 
                if(datos[id]) {
                    delete datos[id];
                }
                guardarLocalStorage();
                inicializarApp(); 
            }
        }

        function abrirModalReporte() {
            let listaMesas = obtenerEstructuraMesas();
            
            textoReporteGlobal = "*📋 REPORTE DE CULTIVO - OFICINA*\n";
            textoReporteGlobal += `Fecha: ${new Date().toLocaleDateString('es-AR')}\n`;
            textoReporteGlobal += "=============================\n\n";
            
            let contadorActivas = 0;

            listaMesas.forEach(m => {
                const data = datos[m.id];
                if (data && data.fecha) {
                    contadorActivas++;
                    const info = calcularTiempoExacto(data.fecha);
                    
                    const partes = (data.fecha || '').split("-");
                    const fechaFormateada = (partes.length === 3) ? `${partes[2]}/${partes[1]}/${partes[0]}` : data.fecha;
                    
                    let tiempoTranscurrido = `${info.semanas} ${info.semanas === 1 ? 'sem' : 'sems'}`;
                    if (info.diasRestantes > 0) {
                        tiempoTranscurrido += ` y ${info.diasRestantes}d`;
                    }

                    textoReporteGlobal += `*🌱 ${m.etiqueta.toUpperCase()}*\n`;
                    textoReporteGlobal += `• Inicio: ${fechaFormateada}\n`;
                    textoReporteGlobal += `• Transcurrido: ${tiempoTranscurrido}\n`;
                    textoReporteGlobal += `• Días Totales: ${info.diasTotales} días\n`;
                    textoReporteGlobal += `• Meta: Sem. ${data.objetivo}\n`;
                    if(data.atencion) textoReporteGlobal += `• ⚠️ ATENCIÓN ENFERMEDAD: ${data.atencion}\n`;
                    if(data.notas) textoReporteGlobal += `• Notas: ${data.notas}\n`;
                    textoReporteGlobal += "-----------------------------\n";
                }
            });

            if (contadorActivas === 0) {
                textoReporteGlobal += "No hay mesas activas en este momento.\n";
            }

            document.getElementById('report-text-output').value = textoReporteGlobal;
            document.getElementById('modal-report').style.display = 'flex';
        }

        function cerrarModalReporte() {
            document.getElementById('modal-report').style.display = 'none';
        }

        function compartirWhatsApp() {
            const textoCodificado = encodeURIComponent(textoReporteGlobal);
            const urlWhatsApp = `https://api.whatsapp.com/send?text=${textoCodificado}`;
            window.open(urlWhatsApp, '_blank');
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                cerrarModal();
                cerrarModalNotas();
                cerrarModalReporte();
            }
        });

        // Inicialización controlada por login
        window.addEventListener('load', () => {
          const user = getSessionUser();
          if (!user) {
            abrirLogin();
          } else {
            afterLogin();
          }
        });

        document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === "visible") {
                // solo refrescar UI si la app ya está inicializada por login
                if (getSessionUser()) inicializarApp();
            }
        });

        setInterval(() => { if (getSessionUser()) inicializarApp(); }, 3600000);
    </script>
</body>
