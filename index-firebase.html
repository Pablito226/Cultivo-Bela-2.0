<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ciclo Cultivo Oficina - Firebase Admin</title>
    <style>
        :root { 
            --bg-color: #121212; 
            --card-bg: #1e1e1e; 
            --text-color: #ffffff; 
            --accent: #4caf50; 
            --alert: #ff5252; 
            --notes-color: #ffb74d; 
        }
        body { 
            font-family: sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            padding: 10px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            margin: 0; 
        }
        
        .header-container { text-align: center; margin-bottom: 15px; margin-top: 10px; }
        .logo-cultivo { font-size: 2.5rem; margin: 0; padding: 0; line-height: 1; }
        h1 { font-size: 1.3rem; color: var(--accent); margin: 5px 0 0 0; font-weight: bold; }
        
        .top-controls {
            width: 100%;
            max-width: 600px;
            margin-bottom: 12px;
        }

        .user-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            background: #1b1b1b;
            border: 1px solid #333;
            border-radius: 14px;
            padding: 10px 12px;
            margin-bottom: 12px;
            box-sizing: border-box;
            flex-wrap: wrap;
        }

        .user-bar span { color: #aaa; font-size: 0.9rem; }

        .quick-access {
            width: 100%;
            max-width: 600px;
            margin: 0 auto 15px auto;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 16px;
            padding: 12px;
            box-sizing: border-box;
            box-shadow: 0 4px 8px rgba(0,0,0,0.22);
        }

        .quick-access-title {
            text-align: center;
            color: #cfcfcf;
            font-weight: bold;
            font-size: 0.95rem;
            margin-bottom: 10px;
        }

        .quick-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        .quick-btn {
            border: none;
            border-radius: 14px;
            padding: 14px 10px;
            cursor: pointer;
            width: 100%;
            color: #fff;
            font-weight: bold;
            font-size: 0.9rem;
            min-height: 64px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.25);
            transition: transform 0.15s ease, opacity 0.2s ease;
        }

        .quick-btn:hover { transform: translateY(-1px); opacity: 0.95; }
        .quick-btn.sales { background: linear-gradient(135deg, #6a4c93, #8e5bbd); }
        .quick-btn.notes { background: linear-gradient(135deg, #1565c0, #1e88e5); }
        .quick-btn.vegeta { background: linear-gradient(135deg, #2e7d32, #43a047); }
        .quick-btn.report { background: linear-gradient(135deg, #00796b, #009688); }

        .panel-open {
            width: 100%;
            max-width: 600px;
            margin: 0 auto 15px auto;
            display: none;
        }
        .panel-open.visible { display: block; }
        
        .sales-panel {
            width: 100%;
            max-width: 600px;
            margin: 0 auto 15px auto;
            background: #1b1b1b;
            border: 1px solid #444;
            border-radius: 12px;
            padding: 10px;
            box-sizing: border-box;
        }

        .sales-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.78rem;
            background: #242424;
        }

        .sales-table th, .sales-table td {
            border: 1px solid #555;
            padding: 8px;
            text-align: center;
        }

        .panel-container { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); 
            gap: 12px; 
            width: 100%; 
            max-width: 600px; 
        }
        .columna-lado { display: flex; flex-direction: column; gap: 12px; width: 100%; }
        .columna-titulo { text-align: center; font-weight: bold; margin-bottom: 5px; color: #aaa; border-bottom: 1px solid #333; }

        .mesa-card { 
            background-color: var(--card-bg); 
            border-radius: 12px; 
            padding: 12px; 
            text-align: center; 
            border: 2px solid transparent; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.2); 
        }
        .mesa-card.alerta { border-color: var(--alert); }

        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 10px; }
        
        button { 
            background-color: var(--accent); 
            color: white; 
            border: none; 
            border-radius: 6px; 
            padding: 8px; 
            cursor: pointer; 
            font-weight: bold; 
        }

        /* MODALES */
        .modal { 
            display: none; position: fixed; top: 0; left: 0; 
            width: 100%; height: 100%; background: rgba(0,0,0,0.85); 
            justify-content: center; align-items: center; z-index: 1000; padding: 10px;
            box-sizing: border-box;
        }
        .modal-content { 
            background: #222; padding: 20px; border-radius: 12px; 
            width: 100%; max-width: 340px; text-align: center; box-sizing: border-box;
        }
        input, textarea { 
            width: 100%; padding: 10px; margin: 5px 0 15px 0; 
            background: #333; border: 1px solid #555; color: white; border-radius: 6px;
            box-sizing: border-box;
        }

        .user-list-container {
            max-height: 150px; overflow-y: auto; background: #111;
            margin: 10px 0; border-radius: 8px; border: 1px solid #333;
        }
        .user-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 8px; border-bottom: 1px solid #222; font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="header-container">
        <div class="logo-cultivo">🌱</div>
        <h1>Cultivo Oficina</h1>
    </div>

    <div class="top-controls">
        <div class="user-bar" id="user-bar" style="display:none;"></div>
    </div>
    
    <div class="quick-access">
        <div class="quick-grid">
            <button class="quick-btn sales" onclick="togglePanel('sales-panel')">🧪 Sales</button>
            <button class="quick-btn notes" onclick="togglePanel('notes-panel')">📝 Notas</button>
            <button class="quick-btn vegeta" onclick="togglePanel('vegeta-panel')">🥦 Vegeta</button>
            <button class="quick-btn report" onclick="abrirModalReporte()">📋 Reporte</button>
        </div>
    </div>

    <!-- PANELES OCULTOS -->
    <div class="panel-open" id="sales-panel">
        <div class="sales-panel">
            <h3 style="color:#ffb74d;">Calculadora Sales (10L)</h3>
            <input type="number" id="sales-litros" value="10" oninput="actualizarTablaSales()" style="width: 80px; text-align: center;"> Litros
            <table class="sales-table">
                <thead><tr><th>EC</th><th>GROW</th><th>CORE</th></tr></thead>
                <tbody id="sales-table-body"></tbody>
            </table>
        </div>
    </div>

    <!-- GRILLA PRINCIPAL -->
    <div class="panel-container">
        <div class="columna-lado" id="col-lado-a"></div>
        <div class="columna-lado" id="col-lado-b"></div>
    </div>

    <div class="panel-open" id="vegeta-panel">
        <div class="columna-lado" id="col-vegeta" style="max-width:300px; margin:auto;"></div>
    </div>

    <div class="panel-open" id="notes-panel">
        <div class="mesa-card" style="border:1px dashed #4dd0e1;">
            <strong>Notas Generales</strong>
            <textarea id="nota-general-input" placeholder="Escribir notas aquí..."></textarea>
            <button onclick="guardarNotaGeneral()">Guardar Notas</button>
        </div>
    </div>

    <!-- MODAL LOGIN -->
    <div class="modal" id="modal-login">
      <div class="modal-content">
        <h3 style="color:var(--accent);">Acceso al Sistema</h3>
        <input id="login-user" placeholder="Usuario" autocomplete="username" />
        <input id="login-pass" type="password" placeholder="Contraseña" autocomplete="current-password" />
        <button onclick="doLogin()" style="width:100%; padding:12px;">Ingresar</button>
        <div id="login-error" style="color:var(--alert); margin-top:10px; display:none;"></div>
      </div>
    </div>

    <!-- MODAL ADMIN USUARIOS -->
    <div class="modal" id="modal-admin-users">
        <div class="modal-content">
            <h3 style="color:#ff9800;">👥 Administrar Usuarios</h3>
            <div class="user-list-container" id="user-list"></div>
            <div style="background:#1a1a1a; padding:10px; border-radius:10px; margin-top:10px;">
                <input id="new-user-name" placeholder="Nombre usuario" />
                <input id="new-user-pass" type="password" placeholder="Clave" />
                <button onclick="crearUsuario()" style="width:100%; background:#ff9800; color:black;">+ Agregar Usuario</button>
            </div>
            <button onclick="cerrarAdminUsers()" style="background:#555; margin-top:10px;">Cerrar</button>
        </div>
    </div>

    <!-- MODAL CONFIG MESA -->
    <div class="modal" id="modal-config">
        <div class="modal-content">
            <h3 id="modal-title">Configurar Mesa</h3>
            <input type="date" id="fecha-input">
            <input type="number" id="objetivo-input" value="8">
            <button onclick="guardarConfig()">Guardar</button>
            <button style="background:#555;" onclick="cerrarModal()">Cancelar</button>
        </div>
    </div>

    <script>
        const FIREBASE_CONFIG = {
            apiKey: "AIzaSyDfn3GMrVVNeHl0VT_H03pOXApmV4Q2Yyg",
            authDomain: "cultivo-oficina.firebaseapp.com",
            databaseURL: "https://cultivo-oficina-default-rtdb.firebaseio.com",
            projectId: "cultivo-oficina",
            storageBucket: "cultivo-oficina.firebasestorage.app",
            messagingSenderId: "226128922982",
            appId: "1:226128922982:web:81cb9814c5d107e4f260a7"
        };

        const AUTH_STORAGE_KEY = 'cultivo_auth_v1';
        let datos = {};
        let firebaseDb, firebaseRef, firebaseGet, firebaseSet, firebaseRemove;

        async function initFirebase() {
            const appModule = await import("https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js");
            const dbModule = await import("https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js");
            const app = appModule.initializeApp(FIREBASE_CONFIG);
            firebaseDb = dbModule.getDatabase(app);
            firebaseRef = dbModule.ref;
            firebaseGet = dbModule.get;
            firebaseSet = dbModule.set;
            firebaseRemove = dbModule.remove;
        }

        async function sha256(msg) {
            const msgBuffer = new TextEncoder().encode(msg);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function doLogin() {
            const user = document.getElementById('login-user').value.toLowerCase().trim();
            const pass = document.getElementById('login-pass').value;
            if(!user || !pass) return;

            await initFirebase();
            const snapshot = await firebaseGet(firebaseRef(firebaseDb, "cultivoOficina/usuarios"));
            const usuarios = snapshot.val() || {};
            
            const hashed = await sha256(pass);
            if(usuarios[user] === hashed) {
                localStorage.setItem(AUTH_STORAGE_KEY, JSON.stringify({ user, ts: Date.now() }));
                location.reload();
            } else {
                const err = document.getElementById('login-error');
                err.innerText = "Usuario o contraseña incorrectos";
                err.style.display = "block";
            }
        }

        function logout() { localStorage.removeItem(AUTH_STORAGE_KEY); location.reload(); }

        async function checkAuth() {
            const session = JSON.parse(localStorage.getItem(AUTH_STORAGE_KEY));
            if(!session) {
                document.getElementById('modal-login').style.display = 'flex';
                return;
            }
            
            await initFirebase();
            const isAdmin = (session.user === 'pablito');
            
            const userBar = document.getElementById('user-bar');
            userBar.style.display = 'flex';
            userBar.innerHTML = `
                <span>👤 <strong>${session.user}</strong></span>
                <div style="display:flex; gap:6px;">
                    ${isAdmin ? `<button onclick="abrirAdminUsers()" style="background:#ff9800; color:black; font-size:0.75rem; padding:5px 10px;">👥 Usuarios</button>` : ''}
                    <button onclick="logout()" style="background:#555; font-size:0.75rem; padding:5px 10px;">Salir</button>
                </div>
            `;

            // Cargar datos reales
            const snap = await firebaseGet(firebaseRef(firebaseDb, "cultivoOficina/datos"));
            datos = snap.val() || {};
            const notesSnap = await firebaseGet(firebaseRef(firebaseDb, "cultivoOficina/notasGenerales"));
            document.getElementById('nota-general-input').value = notesSnap.val() || "";
            
            renderMesas();
            actualizarTablaSales();
        }

        function renderMesas() {
            const containers = { A: document.getElementById('col-lado-a'), B: document.getElementById('col-lado-b'), V: document.getElementById('col-vegeta') };
            Object.values(containers).forEach(c => c.innerHTML = "");
            
            for(let i=1; i<=6; i++){
                ['A', 'B'].forEach(lado => {
                    const id = lado + i;
                    const d = datos[id] || {};
                    containers[lado].appendChild(crearCardMesa(id, d));
                });
            }
            containers.V.appendChild(crearCardMesa('VEGETA', datos['VEGETA'] || {}));
        }

        function crearCardMesa(id, d) {
            const card = document.createElement('div');
            card.className = 'mesa-card';
            let info = "No iniciada";
            if(d.fecha) {
                const hoy = new Date();
                const inicio = new Date(d.fecha);
                const diff = Math.floor((hoy - inicio) / (1000 * 60 * 60 * 24));
                const s = Math.floor(diff/7); const r = diff%7;
                info = `${s} sem y ${r}d`;
                if(s >= (d.objetivo || 8)) card.classList.add('alerta');
                card.style.background = s <= 3 ? '#1b4d3e' : (s <= 6 ? '#5d6d2f' : '#8c4f1d');
            }
            card.innerHTML = `
                <strong style="display:block; margin-bottom:5px;">${id}</strong>
                <div style="font-size:1.1rem; font-weight:bold;">${info}</div>
                <div class="btn-group">
                    <button onclick="abrirConfig('${id}')">⚙️</button>
                    <button style="background:#2196f3;" onclick="abrirConfig('${id}')">📝</button>
                </div>
            `;
            return card;
        }

        let idMesaActual = "";
        function abrirConfig(id) { idMesaActual = id; document.getElementById('modal-config').style.display = 'flex'; }
        function cerrarModal() { document.getElementById('modal-config').style.display = 'none'; }

        async function guardarConfig() {
            if(!datos[idMesaActual]) datos[idMesaActual] = {};
            datos[idMesaActual].fecha = document.getElementById('fecha-input').value;
            datos[idMesaActual].objetivo = document.getElementById('objetivo-input').value;
            await firebaseSet(firebaseRef(firebaseDb, "cultivoOficina/datos"), datos);
            cerrarModal(); renderMesas();
        }

        async function guardarNotaGeneral() {
            const val = document.getElementById('nota-general-input').value;
            await firebaseSet(firebaseRef(firebaseDb, "cultivoOficina/notasGenerales"), val);
            alert("Notas guardadas.");
        }

        // GESTIÓN USUARIOS (SOLO PABLITO)
        async function abrirAdminUsers() {
            document.getElementById('modal-admin-users').style.display = 'flex';
            const snap = await firebaseGet(firebaseRef(firebaseDb, "cultivoOficina/usuarios"));
            const usuarios = snap.val() || {};
            const list = document.getElementById('user-list');
            list.innerHTML = Object.keys(usuarios).map(u => `
                <div class="user-item">
                    <span>${u}</span>
                    <button style="background:red; padding:3px 8px; font-size:0.7rem;" onclick="eliminarUsuario('${u}')">Borrar</button>
                </div>
            `).join('');
        }

        function cerrarAdminUsers() { document.getElementById('modal-admin-users').style.display = 'none'; }

        async function crearUsuario() {
            const u = document.getElementById('new-user-name').value.toLowerCase().trim();
            const p = document.getElementById('new-user-pass').value;
            if(!u || !p) return;
            const hashed = await sha256(p);
            await firebaseSet(firebaseRef(firebaseDb, `cultivoOficina/usuarios/${u}`), hashed);
            abrirAdminUsers();
            document.getElementById('new-user-name').value = "";
            document.getElementById('new-user-pass').value = "";
        }

        async function eliminarUsuario(user) {
            if(user === 'pablito') return alert("No puedes borrar al admin.");
            if(confirm(`¿Borrar a ${user}?`)) {
                await firebaseRemove(firebaseRef(firebaseDb, `cultivoOficina/usuarios/${user}`));
                abrirAdminUsers();
            }
        }

        // CALCULADORA SALES
        function actualizarTablaSales() {
            const litros = document.getElementById('sales-litros').value || 10;
            const base = [{ec:0.5,g:2.8,c:1.7},{ec:1.0,g:6.1,c:3.6},{ec:1.5,g:9.4,c:5.7},{ec:2.0,g:12.9,c:7.7},{ec:2.5,g:16.5,c:9.9,esp:true}];
            const tbody = document.getElementById('sales-table-body');
            tbody.innerHTML = base.map(s => `
                <tr style="${s.esp ? 'background:rgba(76,175,80,0.2);' : ''}">
                    <td>${s.ec}</td>
                    <td>${(s.g * litros / 10).toFixed(1)}g</td>
                    <td>${(s.c * litros / 10).toFixed(1)}g</td>
                </tr>
            `).join('');
        }

        function togglePanel(id) {
            const p = document.getElementById(id);
            const isV = p.classList.contains('visible');
            document.querySelectorAll('.panel-open').forEach(x => x.classList.remove('visible'));
            if(!isV) p.classList.add('visible');
        }

        function abrirModalReporte() {
            let txt = "📋 REPORTE CULTIVO\n";
            Object.keys(datos).forEach(id => {
                const d = datos[id]; if(!d.fecha) return;
                const sem = Math.floor((new Date() - new Date(d.fecha))/(1000*60*60*24*7));
                txt += `${id}: Sem ${sem}\n`;
            });
            window.open(`https://wa.me/?text=${encodeURIComponent(txt)}`);
        }

        window.onload = checkAuth;
    </script>
</body>
</html>
