<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ciclo Cultivo Oficina v2.8 - IA Gemini</title>
    <style>
        :root { 
            --bg-color: #121212; 
            --card-bg: #1e1e1e; 
            --text-color: #ffffff; 
            --accent: #4caf50; 
            --alert: #ff5252; 
            --notes-color: #ffb74d; 
        }
        body { 
            font-family: sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            padding: 10px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            margin: 0; 
        }
        
        .header-container { text-align: center; margin-bottom: 15px; margin-top: 10px; }
        .logo-cultivo { font-size: 2.5rem; margin: 0; padding: 0; line-height: 1; }
        h1 { font-size: 1.3rem; color: var(--accent); margin: 5px 0 0 0; font-weight: bold; }
        
        .top-controls {
            width: 100%;
            max-width: 600px;
            margin-bottom: 12px;
        }

        .user-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            background: #1b1b1b;
            border: 1px solid #333;
            border-radius: 14px;
            padding: 10px 12px;
            margin-bottom: 12px;
            box-sizing: border-box;
        }

        .user-bar span {
            color: #aaa;
            font-size: 0.9rem;
        }

        .quick-access {
            width: 100%;
            max-width: 600px;
            margin: 0 auto 15px auto;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 16px;
            padding: 12px;
            box-sizing: border-box;
            box-shadow: 0 4px 8px rgba(0,0,0,0.22);
        }

        .quick-access-title {
            text-align: center;
            color: #cfcfcf;
            font-weight: bold;
            font-size: 0.95rem;
            margin-bottom: 10px;
        }

        .quick-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        .quick-btn {
            border: none;
            border-radius: 14px;
            padding: 14px 10px;
            cursor: pointer;
            width: 100%;
            color: #fff;
            font-weight: bold;
            font-size: 0.9rem;
            min-height: 64px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.25);
            transition: transform 0.15s ease, opacity 0.2s ease;
        }

        .quick-btn:hover { transform: translateY(-1px); opacity: 0.95; }
        .quick-btn .sub { font-size: 0.72rem; opacity: 0.85; font-weight: 500; }
        .quick-btn.sales { background: linear-gradient(135deg, #6a4c93, #8e5bbd); }
        .quick-btn.notes { background: linear-gradient(135deg, #1565c0, #1e88e5); }
        .quick-btn.vegeta { background: linear-gradient(135deg, #2e7d32, #43a047); }
        .quick-btn.report { background: linear-gradient(135deg, #00796b, #009688); }
        .quick-btn.ia { background: linear-gradient(135deg, #0ea5e9, #0284c7); }

        .panel-open {
            width: 100%;
            max-width: 600px;
            margin: 0 auto 15px auto;
            display: none;
        }
        .panel-open.visible { display: block; }
        
        .sales-panel {
            width: 100%;
            max-width: 600px;
            margin: 0 auto 15px auto;
            background: #1b1b1b;
            border: 1px solid #444;
            border-radius: 12px;
            padding: 10px;
            box-sizing: border-box;
            box-shadow: 0 4px 8px rgba(0,0,0,0.25);
        }

        .sales-title {
            text-align: center;
            color: #ffb74d;
            font-weight: bold;
            font-size: 1.05rem;
            margin: 0 0 8px 0;
        }

        .sales-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }

        .sales-controls label {
            display: inline;
            margin: 0;
            color: #ddd;
            font-weight: bold;
        }

        .sales-litros {
            width: 90px !important;
            margin: 0 !important;
            padding: 7px 8px !important;
            text-align: center;
            font-weight: bold;
            background: #292929 !important;
        }

        .sales-scroll {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            border-radius: 8px;
        }

        .sales-table {
            width: 100%;
            min-width: 470px;
            border-collapse: collapse;
            font-size: 0.78rem;
            background: #242424;
        }

        .sales-table th,
        .sales-table td {
            border: 1px solid #555;
            padding: 6px 5px;
            text-align: center;
            white-space: nowrap;
        }

        .sales-table th {
            background: #303030;
            color: #fff;
            font-weight: bold;
        }

        .sales-table td:first-child {
            color: #ffcc80;
            font-weight: bold;
        }

        .sales-table .gramos {
            color: #fff;
            font-weight: bold;
        }

        .sales-table .por-litro {
            color: #4dd0e1;
            font-size: 0.72rem;
        }

        .sales-table tr.seleccionada {
            background: rgba(76, 175, 80, 0.22);
            outline: 2px solid var(--accent);
            outline-offset: -2px;
        }

        .sales-note {
            text-align: center;
            color: #999;
            font-size: 0.68rem;
            margin-top: 6px;
        }

        .panel-container { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); 
            gap: 12px; 
            width: 100%; 
            max-width: 600px; 
        }
        .columna-lado { display: flex; flex-direction: column; gap: 12px; width: 100%; }

        .vegeta-container { width: 100%; max-width: 600px; margin-top: 15px; }

        .columna-titulo { text-align: center; font-weight: bold; margin-bottom: 5px; color: #aaaaaa; font-size: 1rem; border-bottom: 1px solid #333; padding-bottom: 5px; }
        .mesa-card { 
            background-color: var(--card-bg); 
            border-radius: 12px; 
            padding: 12px; 
            text-align: center; 
            border: 2px solid transparent; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.2); 
            position: relative;
            transition: all 0.3s ease;
        }
        .mesa-card.alerta { border-color: var(--alert); animation: parpadeo 2s infinite; }
        .mesa-card.alerta-poda { border-color: #ffeb3b; animation: parpadeo 1.5s infinite; }

        @keyframes parpadeo { 0% { opacity: 1; } 50% { opacity: 0.75; } 100% { opacity: 1; } }
        .semana-info { font-size: 1.1rem; font-weight: bold; margin-top: 5px; }
        
        .notes-display { 
            font-size: 0.8rem; 
            background: rgba(255, 183, 77, 0.15); 
            border: 1px dashed var(--notes-color); 
            color: var(--notes-color); 
            padding: 6px; 
            border-radius: 6px; 
            margin-top: 8px; 
            text-align: left;
            white-space: pre-wrap;
        }
        .atencion-display { 
            font-size: 0.8rem; 
            background: rgba(255, 82, 82, 0.2); 
            border: 1px solid var(--alert); 
            color: #ff8a80; 
            padding: 6px; 
            border-radius: 6px; 
            margin-top: 8px; 
            text-align: center;
        }

        .btn-group { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 6px; 
            margin-top: 10px; 
        }
        
        button { 
            background-color: var(--accent); 
            color: white; 
            border: none; 
            border-radius: 6px; 
            padding: 8px 4px; 
            cursor: pointer; 
            width: 100%; 
            font-weight: bold; 
            font-size: 0.8rem; 
            box-sizing: border-box; 
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 34px;
        }
        
        button.notes-btn { background-color: #2196f3; } 
        button.atencion-btn { background-color: #e65100; color: white; }
        button.atencion-btn.con-enfermedad { background-color: var(--alert); }
        button.reset-btn { background-color: #cf6679; }
        
        .modal { 
            display: none; 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0,0,0,0.8); 
            justify-content: center; 
            align-items: center; 
            z-index: 1000; 
            padding: 10px;
        }
        .modal-content { 
            background: #222; 
            padding: 20px; 
            border-radius: 12px; 
            width: 100%; 
            max-width: 400px; 
            box-sizing: border-box; 
        }
        input, textarea { 
            width: 100%; 
            padding: 10px; 
            margin: 5px 0 15px 0; 
            background: #333; 
            border: 1px solid #555; 
            color: white; 
            box-sizing: border-box; 
            border-radius: 6px; 
        }
        #ia-output {
            min-height: 200px;
            background: #111;
            color: #d1fae5;
            font-family: monospace;
            font-size: 0.85rem;
            white-space: pre-wrap;
            overflow-y: auto;
        }

        @media (max-width: 480px) {
            .panel-container { grid-template-columns: 1fr 1fr; gap: 8px; }
            .quick-grid { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>

    <div class="header-container">
        <div class="logo-cultivo">🌱</div>
        <h1>Ciclo Cultivo Oficina</h1>
    </div>

    <div class="top-controls">
        <div class="user-bar" id="user-bar" style="display:none;"></div>
    </div>
    
    <div class="quick-access">
        <div class="quick-access-title">Accesos rápidos</div>
        <div class="quick-grid">
            <button class="quick-btn sales" onclick="togglePanel('sales-panel')">🧪 Sales<span class="sub">Tabla EC / gramos</span></button>
            <button class="quick-btn notes" onclick="togglePanel('notes-panel')">📝 Notas<span class="sub">Notas generales</span></button>
            <button class="quick-btn vegeta" onclick="togglePanel('vegeta-panel')">🥦 Vegeta<span class="sub">Mesa especial</span></button>
            <button class="quick-btn report" onclick="abrirModalReporte()">📋 Reporte<span class="sub">Tiempos de cultivo</span></button>
            <button class="quick-btn ia" onclick="abrirModalIA()">🤖 IA Gemini<span class="sub">Athena / Expert Mode</span></button>
        </div>
    </div>

    <!-- PANELES DESPLEGABLES -->
    <div class="panel-open" id="sales-panel">
        <div class="sales-panel">
            <div class="sales-title">🧪 SALES = GRAMOS × 10L</div>
            <div class="sales-controls">
                <label for="sales-litros">Litros:</label>
                <input id="sales-litros" class="sales-litros" type="number" min="0.1" step="0.1" value="10" inputmode="decimal" oninput="actualizarTablaSales()">
            </div>
            <div class="sales-scroll">
                <table class="sales-table">
                    <thead><tr><th>EC</th><th>GROW / BLOOM</th><th>CORE</th></tr></thead>
                    <tbody id="sales-table-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="panel-container">
        <div class="columna-lado" id="col-lado-a"></div>
        <div class="columna-lado" id="col-lado-b"></div>
    </div>

    <div class="panel-open" id="vegeta-panel">
        <div class="vegeta-container" id="col-vegeta"></div>
    </div>

    <div class="panel-open" id="notes-panel">
        <div class="mesa-card" style="border:1px dashed #4dd0e1;">
            <strong style="color:#ffffff; display:block; margin-bottom:5px;">Notas generales</strong>
            <textarea id="nota-general-input" placeholder="Escribí acá notas generales..."></textarea>
            <button style="background:#009688;" onclick="guardarNotaGeneral();">Guardar notas generales</button>
        </div>
    </div>

    <!-- MODAL IA GEMINI -->
    <div class="modal" id="modal-ia">
      <div class="modal-content">
        <h3 style="margin-top:0; color:#7dd3fc;">Asistente IA Gemini</h3>
        <label>Tu duda o síntoma:</label>
        <textarea id="ia-input" placeholder="Ej: Tengo las puntas quemadas y mi EC es de 2.5..."></textarea>
        <button style="background:#0284c7;" id="btn-ia-preguntar" onclick="preguntarIA()">Preguntar a Gemini</button>
        
        <label style="margin-top:10px; display:block;">Respuesta del Experto:</label>
        <textarea id="ia-output" readonly placeholder="La respuesta aparecerá aquí..."></textarea>
        
        <button style="background:#555; margin-top:8px;" onclick="cerrarModalIA()">Cerrar</button>
      </div>
    </div>

    <!-- MODALES DE CONFIGURACIÓN (EXISTENTES) -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <h3 id="modal-title" style="color:var(--accent);">Configurar Mesa</h3>
            <label>Fecha de inicio:</label>
            <input type="date" id="fecha-input">
            <label>¿En qué semana avisar?:</label>
            <input type="number" id="objetivo-input" value="8">
            <button onclick="guardarFecha()">Guardar</button>
            <button style="background:#555; margin-top: 4px;" onclick="cerrarModal()">Cancelar</button>
        </div>
    </div>

    <div class="modal" id="modal-notes">
        <div class="modal-content">
            <h3 style="color:#2196f3;">Notas de la Mesa</h3>
            <textarea id="notas-input"></textarea>
            <button style="background:#2196f3;" onclick="guardarNota()">Guardar Nota</button>
            <button style="background:#555; margin-top: 4px;" onclick="cerrarModalNotas()">Cancelar</button>
        </div>
    </div>

    <div class="modal" id="modal-login">
      <div class="modal-content" style="max-width:300px; text-align:center;">
        <h3 style="color:var(--accent);">Acceso</h3>
        <input id="login-user" placeholder="Usuario" />
        <input id="login-pass" type="password" placeholder="Contraseña" />
        <button onclick="doLogin()">Ingresar</button>
        <div id="login-error" style="color:red; display:none; font-size:0.8rem; margin-top:5px;"></div>
      </div>
    </div>

    <script>
        // --- CONFIGURACIÓN ---
        const STORAGE_KEY = 'datosCultivoV3_Final';
        const GENERAL_NOTES_KEY = 'notasGeneralesCultivoV1';
        
        // 🔑 REEMPLAZA ESTO CON TU API KEY DE GOOGLE AI STUDIO
        const GEMINI_API_KEY = "TU_API_KEY_AQUI"; 

        const SALES_BASE = [
            { ec: 0.5, grow: 2.8, core: 1.7 },
            { ec: 1.0, grow: 6.1, core: 3.6 },
            { ec: 1.5, grow: 9.4, core: 5.7 },
            { ec: 1.8, grow: 11.1, core: 6.8 },
            { ec: 2.0, grow: 12.9, core: 7.7 },
            { ec: 2.5, grow: 16.5, core: 9.9, especial: true },
            { ec: 3.0, grow: 20.3, core: 12.2 }
        ];

        // --- LÓGICA IA GEMINI ---
        async function preguntarIA() {
            const input = document.getElementById('ia-input');
            const out = document.getElementById('ia-output');
            const btn = document.getElementById('btn-ia-preguntar');
            
            const pregunta = input.value.trim();
            if (!pregunta) return;

            // Bloquear interfaz mientras piensa
            btn.disabled = true;
            btn.innerText = "Pensando...";
            out.value = "Conectando con Gemini...";

            const contextoSistema = `Eres un experto técnico en cultivo de cannabis de alto rendimiento. 
            Utilizas exclusivamente la línea de nutrientes Athena Ag (Grow, Bloom, Core, Clean). 
            Tu objetivo es dar consejos precisos sobre EC, pH y manejo de plagas (Oidio, Araña Roja).
            Contexto actual: El usuario cultiva en una oficina técnica. 
            Si el usuario pregunta por dosis, básate en que Athena usa aprox 1.1g/L de Grow y 0.6g/L de Core para una EC de 1.8.
            Responde de forma concisa y profesional.`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ text: contextoSistema + "\n\nPregunta del usuario: " + pregunta }]
                        }]
                    })
                });

                const data = await response.json();
                
                if (data.candidates && data.candidates[0].content) {
                    const respuesta = data.candidates[0].content.parts[0].text;
                    out.value = respuesta;
                } else {
                    out.value = "Error: La IA no pudo generar una respuesta. Revisa tu API Key.";
                }

            } catch (err) {
                out.value = "Error de conexión: " + err.message;
            } finally {
                btn.disabled = false;
                btn.innerText = "Preguntar a Gemini";
            }
        }

        function abrirModalIA() { document.getElementById('modal-ia').style.display = 'flex'; }
        function cerrarModalIA() { document.getElementById('modal-ia').style.display = 'none'; }

        // --- RESTO DE FUNCIONES (SISTEMA DE MESAS) ---
        let datos = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};

        function togglePanel(id) {
            const p = document.getElementById(id);
            const isV = p.classList.contains('visible');
            document.querySelectorAll('.panel-open').forEach(x => x.classList.remove('visible'));
            if(!isV) p.classList.add('visible');
            if(id === 'sales-panel') actualizarTablaSales();
        }

        function actualizarTablaSales() {
            const litros = parseFloat(document.getElementById('sales-litros').value) || 10;
            const tbody = document.getElementById('sales-table-body');
            tbody.innerHTML = SALES_BASE.map(item => `
                <tr class="${item.especial ? 'seleccionada' : ''}">
                    <td>${item.ec}</td>
                    <td><span class="gramos">${(item.grow * litros / 10).toFixed(1)}g</span> <span class="por-litro">${(item.grow/10).toFixed(2)}g/L</span></td>
                    <td><span class="gramos">${(item.core * litros / 10).toFixed(1)}g</span> <span class="por-litro">${(item.core/10).toFixed(2)}g/L</span></td>
                </tr>
            `).join('');
        }

        function inicializarApp() {
            const mesas = [
                {id:'A1', c:'col-lado-a'}, {id:'A2', c:'col-lado-a'}, {id:'A3', c:'col-lado-a'},
                {id:'A4', c:'col-lado-a'}, {id:'A5', c:'col-lado-a'}, {id:'A6', c:'col-lado-a'},
                {id:'B1', c:'col-lado-b'}, {id:'B2', c:'col-lado-b'}, {id:'B3', c:'col-lado-b'},
                {id:'B4', c:'col-lado-b'}, {id:'B5', c:'col-lado-b'}, {id:'B6', c:'col-lado-b'},
                {id:'VEGETA', c:'col-vegeta'}
            ];

            mesas.forEach(m => {
                const cont = document.getElementById(m.c);
                const d = datos[m.id] || {};
                const card = document.createElement('div');
                card.className = 'mesa-card';
                
                let infoHTML = `<strong>${m.id}</strong>`;
                if(d.fecha) {
                    const s = Math.floor((new Date() - new Date(d.fecha)) / (1000*60*60*24*7));
                    card.style.background = s >= d.objetivo ? '#b71c1c' : '#2e7d32';
                    infoHTML += `<div class="semana-info">Semana ${s}</div>`;
                } else {
                    infoHTML += `<div style="font-size:0.7rem; opacity:0.6;">Vacío</div>`;
                }

                if(d.atencion) infoHTML += `<div class="atencion-display">${d.atencion}</div>`;

                card.innerHTML = infoHTML + `
                    <div class="btn-group">
                        <button onclick="abrirModal('${m.id}')">⚙️</button>
                        <button class="notes-btn" onclick="abrirModalNotas('${m.id}')">📝</button>
                    </div>
                `;
                cont.appendChild(card);
            });
        }

        // --- LOGIN SIMPLE ---
        async function sha256(m) { const b = new TextEncoder().encode(m); const h = await crypto.subtle.digest('SHA-256', b); return Array.from(new Uint8Array(h)).map(x => x.toString(16).padStart(2, '0')).join(''); }
        async function doLogin() {
            const u = document.getElementById('login-user').value.toLowerCase();
            const p = await sha256(document.getElementById('login-pass').value);
            if(u === 'benja' && p === '920fc495b85fbf9f71cfe710f490b96f3d30b11641d4dfe879fb13e150e4d314') {
                document.getElementById('modal-login').style.display = 'none';
                localStorage.setItem('auth', 'true');
                inicializarApp();
            } else {
                document.getElementById('login-error').style.display = 'block';
                document.getElementById('login-error').innerText = "Error de acceso";
            }
        }

        window.onload = () => {
            if(localStorage.getItem('auth')) inicializarApp();
            else document.getElementById('modal-login').style.display = 'flex';
        };

        // Funciones de modal básicas
        let idActual = "";
        function abrirModal(id) { idActual = id; document.getElementById('modal').style.display = 'flex'; }
        function cerrarModal() { document.getElementById('modal').style.display = 'none'; }
        function abrirModalNotas(id) { idActual = id; document.getElementById('modal-notes').style.display = 'flex'; }
        function cerrarModalNotas() { document.getElementById('modal-notes').style.display = 'none'; }
        
        function guardarFecha() {
            const f = document.getElementById('fecha-input').value;
            const o = document.getElementById('objetivo-input').value;
            if(!datos[idActual]) datos[idActual] = {};
            datos[idActual].fecha = f;
            datos[idActual].objetivo = o;
            localStorage.setItem(STORAGE_KEY, JSON.stringify(datos));
            location.reload();
        }

        function guardarNota() {
            const n = document.getElementById('notas-input').value;
            if(!datos[idActual]) datos[idActual] = {};
            datos[idActual].notas = n;
            localStorage.setItem(STORAGE_KEY, JSON.stringify(datos));
            location.reload();
        }
    </script>
</body>
</html>
